!
! osmo-bts-trx.cfg - OsmoBTS BTS#0 (osmo-bts-trx, TRXD towards fake_trx /
! Calypso TRX). Base: OsmoBTS (192.168.1.15-bc49-dirty) configuration saved
! from vty.
!!
!
log file /var/log/osmocom/osmo-bts-trx.log
 logging color 1
 logging timestamp 1
 logging print category-hex 0
 logging print category 1
 logging print file basename last
 logging print level 1
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
!
line vty
 no login
!
e1_input
 e1_line 0 driver ipa
 e1_line 0 port 0
 no e1_line 0 keepalive
!
phy 0
 instance 0
  osmotrx rx-gain 40
  osmotrx tx-attenuation 50
 osmotrx ip local 127.0.0.1
 osmotrx ip remote 127.0.0.1
 no osmotrx timing-advance-loop
 ! Calypso TRX (transceiver firmware, --osmo-trx): IND CLOCK carries the
 ! firmware fn; with the defaults (fn-advance 2, rts-advance 3) bursts reach
 ! the firmware too late and are dropped (STALE BURST). Real osmo-trx values:
 ! 20 and 5.
 osmotrx fn-advance 20
 osmotrx rts-advance 5

bts 0
 band GSM900
 ipa unit-id __IPA_UNIT_ID__ 0
 oml remote-ip 127.0.0.1
 rtp jitter-buffer 100
 paging queue-size 200
 paging lifetime 0
 min-qual-rach 50
 min-qual-norm -5
 gsmtap-sapi ccch
 gsmtap-sapi pdtch
 trx 0
  power-ramp max-initial 23000 mdBm
  power-ramp step-size 2000 mdB
  power-ramp step-interval 1
  ms-power-control osmo
  phy 0 instance 0
