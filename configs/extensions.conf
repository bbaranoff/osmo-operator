; =============================================================================
; extensions.conf - Asterisk dialplan template, one instance per operator.
; Placeholders __OPERATOR_ID__ and __MSISDN_PFX__ are filled in by
; generate_configs.sh / start-docker.sh.
;
; NUMBERING PLAN
;   100          Linphone A (local softphone)
;   200          Linphone B (local softphone)
;   500          plays /root/lithium.wav
;   600          echo test
;   700          welcome announcement
;   <pfx><op>XX  local GSM subscribers (MSISDN = node prefix, operator id, rank)
;   9<number>    inter-operator call from a softphone
;   00<number>   international call via Zadarma (E.164)
;   0[1-9]+8dig  French national number via Zadarma
;
; CONTEXTS
;   [sub-record]   timestamped MixMonitor recording of every call
;   [sub-annuaire] caller name lookup (annuaire.conf, generated)
;   [internal]     calls from local softphones
;   [gsm_in]       calls from OsmoMSC (GSM -> Asterisk)
;   [interop_in]   calls from a remote operator (SIP trunk)
;   [zadarma_in]   calls from the external operator (Zadarma)
;   [interop_out]  routing to remote operators; extensions are GENERATED and
;                  appended by start-docker.sh / generate_configs.sh (one
;                  extension per remote operator -> interop_trunk_opN)
;
; CALL SCENARIOS
;   1. MS -> MS (same operator)   : MS -> MSC -> MNCC -> Asterisk -> MNCC -> MSC -> MS
;   2. MS -> Linphone             : MS -> MSC -> Asterisk SIP -> Linphone
;   3. Linphone -> MS             : Linphone SIP -> Asterisk -> MNCC -> MSC -> MS
;   4. Linphone A -> Linphone B   : local SIP
;   5. MS(OpX) -> MS(OpY)         : MNCC -> AstX -> SIP trunk -> AstY -> MNCC -> MS
;   6. MS -> echo / announcement  : audio test
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
MSC_LOCAL=127.0.0.1
; Operator id, used as label in recording file names (sub-record).
OP_PREFIX=__OPERATOR_ID__
; ── Monitoring: timestamped recording of ALL calls (yes/no) ──
; The MixMonitor audiohook takes the bridge out of native RTP, forcing
; gsm<->alaw transcoding on external (Zadarma) legs. Do not add an adaptive
; JITTERBUFFER on the calling (MS) leg: it only buffers the uplink and adds
; latency; put it on the trunk leg if needed.
CALL_RECORDING=yes
RECORDINGS_DIR=/var/spool/asterisk/monitor

; ── Inbound from Zadarma: who rings on a call from outside ──────────────────
; Value = an MSISDN of the HLR (see run_modules/21-abonnes-hlr.sh):
;   100101  the bench phone (osmocom-bb / postmarketOS VM)
;   100102  the second mobile
; To ring a softphone instead, target [internal] rather than gsm_msc in the
; Dial line of [zadarma_in] (end of file).
DEST_ZADARMA_IN=100101

; =============================================================================
; [sub-record] - starts the timestamped MixMonitor recording of the call.
;   Called at the top of each call: Gosub(sub-record,s,1(<called_number>))
;   File: ${RECORDINGS_DIR}/<date>_<time>_op<N>_<caller>_to_<called>_<uid>.wav
;   plus -ul.wav (uplink, r()) and -dl.wav (downlink, t()) on the calling
;   (MS) channel, so a degradation can be attributed to one direction.
;   Option 'b': record only while the call is bridged.
;   Disabled globally with CALL_RECORDING=no. Requires app_mixmonitor.so.
;   Edit THIS file: /etc/asterisk/extensions.conf is a copy regenerated at
;   start-up.
; =============================================================================
[sub-record]
exten => s,1,GotoIf($["${CALL_RECORDING}" != "yes"]?skip)
 ; Adaptive jitterbuffer intentionally not set here: on the calling (MS)
 ; channel it would buffer the uplink only (see [globals]).
 ; same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(REC_TS=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)})
 same => n,Set(REC_NAME=${FILTER(A-Za-z0-9_-,${REC_TS}_op${OP_PREFIX}_${CALLERID(num)}_to_${ARG1}_${UNIQUEID})})
 same => n,MixMonitor(${RECORDINGS_DIR}/${REC_NAME}.wav,br(${RECORDINGS_DIR}/${REC_NAME}-ul.wav)t(${RECORDINGS_DIR}/${REC_NAME}-dl.wav))
 same => n,NoOp(=== REC → ${RECORDINGS_DIR}/${REC_NAME}.wav ===)
 same => n(skip),Return()

; =============================================================================
; [sub-annuaire] - caller name lookup
; =============================================================================
; The bench directory (data/noms.txt, drawn by start-docker.sh, written to
; /etc/osmocom/annuaire.csv) gives each subscriber a name, so the called
; mobile displays "Aline Boulanger" rather than "20001".
;
; Must be called AFTER Set(CALLERID(all)=<...>), which rebuilds the CallerID
; without a name.
;
; The entries live in annuaire.conf, written by start-docker.sh at launch
; (one extension per MSISDN). The _X. pattern below is the fallback: an exact
; extension wins over a pattern, so a known entry wins and an unknown number
; returns unchanged (also when annuaire.conf does not exist).
[sub-annuaire]
exten => _X.,1,NoOp(=== ANNUAIRE : ${EXTEN} inconnu - CallerID inchange ===)
 same => n,Return()
exten => 0,1,NoOp(=== ANNUAIRE : appelant anonyme ===)
 same => n,Return()

#include "annuaire.conf"

; =============================================================================
; [internal] - calls FROM local softphones
; =============================================================================
[internal]

; ── 500: lithium audio playback ─────────────────────────────────────────────
;   Plays /root/lithium.wav of the container (8 kHz mono WAV recommended).
;   Playback(/root/lithium) without extension resolves to /root/lithium.wav.
;   The file must be provided in each container.
exten => 500,1,NoOp(=== LITHIUM - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(/root/lithium)
 same => n,Hangup()

; ── Audio tests ──────────────────────────────────────────────────────────────
exten => 600,1,NoOp(=== ECHO TEST - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 ; No announcement before the echo for bench calls (ECHO_NO_PROMPT=1, set by
 ; osmo-phonesim-banc.py on its Originate): with MixMonitor in the bridge,
 ; the Playback -> Echo transition emits a burst of silence RTP packets that
 ; desynchronises the BTS jitter buffer. The bench plays the announcement on
 ; the mobile leg instead (DIAL_OPTS=A(demo-echotest) in the Dial below).
 same => n,GotoIf($["${ECHO_NO_PROMPT}" = "1"]?echo)
 same => n,Playback(demo-echotest)
 same => n(echo),Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 700,1,NoOp(=== ANNONCE - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; ── Softphone -> Softphone ───────────────────────────────────────────────────
exten => 100,1,NoOp(=== SIP: → Linphone A - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

exten => 200,1,NoOp(=== SIP: → Linphone B - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone -> local GSM ───────────────────────────────────────────────────
; Local operator numbers: MSISDN prefix, operator id, then 2 digits (rank of
; the mobile), following the HLR plan (start-docker.sh,
; run_modules/21-abonnes-hlr.sh, scripts/sms-routing-setup.sh).
exten => ___MSISDN_PFX____OPERATOR_ID__XX,1,NoOp(=== SIP -> GSM local (Op__OPERATOR_ID__): ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Set(CALLERID(all)=<${CALLERID(num)}>)
 ; Caller name from the bench directory. ANNU_NUM rather than CALLERID(num)
 ; directly: an anonymous caller would give an empty extension and a failing
 ; Gosub on every call.
 same => n,Set(ANNU_NUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:0)})
 same => n,Gosub(sub-annuaire,${ANNU_NUM},1)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT${DIAL_OPTS})
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone -> inter-operator GSM ──────────────────────────────────────────
; Dial 9 + full number (e.g. 920001 to reach 20001 on Op2)
exten => _9.,1,NoOp(=== SIP -> INTER-OP: ${EXTEN:1} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN:1}))
 same => n,Goto(interop_out,${EXTEN:1},1)

; ── Outbound to Zadarma: 00 + international number ──────────────────────────
; More specific than the catch-all _X. below, hence matched first.
; The 00 is replaced by the E.164 "+" form expected by Zadarma.
exten => _00.,1,NoOp(=== SIP -> ZADARMA: +${EXTEN:2} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_${EXTEN:2}))
; The "+" is mandatory: Zadarma answers 404 Not Found to a bare E.164 number
; (sip:33656678074@...) and accepts sip:+33656678074@...
 same => n,Dial(PJSIP/+${EXTEN:2}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT: échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()


; ── Outbound to Zadarma: French NATIONAL number, dialled as is ──────────────
; Pattern: 0, one digit 1-9, then 8 digits (the ten digits of the French
; plan). The second digit excludes 0, so there is no overlap with _00.
; (international) above; against the catch-all _X. the fixed-length pattern
; wins. Conversion: 0612345678 -> +33612345678 (the leading 0 is the national
; prefix and is replaced by the country code; the "+" is mandatory).
exten => _0[1-9]XXXXXXXX,1,NoOp(=== SIP -> ZADARMA (national): +33${EXTEN:1} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_33${EXTEN:1}))
 same => n,Dial(PJSIP/+33${EXTEN:1}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT (national): échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()

; ── Catch-all: try the local MSC ────────────────────────────────────────────
exten => _X.,1,NoOp(=== SIP -> GSM fallback: ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT${DIAL_OPTS})
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [gsm_in] - calls FROM OsmoMSC (GSM -> Asterisk)
;
; Pattern layout (most specific first; Asterisk matches the most specific
; pattern, no priority needed):
;   1. fixed numbers (100, 200, 500, 600)        -> local services
;   2. _<pfx><op>XX (fixed length)               -> local MS, same operator
;   3. _00. / _0[1-9]XXXXXXXX / _+X.             -> Zadarma
;   4. _<pfx><op>.                               -> malformed local number
;   5. _X. (catch-all)                           -> inter-operator routing
; Do not add two patterns of the same length for the same numbers: Asterisk
; keeps only one of the duplicates.
; =============================================================================
[gsm_in]

; ── 500: lithium audio playback (/root/lithium.wav of the container) ──
exten => 500,1,NoOp(=== GSM -> LITHIUM - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(/root/lithium)
 same => n,Hangup()

; ── Audio tests ──────────────────────────────────────────────────────────────
exten => 600,1,NoOp(=== GSM -> ECHO TEST - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; ── MS -> Linphone ───────────────────────────────────────────────────────────
exten => 100,1,NoOp(=== GSM -> Linphone A - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

exten => 200,1,NoOp(=== GSM -> Linphone B - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── MS -> local MS (same operator) ───────────────────────────────────────────
; Pattern: MSISDN prefix, operator id, then 2 digits.
exten => ___MSISDN_PFX____OPERATOR_ID__XX,1,NoOp(=== GSM -> GSM local (Op__OPERATOR_ID__): ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Set(CALLERID(all)=<${CALLERID(num)}>)
 ; Caller name from the bench directory. ANNU_NUM rather than CALLERID(num)
 ; directly: an anonymous caller would give an empty extension and a failing
 ; Gosub on every call.
 same => n,Set(ANNU_NUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:0)})
 same => n,Gosub(sub-annuaire,${ANNU_NUM},1)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Outbound to Zadarma: 00 + international number ──────────────────────────
; More specific than the catch-all _X. below, hence matched first.
; The 00 is replaced by the E.164 "+" form expected by Zadarma.
exten => _00.,1,NoOp(=== GSM -> ZADARMA: +${EXTEN:2} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_${EXTEN:2}))
; The "+" is mandatory: Zadarma answers 404 Not Found to a bare E.164 number
; (sip:33656678074@...) and accepts sip:+33656678074@...
 same => n,Dial(PJSIP/+${EXTEN:2}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT: échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()

; ── Outbound to Zadarma: French NATIONAL number, dialled as is ──────────────
; Pattern: 0, one digit 1-9, then 8 digits (the ten digits of the French
; plan). The second digit excludes 0, so there is no overlap with _00.
; (international) above; against the catch-all _X. the fixed-length pattern
; wins. Conversion: 0612345678 -> +33612345678 (the leading 0 is the national
; prefix and is replaced by the country code; the "+" is mandatory).
exten => _0[1-9]XXXXXXXX,1,NoOp(=== GSM -> ZADARMA (national): +33${EXTEN:1} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_33${EXTEN:1}))
 same => n,Dial(PJSIP/+33${EXTEN:1}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT (national): échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()

; ── E.164 with "+": what the MSC actually presents ───────────────────────────
; osmo-msc normalises an international 00 number to E.164 with a leading "+"
; (0033656678074 dialled on the MS arrives here as +33656678074). The "+" is
; kept in the Dial (Zadarma returns 404 without it). The trunk itself needs
; valid credentials in pjsip.conf, otherwise the call ends in Congestion().
exten => _+X.,1,NoOp(=== GSM -> ZADARMA (E.164): ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_${EXTEN:1}))
 same => n,Dial(PJSIP/${EXTEN}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT (E.164): échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()

; ── Malformed local number ───────────────────────────────────────────────────
; _<pfx><op>. is more specific than _X. and less than the _<pfx><op>XX above:
; an exact local number goes to the MSC, a malformed local number is rejected
; here (avoids a routing loop), everything else goes inter-operator.
exten => ___MSISDN_PFX____OPERATOR_ID__.,1,NoOp(=== GSM -> numéro local inexistant: ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

; ── Inter-operator routing (catch-all) via [interop_out] ─────────────────────
exten => _X.,1,NoOp(=== GSM -> routage inter-op: ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Goto(interop_out,${EXTEN},1)

; =============================================================================
; [interop_in] - calls FROM a remote operator (SIP trunk)
; =============================================================================
[interop_in]

; Remote MS -> local MS
exten => ___MSISDN_PFX____OPERATOR_ID__XX,1,NoOp(=== INTER-OP -> GSM local: ${EXTEN} - CallerID distant: ${CALLERID(all)} ===)
 same => n,Set(CALLERID(all)=<${CALLERID(num)}>)
 ; Caller name from the bench directory. ANNU_NUM rather than CALLERID(num)
 ; directly: an anonymous caller would give an empty extension and a failing
 ; Gosub on every call.
 same => n,Set(ANNU_NUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:0)})
 same => n,Gosub(sub-annuaire,${ANNU_NUM},1)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; Remote operator -> local Linphone
exten => 100,1,NoOp(=== INTER-OP -> Linphone A - CallerID distant: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Hangup()

exten => 200,1,NoOp(=== INTER-OP -> Linphone B - CallerID distant: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Hangup()

; Clean rejection
exten => _X.,1,NoOp(=== INTER-OP -> numéro inconnu: ${EXTEN} - CallerID distant: ${CALLERID(all)} ===)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [zadarma_in] - calls FROM the external operator (Zadarma)
;
; Zadarma presents the call on the SIP login or on a DID. Everything is
; routed to the GSM mobile DEST_ZADARMA_IN ([globals]); change it to ring a
; softphone (100 / 200) or an IVR instead.
; =============================================================================
[zadarma_in]
; The channel must keep the destination number as its extension: the
; DestExten of the PJSIP channel created by Dial inherits the extension of
; the calling channel, and the bench modem (tools/osmo-phonesim-banc.py)
; rings the phone only on a DialBegin whose DestExten equals its MSISDN.
; Routing through an "s" extension would make the inbound call invisible to
; the handset. Hence the Goto to ${DEST_ZADARMA_IN}, which carries the
; processing.
;
; The entry pattern must never match a single character: "h" (hangup), "i",
; "t" and "T" are special extensions, and catching "h" would replay the whole
; processing on a dead channel in a loop. A called number has at least two
; characters and starts with "+" or a digit, so no special extension matches.
exten => _[+0-9].,1,Goto(${DEST_ZADARMA_IN},1)
exten => s,1,Goto(${DEST_ZADARMA_IN},1)
exten => i,1,NoOp(=== ZADARMA IN: numéro appelé invalide (${INVALID_EXTEN}) ===)
 same => n,Goto(${DEST_ZADARMA_IN},1)

; The processing, carried by the local MSISDN itself. Fixed-length pattern,
; hence more specific than _[+0-9]. above. If DEST_ZADARMA_IN leaves this
; plan, widen this pattern.
exten => ___MSISDN_PFX____OPERATOR_ID__XX,1,NoOp(=== ZADARMA IN: appelé=${EXTEN} - CallerID: ${CALLERID(all)} ===)
 ; Strip the E.164 "+" from the CALLING number: the MSC cannot carry it to
 ; the mobile display. FILTER rather than ${CALLERID(num):1}, so a caller
 ; already without "+" does not lose its first digit.
 same => n,Set(CALLERID(num)=${FILTER(0-9,${CALLERID(num)})})
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Gosub(sub-record,s,1(zadarma_in_${CALLERID(num)}))
 ; 45 s, not 30: a mobile-terminated call goes through paging over the air
 ; and the QEMU/Calypso chain takes 10-15 s before the first ring.
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,45,rT)
 same => n,NoOp(=== ZADARMA IN: échec ${DIALSTATUS} vers ${EXTEN} ===)
 same => n,Hangup()

; =============================================================================
; [interop_out] - outbound routing to remote operators
;
; The per-operator extensions are GENERATED and appended by start-docker.sh /
; generate_configs.sh (generate_extensions_interop_out in lib/gabarits.sh):
; one extension per remote operator N, routed to interop_trunk_opN via PJSIP.
; Only the catch-all is declared here; do not declare it twice.
; =============================================================================
[interop_out]

exten => _X.,1,NoOp(=== INTEROP OUT: inconnu ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()
