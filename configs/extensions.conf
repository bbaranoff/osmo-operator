; =============================================================================
; extensions.conf — Asterisk dialplan — Opérateur 1
;
; ┌─────────────────────────────────────────────────────────────────────────┐
; │  PLAN DE NUMÉROTATION                                                   │
; │  100        Linphone A (softphone local)                                │
; │  200        Linphone B (softphone local)                                │
; │  600        Echo test                                                   │
; │  700        Annonce de bienvenue                                        │
; │  NXXXX      Abonnés GSM opérateur N (premier chiffre = identifiant op) │
; ├─────────────────────────────────────────────────────────────────────────┤
; │  CONTEXTES                                                              │
; │  [internal]    Appels depuis softphones locaux                          │
; │  [gsm_in]      Appels entrants depuis OsmoMSC (GSM → Asterisk)         │
; │  [interop_in]  Appels entrants depuis un opérateur distant (SIP trunk)  │
; │  [gsm_out]     Sous-contexte : sortie vers MSC local                   │
; │  [interop_out] Routage vers l'opérateur distant approprié              │
; │                GÉNÉRÉ par start.sh selon le nombre d'opérateurs        │
; └─────────────────────────────────────────────────────────────────────────┘
;
; SCÉNARIOS COUVERTS
; ──────────────────
; 1. MS → MS  (même opérateur)    : MS → MSC → MNCC → Asterisk → MNCC → MSC → MS
; 2. MS → Linphone                 : MS → MSC → Asterisk SIP → Linphone
; 3. Linphone → MS                 : Linphone SIP → Asterisk → MNCC → MSC → MS
; 4. Linphone A → Linphone B       : SIP local
; 5. MS(OpX) → MS(OpY) inter-op   : MNCC → AstX → SIP trunk → AstY → MNCC → MS
; 6. MS → echo / annonce           : test audio
;
; NOTE : [interop_out] est ajouté en fin de fichier par start.sh.
;        Il contient une extension par opérateur distant, routée vers
;        le trunk interop_trunk_opX correspondant.
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
MSC_LOCAL=127.0.0.1
OP_PREFIX=1
; ── Monitoring : enregistrement horodaté de TOUS les appels (yes/no) ──
; [2026-08-12] PASSÉ À `no` — latence sur le MONTANT vers Zadarma.
; `yes` ne coûte pas que l'écriture d'un .wav, il enclenche DEUX choses dans
; [sub-record], et les deux frappent le montant seul :
;   1. `Set(JITTERBUFFER(adaptive)=default)` (l. ~60). Le Gosub tourne sur le
;      canal APPELANT (le MS) et AVANT le Dial : le tampon est posé sur le côté
;      LECTURE de ce canal, donc sur l'audio MS→Asterisk. La patte Zadarma, née
;      du Dial, n'en a aucune. Asymétrie par construction. Face à la gigue de la
;      chaîne Calypso→gapk→RTP, un JB adaptatif monte à son plafond et y reste.
;   2. L'audiohook MixMonitor sort le pont du RTP natif → transcodage forcé
;      gsm↔alaw avec Zadarma (cf. pjsip.conf : allow=alaw,ulaw,gsm).
; Remettre `yes` rend les deux d'un coup — et avec eux les .wav -ul/-dl qui
; servent à attribuer une dégradation à un sens. Si tu as besoin des
; enregistrements SANS la latence, garde MixMonitor et retire la ligne
; JITTERBUFFER, ou pose-la sur la patte du tronc (là où est vraiment la gigue),
; jamais sur celle du MS.
CALL_RECORDING=yes
RECORDINGS_DIR=/var/spool/asterisk/monitor

; =============================================================================
; [sub-record] — Démarre l'enregistrement (MixMonitor) horodaté de l'appel.
;   Appelé en tête de chaque appel : Gosub(sub-record,s,1(<numéro_appelé>))
;   Fichier : ${RECORDINGS_DIR}/<date>_<heure>_op<N>_<appelant>_to_<appelé>_<uid>.wav
;   Option 'b' : n'enregistre que l'audio pendant que l'appel est ponté.
;   Désactivable globalement via CALL_RECORDING=no.
;   Nécessite app_mixmonitor.so (cf modules.conf).
; =============================================================================
[sub-record]
exten => s,1,GotoIf($["${CALL_RECORDING}" != "yes"]?skip)
 ; L'enregistrement (audiohook) sort le pont du RTP natif → transcodage forcé.
 ; Un jitterbuffer adaptatif lisse le flux pour éviter les pertes de trames
 ; (translate slin→gsm) qui coupaient le son. Nécessite func_jitterbuffer.so.
 ; [2026-08-13] RETIRÉE — JB posé sur la lecture de la patte MS = le MONTANT seul (cf. /etc/asterisk/extensions.conf)
 ; same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(REC_TS=${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)})
 same => n,Set(REC_NAME=${FILTER(A-Za-z0-9_-,${REC_TS}_op${OP_PREFIX}_${CALLERID(num)}_to_${ARG1}_${UNIQUEID})})
 ; [2026-08-11] r()/t() : le .wav mixe les DEUX sens et ne permet donc pas
 ; d'attribuer une degradation au montant ou au descendant. Sur le canal
 ; appelant (le MS) :  r() = flux LU = MONTANT ;  t() = flux ECRIT = DESCENDANT.
 ; ⚠️ PATCHER ICI, PAS DANS /etc/asterisk : /etc/asterisk/extensions.conf est
 ; une COPIE regeneree au demarrage depuis ce fichier. La modification faite
 ; le 10/08 dans la copie a disparu a la premiere relance (constate le 11/08).
 same => n,MixMonitor(${RECORDINGS_DIR}/${REC_NAME}.wav,br(${RECORDINGS_DIR}/${REC_NAME}-ul.wav)t(${RECORDINGS_DIR}/${REC_NAME}-dl.wav))
 same => n,NoOp(=== REC → ${RECORDINGS_DIR}/${REC_NAME}.wav ===)
 same => n(skip),Return()

; =============================================================================
; [sub-annuaire] — le nom derriere le numero
; =============================================================================
; Le banc ne rend que des MSISDN a cinq chiffres, et « 20001 » ne dit rien a
; personne. L'annuaire du banc (data/noms.txt, tire au hasard par start.sh, ecrit
; dans /etc/osmocom/annuaire.csv) met un etat civil en face de chaque abonne.
; On l'amene ici pour qu'il arrive JUSQU'AU COMBINE : le mobile appele affiche
; alors « Aline Boulanger » et non « 20001 ».
;
; POURQUOI CE SOUS-PROGRAMME EST APPELE APRES Set(CALLERID(all)=<...>) :
; cette ligne-la RECONSTRUIT le CallerID sans nom (« <20001> »). L'appeler avant
; reviendrait a poser un nom pour l'effacer aussitot.
;
; Les fiches elles-memes sont dans annuaire.conf, ecrit par start.sh au
; lancement (une extension par MSISDN). Le motif _X. ci-dessous est le repli :
; Asterisk fait primer une extension exacte sur un motif, donc une fiche connue
; gagne, et un numero inconnu ressort d'ici sans rien casser - c'est aussi ce
; qui se passe quand annuaire.conf n'existe pas du tout.
[sub-annuaire]
exten => _X.,1,NoOp(=== ANNUAIRE : ${EXTEN} inconnu - CallerID inchange ===)
 same => n,Return()
exten => 0,1,NoOp(=== ANNUAIRE : appelant anonyme ===)
 same => n,Return()

#include "annuaire.conf"

; =============================================================================
; [internal] — Appels DEPUIS les softphones locaux
; =============================================================================
[internal]

; ── 500 : lecture audio lithium ─────────────────────────────────────────────
;   Joue /root/lithium.wav du conteneur (WAV 8 kHz mono recommandé).
;   Playback(/root/lithium) sans extension → Asterisk résout /root/lithium.wav.
;   Fichier à fournir dans chaque conteneur (osmo-operator-1 et distant).
exten => 500,1,NoOp(=== LITHIUM - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(/root/lithium)
 same => n,Hangup()

; ── Tests audio ──────────────────────────────────────────────────────────────
exten => 600,1,NoOp(=== ECHO TEST - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 700,1,NoOp(=== ANNONCE - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; ── Softphone → Softphone ────────────────────────────────────────────────────
exten => 100,1,NoOp(=== SIP: → Linphone A - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

exten => 200,1,NoOp(=== SIP: → Linphone B - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone → GSM local ────────────────────────────────────────────────────
; Numéros de l'opérateur local : <numéro d'opérateur> suivi de 4 chiffres.
; Le plan est celui du HLR (start.sh, run_modules/21-abonnes-hlr.sh et
; scripts/sms-routing-setup.sh) : MSISDN = opérateur * 10000 + rang du mobile.
; Le motif était figé sur « 1 » : sur l'opérateur 2, dont les abonnés sont
; 20001 et 20002, aucun appel local ne matchait plus. Il tombait dans le
; fourre-tout _X. « routage inter-op » et partait chercher hors du nœud un
; abonné qui était sur place.
exten => ___MSISDN_PFX____OPERATOR_ID__XX,1,NoOp(=== SIP -> GSM local (Op__OPERATOR_ID__): ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Set(CALLERID(all)=<${CALLERID(num)}>)
 ; Le nom de l'appelant, depuis l'annuaire du banc. ANNU_NUM plutot que
 ; CALLERID(num) directement : un appelant anonyme donnerait une extension vide
 ; et un Gosub en echec bruyant a chaque appel.
 same => n,Set(ANNU_NUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:0)})
 same => n,Gosub(sub-annuaire,${ANNU_NUM},1)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone → GSM inter-opérateur ──────────────────────────────────────────
; Composer 9 + numéro complet (ex: 920001 pour joindre 20001 sur Op2)
exten => _9.,1,NoOp(=== SIP -> INTER-OP: ${EXTEN:1} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN:1}))
 same => n,Goto(interop_out,${EXTEN:1},1)

; ── Catch-all : essayer le MSC local ────────────────────────────────────────
;
; ── Sortant vers Zadarma : 00 + numéro international ────────────────────────
; Plus spécifique que le catch-all _X. ci-dessous, donc prioritaire.
; Le 00 est retiré et remplacé par le format E.164 attendu par Zadarma.
exten => _00.,1,NoOp(=== SIP -> ZADARMA: +${EXTEN:2} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_${EXTEN:2}))
; [2026-08-09] LE « + » EST OBLIGATOIRE. Mesure A/B sur le tronc, même session :
;   INVITE sip:33656678074@sip.zadarma.com   -> SIP/2.0 404 Not Found
;   INVITE sip:+33656678074@sip.zadarma.com  -> 100 trying, 183 Session Progress
;   INVITE sip:0656678074@sip.zadarma.com    -> 180 Ringing, "zadarma answered"
; ${EXTEN:2} retirait le 00 sans rien remettre : Zadarma refuse l'E.164 nu. Tous
; les appels sortants via Asterisk échouaient donc en 404 -> Congestion() -> 503
; vers le MSC, MSC comme Linphone. Et côté MS ça se voyait comme un raccrochage
; qui « ne marche pas » : sans appel côté réseau, ni CALL PROCEEDING ni RELEASE
; COMPLETE, donc T308 jusqu'à son terme (30 s).
 same => n,Dial(PJSIP/+${EXTEN:2}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT: échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()

exten => _X.,1,NoOp(=== SIP -> GSM fallback: ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [gsm_in] — Appels entrants DEPUIS OsmoMSC (GSM → Asterisk)
;
; ARCHITECTURE DES PATTERNS (du plus spécifique au moins spécifique) :
;   1. Numéros fixes (100, 200, 600)       → services locaux
;   2. _NXXXX  (5 chiffres, préfixe op)    → MS local même opérateur
;   3. _X.     (catch-all)                  → routage inter-op ou rejet
;
; Asterisk matche le pattern le PLUS SPÉCIFIQUE en premier.
; _NXXXX (5 chars fixes) bat _X. (wildcard) — pas besoin de priorité.
;
; NOTE : les patterns _[0-9][0-9]XXXX et _[0-9]XXXXX sont SUPPRIMÉS
; car ils sont des alias l'un de l'autre (6 chiffres quelconques)
; et causent des conflits de priorité avec Asterisk.
; =============================================================================
[gsm_in]

; ── 500 : lecture audio lithium (/root/lithium.wav du conteneur) ──
exten => 500,1,NoOp(=== GSM -> LITHIUM - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(/root/lithium)
 same => n,Hangup()

; ── Tests audio ──────────────────────────────────────────────────────────────
exten => 600,1,NoOp(=== GSM -> ECHO TEST - CallerID: ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; ── MS → Linphone ────────────────────────────────────────────────────────────
exten => 100,1,NoOp(=== GSM -> Linphone A - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

exten => 200,1,NoOp(=== GSM -> Linphone B - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── MS → MS local (même opérateur) ───────────────────────────────────────────
; Motif : le numéro de l'opérateur suivi de 4 chiffres (10001 pour l'Op1,
; 20001 pour l'Op2...). Voir plus haut : ce motif était figé sur « 1 ».
exten => ___MSISDN_PFX____OPERATOR_ID__XX,1,NoOp(=== GSM -> GSM local (Op__OPERATOR_ID__): ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Set(CALLERID(all)=<${CALLERID(num)}>)
 ; Le nom de l'appelant, depuis l'annuaire du banc. ANNU_NUM plutot que
 ; CALLERID(num) directement : un appelant anonyme donnerait une extension vide
 ; et un Gosub en echec bruyant a chaque appel.
 same => n,Set(ANNU_NUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:0)})
 same => n,Gosub(sub-annuaire,${ANNU_NUM},1)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Routage inter-opérateur (catch-all) ──────────────────────────────────────
; Tout ce qui n'est pas un numéro local ou un service fixe arrive ici.
; On tente le routage inter-op via [interop_out].
; Si le numéro commence par notre propre préfixe → invalide (évite boucle).
;
; ── Sortant vers Zadarma : 00 + numéro international ────────────────────────
; Plus spécifique que le catch-all _X. ci-dessous, donc prioritaire.
; Le 00 est retiré et remplacé par le format E.164 attendu par Zadarma.
exten => _00.,1,NoOp(=== GSM -> ZADARMA: +${EXTEN:2} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_${EXTEN:2}))
; [2026-08-09] LE « + » EST OBLIGATOIRE. Mesure A/B sur le tronc, même session :
;   INVITE sip:33656678074@sip.zadarma.com   -> SIP/2.0 404 Not Found
;   INVITE sip:+33656678074@sip.zadarma.com  -> 100 trying, 183 Session Progress
;   INVITE sip:0656678074@sip.zadarma.com    -> 180 Ringing, "zadarma answered"
; ${EXTEN:2} retirait le 00 sans rien remettre : Zadarma refuse l'E.164 nu. Tous
; les appels sortants via Asterisk échouaient donc en 404 -> Congestion() -> 503
; vers le MSC, MSC comme Linphone. Et côté MS ça se voyait comme un raccrochage
; qui « ne marche pas » : sans appel côté réseau, ni CALL PROCEEDING ni RELEASE
; COMPLETE, donc T308 jusqu'à son terme (30 s).
 same => n,Dial(PJSIP/+${EXTEN:2}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT: échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()

; ── E.164 avec « + » : ce que le MSC présente RÉELLEMENT ─────────────────────
; [2026-08-09] MESURE, pas supposition : composer 0033656678074 depuis le MS
; faisait arriver ici « +33656678074 ». osmo-msc normalise le 00 international
; en E.164 et pose le « + ». Or AUCUN motif de ce contexte ne commençait par
; « + » : ni _00. (le préfixe a disparu), ni le catch-all _X. (X = un CHIFFRE,
; pas « + »). Résultat mesuré, journal Asterisk :
;   res_pjsip_session.c: Call to extension '+33656678074' rejected because
;   extension not found in context 'gsm_in'
; Et côté MS ça se voit comme un raccrochage qui « ne marche pas » : l'appel
; n'existant pas côté réseau, il n'y a ni CALL PROCEEDING ni RELEASE COMPLETE,
; donc le mobile attend l'expiration de T308 (30 s) avant de libérer seul.
; Placé APRÈS _00. et AVANT _X. — un motif littéral « + » n'entre en conflit
; avec aucun des deux, ils ne peuvent pas matcher la même chaîne.
; ⚠️ Ceci ouvre la route ; il reste que le tronc n'est pas configuré
; (ZADARMA_LOGIN_A_REMPLIR -> 401 à chaque enregistrement) : sans identifiants
; valides dans pjsip.conf, l'appel échouera plus loin, en Congestion().
exten => _+X.,1,NoOp(=== GSM -> ZADARMA (E.164): ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(zadarma_${EXTEN:1}))
; Le « + » est déjà là : on le GARDE (cf. la mesure A/B ci-dessus). L'ancienne
; forme ${EXTEN:1} le retirait et retombait dans le cas qui rend 404.
 same => n,Dial(PJSIP/${EXTEN}@zadarma,60,rT)
 same => n,NoOp(=== ZADARMA OUT (E.164): échec ${DIALSTATUS} ===)
 same => n,Congestion()
 same => n,Hangup()

exten => _X.,1,NoOp(=== GSM -> routage inter-op: ${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,GotoIf($["${EXTEN:0:1}" = "1"]?local_fallback)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Goto(interop_out,${EXTEN},1)
 same => n(local_fallback),NoOp(=== Numéro local non trouvé: ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [interop_in] — Appels entrants DEPUIS un opérateur distant (SIP trunk)
; =============================================================================
[interop_in]

; MS distant → MS local
exten => ___MSISDN_PFX____OPERATOR_ID__XX,1,NoOp(=== INTER-OP -> GSM local: ${EXTEN} - CallerID distant: ${CALLERID(all)} ===)
 same => n,Set(CALLERID(all)=<${CALLERID(num)}>)
 ; Le nom de l'appelant, depuis l'annuaire du banc. ANNU_NUM plutot que
 ; CALLERID(num) directement : un appelant anonyme donnerait une extension vide
 ; et un Gosub en echec bruyant a chaque appel.
 same => n,Set(ANNU_NUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:0)})
 same => n,Gosub(sub-annuaire,${ANNU_NUM},1)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; Le motif a CINQ chiffres est supprime : depuis le passage au plan 600xxx,
; tous les MSISDN locaux font six chiffres. Deux motifs pour une seule longueur
; donneraient une extension en double dans le meme contexte, et Asterisk
; n'en garderait qu'une - au hasard de l'ordre de lecture.
 
; Opérateur distant → Linphone local
exten => 100,1,NoOp(=== INTER-OP -> Linphone A - CallerID distant: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Hangup()

exten => 200,1,NoOp(=== INTER-OP -> Linphone B - CallerID distant: ${CALLERID(all)} ===)
 same => n,Gosub(sub-record,s,1(${EXTEN}))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Hangup()

; Refus propre
exten => _X.,1,NoOp(=== INTER-OP -> numéro inconnu: ${EXTEN} - CallerID distant: ${CALLERID(all)} ===)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [interop_out] — Routage sortant vers les opérateurs distants
;
; Ce contexte est GÉNÉRÉ et AJOUTÉ en fin de fichier par start.sh.
; Il contient une extension _NXXXX par opérateur distant (N ≠ 1)
; qui route vers interop_trunk_opN via PJSIP.
;
; Exemple pour Op1 avec 3 opérateurs :
;   exten => _2XXXX → interop_trunk_op2
;   exten => _3XXXX → interop_trunk_op3
;   exten => _X.    → Congestion
; =============================================================================
;
; =============================================================================
; ZADARMA — entrant depuis l'opérateur externe
;
; Zadarma présente l'appel sur votre login SIP ou sur un de vos DID. On route
; tout vers le mobile GSM par défaut ; adaptez DEST_ZADARMA_IN si vous préférez
; sonner un softphone (100 / 200) ou un SVI.
; =============================================================================
[zadarma_in]
exten => _X.,1,NoOp(=== ZADARMA IN: appelé=${EXTEN} - CallerID: ${CALLERID(all)} ===)
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Gosub(sub-record,s,1(zadarma_${EXTEN}))
 same => n,Dial(PJSIP/${DEST_ZADARMA_IN}@gsm_msc,30,rT)
 same => n,NoOp(=== ZADARMA IN: échec ${DIALSTATUS} ===)
 same => n,Hangup()
[interop_out]

; [2026-08-26] CE BLOC ETAIT ECRIT DEUX FOIS, et la seconde en-tete avait perdu
; son retour a la ligne : " same => n,Hangup()[interop_out]". Asterisk ne voyait
; donc PAS une nouvelle section - il ajoutait un second _X. dans le contexte
; deja ouvert, et refusait les trois priorites :
;     WARNING pbx.c:7148 add_priority: Unable to register extension '_X.'
;             priority 1 in 'interop_out', already in use
; Le fourre-tout restait quand meme en place (la premiere copie), donc rien ne
; cassait visiblement - juste six avertissements a chaque chargement, qui
; noyaient ceux qui comptent.
exten => _X.,1,NoOp(=== INTEROP OUT: inconnu ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()
