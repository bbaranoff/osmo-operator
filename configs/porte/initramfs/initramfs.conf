# initramfs.conf of the PORTE (osmo-porte): built with
#   mkinitramfs -d /etc/osmo-porte/initramfs -o /boot/osmo-porte.img VERSION
# booted with « boot=osmo-porte » (scripts/osmo-porte). MODULES=most: the
# TPM, dm-crypt, ext4 and the disk drivers of any machine.
MODULES=most
BUSYBOX=y
COMPRESS=zstd
