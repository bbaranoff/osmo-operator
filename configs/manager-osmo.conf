; manager-osmo.conf - Asterisk AMI account for the mobile bridge.
;
; Installed as /etc/asterisk/manager.d/osmo.conf by start-native.sh. Used by
; tools/osmo-phonesim-banc.py to originate the calls requested by the Android
; phone (the bench modem receives ATD..., the AMI Originate action creates the
; call in Asterisk). The CLI "channel originate" is not available because
; res_clioriginate is not loaded (modules.conf uses autoload = no).
;
; Access is restricted to the local machine: deny all, permit loopback.
[osmo]
secret = osmocom1
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,verbose
write = system,call,originate
