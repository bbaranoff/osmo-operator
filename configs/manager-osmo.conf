; manager-osmo.conf - le compte AMI du raccord mobile.
;
; Pose dans /etc/asterisk/manager.d/osmo.conf par start-direct.sh. Il sert a
; tools/osmo-phonesim-banc.py pour ETABLIR LES APPELS demandes par le telephone
; Android : le modem du banc recoit un ATD..., et le seul moyen de faire naitre
; un appel dans Asterisk depuis l exterieur est l action Originate de l AMI.
;
; Pourquoi pas la CLI : « channel originate » vient du module res_clioriginate,
; absent de cette installation (modules.conf est en autoload = no). L AMI, lui,
; est deja active dans manager.conf - il ne lui manquait qu un compte.
;
; L acces est limite a la machine : deny tout, permit la boucle locale.
[osmo]
secret = osmocom1
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,verbose
write = system,call,originate
