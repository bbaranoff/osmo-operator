# =============================================================================
# sms-routing.conf - inter-operator SMS routing table
#
# Template: __XXX__ placeholders are substituted by apply_config_templates()
# (generate_configs.sh) at container start.
#
# To add an operator:
#   1. add its IP to [operators]
#   2. add its MSISDN prefixes to [routes]
# =============================================================================

[local]
# ID of this operator (substituted at start)
operator_id = __OPERATOR_ID__

[operators]
# operator_id = container_ip
# Addresses on the Docker bridge network (172.20.0.0/24)
1 = 172.20.0.11
2 = 172.20.0.12
# 3 = 172.20.0.13

[routes]
# prefix = operator_id
# Longest-prefix match: the longest matching prefix wins.
#
# -- MSISDN prefixes per operator (adapt to the numbering plan) --------------
#
# Operator 1: extensions 1xxx and MSISDN +33601xxxxxx
10000 = 1
1001 = 1
1002 = 1
1003 = 1
1004 = 1
1005 = 1
33601 = 1
#
# Operator 2: extensions 2xxx and MSISDN +33602xxxxxx
20000 = 2
2001 = 2
2002 = 2
2003 = 2
2004 = 2
2005 = 2
33602 = 2
#
# -- Default route (optional) -----------------------------------------------
# If no prefix matches, the SMS is not routed. Uncomment for a fallback:
# * = 1
