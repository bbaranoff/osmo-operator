; =============================================================================
; pjsip.conf - Asterisk PJSIP configuration for operator __OPERATOR_ID__
;
; Template: __OPERATOR_ID__ / __CONTAINER_IP__ are substituted by
; apply_config_templates() (generate_configs.sh). Inter-operator trunks are
; appended at start by launch/start-docker.sh (generate_pjsip_interop_trunks).
;
; Linphone from the host:
;   Direct: __CONTAINER_IP__:5060  (Docker bridge)
;   linphone_A / tester -> 100  |  linphone_B / testerB -> 200
;   (100/200 are local SIP extensions, outside the MSISDN plan
;    <node>00<op><ms>: the dialplan handles them in [internal], next to
;    500/600/700.)
; =============================================================================

[global]
; debug=no: debug=yes logs every SIP message (REGISTER included) and floods
; /var/log/asterisk/messages. For a one-off capture use
; `asterisk -rx "pjsip set logger on"` (lost on restart); for a capture that
; survives a restart set debug=yes here, then set it back to no.
debug=no
type=global
user_agent=OsmoAsterisk-Op__OPERATOR_ID__
; Linphone clients and the WAN trunk all arrive through the Docker gateway
; 172.20.0.1 (NAT). Identify by username first so that the IP-only WAN trunk
; identify (network/setup-wan-interop.sh, match=172.20.0.1) does not swallow
; the Linphone REGISTERs.
endpoint_identifier_order=username,ip,anonymous

; =============================================================================
; TRANSPORT
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
; No external_media_address / external_signaling_address: Asterisk announces
; the real address of its interface, which is correct here. Only add them
; behind a real NAT, with the real public address (they are only used for
; peers outside local_net).
local_net=172.20.0.0/16
local_net=127.0.0.0/8

; =============================================================================
; LINPHONE A - extension 100
; =============================================================================

[linphone_A]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=alaw
allow=ulaw
allow=gsm
auth=linphone_A
aors=linphone_A
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
callerid=Linphone A <100>

[linphone_A]
type=auth
auth_type=userpass
username=linphone_A
password=tester

[linphone_A]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30
qualify_timeout=5.0

; =============================================================================
; LINPHONE B - extension 200
; =============================================================================

[linphone_B]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=alaw
allow=ulaw
allow=gsm
auth=linphone_B
aors=linphone_B
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
callerid=Linphone B <200>

[linphone_B]
type=auth
auth_type=userpass
username=linphone_B
password=testerB

[linphone_B]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30
qualify_timeout=5.0

; =============================================================================
; GSM TRUNK <- OsmoMSC via osmo-sip-connector (127.0.0.1:5061)
;
; media_encryption=no is required: osmo-sip-connector sends plain RTP, not
;   SRTP/DTLS. Without it Asterisk may take RTP packets for DTLS ("Received
;   SSL traffic without SSL session") and drop the audio.
; =============================================================================

[gsm_msc-identify]
type=identify
endpoint=gsm_msc
match=127.0.0.1

[gsm_msc]
type=endpoint
transport=transport-udp
context=gsm_in
disallow=all
allow=alaw
allow=ulaw
allow=gsm
aors=gsm_msc
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no

[gsm_msc]
type=aor
contact=sip:127.0.0.1:5061
qualify_frequency=10

; =============================================================================
; INTER-OPERATOR TRUNKS - generated by launch/start-docker.sh
; =============================================================================
;
; =============================================================================
; ZADARMA TRUNK (external SIP operator) - https://zadarma.com
;
; Credentials: the SIP login and SIP password from the Zadarma customer area,
; section "My SIP". They are dedicated SIP credentials, not the web account
; login/password.
;
; After editing:  asterisk -rx "pjsip reload"
; Check:          asterisk -rx "pjsip show registrations"   -> Registered
;
; Dialing:
;   outgoing -> prefix 00 + international number   (e.g. 0033612345678)
;   incoming -> dialplan context [zadarma_in]
; =============================================================================

[zadarma_auth]
type=auth
auth_type=userpass
username=533110
password=3eahh8IWZC

[zadarma]
type=aor
contact=sip:sip.zadarma.com
qualify_frequency=60
qualify_timeout=5.0

[zadarma_reg]
type=registration
transport=transport-udp
outbound_auth=zadarma_auth
server_uri=sip:sip.zadarma.com
client_uri=sip:533110@sip.zadarma.com
contact_user=533110
retry_interval=60
forbidden_retry_interval=600
expiration=300
line=yes
endpoint=zadarma

[zadarma]
type=endpoint
transport=transport-udp
context=zadarma_in
disallow=all
; Codec order: gsm first. PJSIP offers codecs in this order and the peer takes
; the first it accepts; the MS leg is GSM-FR, so a gsm answer lets
; bridge_native_rtp relay RTP without a gsm<->slin<->alaw double transcode.
; If the peer refuses gsm it falls back to ulaw/alaw and the call still works.
; Check with `core show channel PJSIP/zadarma-...` during a call:
; NativeFormats (gsm) = accepted, (alaw) = refused.
; Known limitation: while [sub-record] installs MixMonitor + JITTERBUFFER the
; channel leaves the native bridge and is transcoded to slin anyway.
allow=gsm
allow=ulaw
allow=alaw
outbound_auth=zadarma_auth
aors=zadarma
from_user=533110
from_domain=sip.zadarma.com
; NAT: Asterisk sits behind the Docker gateway. Without these four lines RTP
; is sent to a private address and the call is one-way silent.
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Zadarma does not use SRTP on this account type. Keep 'no', otherwise
; Asterisk may take plain RTP for DTLS and drop the audio (same trap as the
; gsm_msc trunk above).
media_encryption=no
dtmf_mode=rfc4733

[zadarma-identify]
type=identify
endpoint=zadarma
match=sip.zadarma.com
; endpoint_identifier_order (top of this file) is username,ip,anonymous: IP
; identification only runs after username, so this match cannot swallow the
; Linphone REGISTERs.

; =============================================================================
; ZADARMA PBX TRUNK (PBX extension) - pbx.zadarma.com
;
; Second registration, as extension 100 of PBX 578163. Incoming calls on the
; number normally arrive through [zadarma] (the number is connected to SIP
; account 533110); this trunk is a fallback, both land in [zadarma_in].
;   Server: pbx.zadarma.com   (not sip.zadarma.com: two separate platforms)
;   Login:  578163-100        (PBX number + dash + extension)
;
; Three things must be set in the Zadarma customer area (not covered here):
;   1. The extension password must be SAVED ("PBX extensions settings" page);
;      a generated but unsaved password gives a 401 loop.
;   2. "Restriction by IP" must be the bench's public IP; a changed IP gives
;      403 Forbidden on REGISTER.
;   3. The number's incoming call scenario must route to extension 100.
;
; Check:  asterisk -rx "pjsip show registrations"
;         -> zadarma_pbx_reg/sip:pbx.zadarma.com ... Registered
;         and the PBX page shows the extension "online".
; =============================================================================

[zadarma_pbx_auth]
type=auth
auth_type=userpass
username=578163-100
; The extension password as saved in the Zadarma PBX page (see above).
password=QsK3m8fmNE

[zadarma_pbx]
type=aor
contact=sip:pbx.zadarma.com
qualify_frequency=60
qualify_timeout=5.0

[zadarma_pbx_reg]
type=registration
transport=transport-udp
outbound_auth=zadarma_pbx_auth
server_uri=sip:pbx.zadarma.com
client_uri=sip:578163-100@pbx.zadarma.com
contact_user=578163-100
retry_interval=60
; 600 s after a 403/404: the extension is limited to 3 lines and Zadarma
; blacklists an IP that hammers refused REGISTERs.
forbidden_retry_interval=600
expiration=300
; line=yes: Asterisk tags the registered Contact and matches the incoming
; INVITE on that tag before any IP identification, so PBX calls land in
; [zadarma_in] and not in "anonymous".
line=yes
endpoint=zadarma_pbx

[zadarma_pbx]
type=endpoint
transport=transport-udp
context=zadarma_in
disallow=all
; Same codec order as [zadarma]: gsm first to avoid the gsm<->slin<->alaw
; double transcode with the MS leg; falls back to ulaw/alaw if refused.
allow=gsm
allow=ulaw
allow=alaw
outbound_auth=zadarma_pbx_auth
aors=zadarma_pbx
from_user=578163-100
from_domain=pbx.zadarma.com
; NAT: same four lines as the [zadarma] trunk, same reasons.
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
dtmf_mode=rfc4733

[zadarma_pbx-identify]
type=identify
endpoint=zadarma_pbx
; pbx.zadarma.com and sip.zadarma.com resolve to different addresses, so the
; two identify blocks do not overlap. Safety net behind line=yes.
match=pbx.zadarma.com
