; =============================================================================
; pjsip.conf — Asterisk PJSIP — Opérateur __OPERATOR_ID__
;
; [2026-08-31] CE GABARIT ÉTAIT LE SEUL DES TROIS CONFIGS ASTERISK À NE PORTER
; AUCUN MARQUEUR (grep -c "__" : extensions.conf 3, osmo-sip-connector.cfg 1,
; celui-ci 0). Il était donc recopié à l'identique dans TOUS les opérateurs, et
; op2 comme op3 s'annonçaient « Op1 ». La substitution, elle, passait déjà sur
; ce fichier (generate_configs.sh:481 couvre "$dest/asterisk"/*.conf) : il
; suffisait de poser les marqueurs.
;
; Linphone depuis l'hôte :
;   Direct : __CONTAINER_IP__:5060  (Docker bridge)
;   linphone_A / tester → 100  |  linphone_B / testerB → 200
;   (100/200 sont des postes SIP locaux, HORS plan MSISDN <nœud>00<op><ms> :
;    le dialplan les traite dans [internal], à côté de 500/600/700.)
; =============================================================================

[global]
; [2026-08-12] debug=no par DEFAUT (demande explicite). Cette option journalise
; TOUS les messages SIP, REGISTER compris, et sature /var/log/asterisk/messages.
; Pour une capture ponctuelle : `asterisk -rx "pjsip set logger on"` — reglage
; d execution qui ne survit PAS au redemarrage d Asterisk (mesure du 09/08 :
; capture armee a 02:52, perdue au redemarrage de 07:32, INVITE Linphone rate).
; Pour une trace qui survit a un redemarrage : repasser debug=yes ICI, puis le
; remettre a no une fois la capture faite.
debug=no
type=global
user_agent=OsmoAsterisk-Op__OPERATOR_ID__
; Les clients (Linphone) et le trunk WAN arrivent tous via la gateway Docker
; 172.20.0.1 (NAT). L'identify IP du trunk WAN (network/setup-wan-interop.sh, match=
; 172.20.0.1) avalerait sinon les REGISTER Linphone. On identifie donc par
; username d'abord : Linphone -> par username, trunk WAN IP-only -> par IP.
endpoint_identifier_order=username,ip,anonymous

; =============================================================================
; TRANSPORT
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
; [2026-08-31] external_media_address / external_signaling_address = 10.2.0.2
; RETIRÉS. Cette adresse était codée en dur, identique chez tous les opérateurs,
; et n'existait ni sur l'hôte ni sur le réseau du banc (172.20.0.0/16, déclaré
; en local_net juste en dessous). Elle ne sert qu'aux pairs situés HORS des
; local_net — un softphone sur le LAN — auxquels Asterisk annonçait donc une
; adresse injoignable : signalisation OK, RTP dans le vide. Sans ces lignes,
; Asterisk annonce l'adresse réelle de son interface, ce qui est correct ici.
; À ne remettre que derrière un vrai NAT, avec l'adresse publique réelle.
local_net=172.20.0.0/16
local_net=127.0.0.0/8

; =============================================================================
; LINPHONE A — numéro 100
; =============================================================================

[linphone_A]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=alaw
allow=ulaw
allow=gsm
auth=linphone_A
aors=linphone_A
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
callerid=Linphone A <100>

[linphone_A]
type=auth
auth_type=userpass
username=linphone_A
password=tester

[linphone_A]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30
qualify_timeout=5.0

; =============================================================================
; LINPHONE B — numéro 200
; =============================================================================

[linphone_B]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=alaw
allow=ulaw
allow=gsm
auth=linphone_B
aors=linphone_B
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
callerid=Linphone B <200>

[linphone_B]
type=auth
auth_type=userpass
username=linphone_B
password=testerB

[linphone_B]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30
qualify_timeout=5.0

; =============================================================================
; TRUNK GSM ← OsmoMSC via osmo-sip-connector (127.0.0.1:5061)
;
; media_encryption=no : CRITIQUE — osmo-sip-connector envoie du RTP brut,
;   pas du SRTP/DTLS. Sans cette option Asterisk peut interpréter certains
;   paquets RTP comme du DTLS → "Received SSL traffic without SSL session"
;   → audio jeté → pas de son.
; =============================================================================

[gsm_msc-identify]
type=identify
endpoint=gsm_msc
match=127.0.0.1

[gsm_msc]
type=endpoint
transport=transport-udp
context=gsm_in
disallow=all
allow=alaw
allow=ulaw
allow=gsm
aors=gsm_msc
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no

[gsm_msc]
type=aor
contact=sip:127.0.0.1:5061
qualify_frequency=10

; =============================================================================
; TRUNKS INTER-OPÉRATEURS — GÉNÉRÉ par start.sh
; =============================================================================
;
; =============================================================================
; TRUNK ZADARMA (opérateur SIP externe)  — https://zadarma.com
;
; ┌─ À REMPLIR ─────────────────────────────────────────────────────────────┐
; │  ZADARMA_LOGIN_A_REMPLIR         ← votre login SIP Zadarma (ex: 123456)  │
; │  ZADARMA_PASSWORD_A_REMPLIR      ← votre mot de passe SIP              │
; └─────────────────────────────────────────────────────────────────────────┘
; Les deux se trouvent dans l'espace client Zadarma, section « Mes SIP ».
; ⚠️ Le login SIP N'EST PAS l'identifiant du compte web, et le mot de passe SIP
;    n'est pas celui du compte : ce sont des identifiants dédiés.
;
; Après remplissage :  asterisk -rx "pjsip reload"
; Vérifier :           asterisk -rx "pjsip show registrations"   → Registered
;
; Composition :
;   sortant  → préfixe 00 + numéro international   (ex: 0033612345678)
;   entrant  → contexte [zadarma_in] du dialplan
; =============================================================================

[zadarma_auth]
type=auth
auth_type=userpass
username=533110
password=3eahh8IWZC

[zadarma]
type=aor
contact=sip:sip.zadarma.com
qualify_frequency=60
qualify_timeout=5.0

[zadarma_reg]
type=registration
transport=transport-udp
outbound_auth=zadarma_auth
server_uri=sip:sip.zadarma.com
client_uri=sip:533110@sip.zadarma.com
contact_user=533110
retry_interval=60
forbidden_retry_interval=600
expiration=300
line=yes
endpoint=zadarma

[zadarma]
type=endpoint
transport=transport-udp
context=zadarma_in
disallow=all
; [2026-08-13] ORDRE INVERSÉ : gsm EN TÊTE. PJSIP propose les codecs dans
; l'ordre de ces lignes et le pair prend le premier qu'il accepte. Avec alaw
; en tête, Zadarma répondait alaw — mesuré sur l'appel de 08:15 :
;   PJSIP/gsm_msc  NativeFormats (gsm)   ReadTranscode (gsm)->(slin)
;   PJSIP/zadarma  NativeFormats (alaw)  WriteTranscode (slin)->(alaw)
; soit gsm↔slin↔alaw, DEUX transcodages par sens. La patte MS est en GSM-FR
; par nature (c'est le codec de l'air) : si Zadarma accepte gsm, les deux
; pattes parlent le même codec et bridge_native_rtp peut relayer le RTP tel
; quel, sans repasser par slin.
; ⚠️ NON VÉRIFIÉ : que Zadarma accepte le GSM-FR sur ce type de compte. S'il
;    refuse, il retombe sur alaw/ulaw ci-dessous — aucune perte, l'appel passe
;    comme avant. Le juge est `core show channel PJSIP/zadarma-...` pendant un
;    appel : NativeFormats (gsm) = accepté, (alaw) = refusé.
; ⚠️ NE PAIE QUE SI LES AUDIOHOOKS PARTENT AUSSI. Tant que [sub-record] pose
;    MixMonitor + JITTERBUFFER, le canal est sorti du pont natif et repasse en
;    slin quoi qu'il arrive (ReadFormat: slin sur une patte NativeFormats gsm).
;    Ce changement seul ne supprimera donc PAS le transcodage.
allow=gsm
allow=ulaw
allow=alaw
outbound_auth=zadarma_auth
aors=zadarma
from_user=533110
from_domain=sip.zadarma.com
; NAT : Asterisk est derrière la gateway Docker. Sans ces quatre lignes le RTP
; part vers une adresse privée et l'appel est muet dans un sens.
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Zadarma ne fait pas de SRTP sur ce type de compte. Laisser 'no' : sinon
; Asterisk peut prendre du RTP brut pour du DTLS et jeter l'audio (même piège
; que le trunk gsm_msc plus haut dans ce fichier).
media_encryption=no
dtmf_mode=rfc4733

[zadarma-identify]
type=identify
endpoint=zadarma
match=sip.zadarma.com
; ⚠️ endpoint_identifier_order (en tête de ce fichier) vaut username,ip,anonymous.
;    L'identification par IP n'intervient donc qu'après le username : les REGISTER
;    des Linphone ne peuvent pas être avalés par ce match.

; =============================================================================
; TRUNK ZADARMA PBX (extension du standard)  — pbx.zadarma.com
;
; [2026-09-09] AJOUTÉ POUR L'ENTRANT, PUIS DEVENU UN FILET DE SÉCURITÉ.
; Historique, parce qu'il explique les deux inscriptions : le trunk [zadarma]
; ci-dessus était le compte SIP 474117, et le numéro +33757690612 n'était
; rattaché À AUCUN compte SIP. Zadarma n'avait donc personne à qui présenter
; l'appel entrant : quinze minutes de trace n'ont montré que ses OPTIONS de
; keepalive toutes les 30 s, et pas un seul INVITE. D'où cette inscription de
; secours sur l'extension 100 du standard 578163, au cas où le numéro y aurait
; été rattaché.
;
; CE QUI A RÉELLEMENT DÉBLOQUÉ L'ENTRANT est ailleurs : le numéro a été connecté
; au compte SIP 533110 (« Numbers, connected to SIP : +33757690612 » sur sa page)
; et [zadarma] est passé de 474117 à 533110. L'entrant arrive donc par [zadarma],
; pas par ce trunk-ci. On le garde quand même : les deux tombent dans
; [zadarma_in], et une extension de standard enregistrée ne coûte rien.
;
; D'où cette seconde inscription : l'extension 100 du standard 578163.
;   Serveur : pbx.zadarma.com   (≠ sip.zadarma.com — deux plates-formes)
;   Login   : 578163-100        (numéro de standard + tiret + extension)
;
; CÔTÉ ZADARMA, TROIS CHOSES DOIVENT ÊTRE VRAIES — la config ci-dessous n'en
; couvre AUCUNE, elles se règlent dans l'espace client :
;   1. Le mot de passe de l'extension doit être ENREGISTRÉ (bouton SAVE de la
;      page « PBX extensions settings »). Un mot de passe généré mais non
;      sauvegardé donne un 401 en boucle.
;   2. « Restriction by IP » doit valoir l'IP publique du banc. Elle vaut
;      82.66.231.141 et c'est bien celle du banc (vérifié le 09/09) ; elle
;      change à chaque renumérotation de la box → 403 Forbidden sur REGISTER.
;   3. Le scénario d'appel entrant du numéro doit router vers l'extension 100.
;
; VÉRIFICATION :  asterisk -rx "pjsip show registrations"
;                 → zadarma_pbx_reg/sip:pbx.zadarma.com ... Registered
;                 et la page du standard passe de « offline » à « online ».
; =============================================================================

[zadarma_pbx_auth]
type=auth
auth_type=userpass
username=578163-100
; [2026-09-09] MOT DE PASSE REMPLACE. Le precedent (0wj5jcKYFC) etait genere
; dans la page du standard mais jamais enregistre : REGISTER -> 401 en boucle,
; extension « offline ». Verifie par un REGISTER nu, hors Asterisk : challenge
; sur realm pbx.zadarma.com puis 200 OK avec celui-ci.
password=QsK3m8fmNE

[zadarma_pbx]
type=aor
contact=sip:pbx.zadarma.com
qualify_frequency=60
qualify_timeout=5.0

[zadarma_pbx_reg]
type=registration
transport=transport-udp
outbound_auth=zadarma_pbx_auth
server_uri=sip:pbx.zadarma.com
client_uri=sip:578163-100@pbx.zadarma.com
contact_user=578163-100
retry_interval=60
; 600 s après un 403/404 : l'extension est limitée à 3 lignes et Zadarma
; blackliste une IP qui martèle des REGISTER refusés.
forbidden_retry_interval=600
expiration=300
; line=yes : Asterisk marque le Contact enregistré et reconnaît l'INVITE
; entrant par cette marque, AVANT toute identification par IP. C'est ce qui
; garantit que l'appel du standard tombe dans [zadarma_in] et pas en
; « anonymous » (endpoint_identifier_order = username,ip,anonymous).
line=yes
endpoint=zadarma_pbx

[zadarma_pbx]
type=endpoint
transport=transport-udp
context=zadarma_in
disallow=all
; Même raisonnement d'ordre des codecs que pour [zadarma] : gsm en tête pour
; éviter le double transcodage gsm↔slin↔alaw avec la patte MS. Si le standard
; refuse le GSM-FR il retombe sur alaw/ulaw, l'appel passe quand même.
allow=gsm
allow=ulaw
allow=alaw
outbound_auth=zadarma_pbx_auth
aors=zadarma_pbx
from_user=578163-100
from_domain=pbx.zadarma.com
; NAT : mêmes quatre lignes que le trunk classique, mêmes raisons.
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
dtmf_mode=rfc4733

[zadarma_pbx-identify]
type=identify
endpoint=zadarma_pbx
; pbx.zadarma.com et sip.zadarma.com ne résolvent PAS sur la même adresse
; (185.45.152.164 contre 185.45.152.180, mesuré le 09/09) : les deux blocs
; identify ne se marchent pas dessus. Filet de sécurité derrière line=yes.
match=pbx.zadarma.com
