! osmo-pcu-gprs.cfg - PCU of virtual BTS 2 (socket /tmp/pcu_bts3, VTY 127.0.0.2:4240).
! Installed in /etc/osmocom by scripts/egprs-dsp.sh; __GSMTAP_IP__ = the one of osmo-pcu.cfg.
log file /var/log/osmocom/osmo-pcu-gprs.log
 logging color 1
 logging timestamp 1
 logging filter all 1
 logging print category 1
 logging print level 1
log gsmtap __GSMTAP_IP__
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging print level 1
!
pcu
 flow-control-interval 10
 cs 2
 alloc-algorithm dynamic
 alpha 0
 gamma 0
 pcu-socket /tmp/pcu_bts3
line vty
 no login
 bind 127.0.0.2
