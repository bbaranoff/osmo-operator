! osmo-bts-virtual-gprs.cfg - virtual BTS 2 (Um multicast on lo), EGPRS cell of the modem.
! Installed in /etc/osmocom by scripts/egprs-dsp.sh. PCU: /tmp/pcu_bts3 (osmo-pcu-gprs.cfg).
! Virtual Um: GSMTAP multicast 239.193.23.1/2 udp 4729 on lo (virtphy -D lo)
log file /var/log/osmocom/osmo-bts-virtual-gprs.log
 logging filter all 1
 logging color 0
 logging timestamp 1
 logging print category 1
 logging print level 1
 logging level all notice
 logging level pcu info
line vty
 no login
 bind 127.0.0.1 4253
ctrl
 bind 127.0.0.3
e1_input
 e1_line 0 driver ipa
 e1_line 0 port 0
 no e1_line 0 keepalive
phy 0
 virtual-um net-device lo
 virtual-um ttl 1
 instance 0
bts 0
 band DCS1800
 ipa unit-id 6013 0
 oml remote-ip 127.0.0.1
 pcu-socket /tmp/pcu_bts3
 rtp jitter-buffer 100
 paging queue-size 200
 paging lifetime 0
 min-qual-rach 50
 min-qual-norm -5
 gsmtap-sapi ccch
 gsmtap-sapi pdtch
 trx 0
  power-ramp max-initial 23000 mdBm
  power-ramp step-size 2000 mdB
  power-ramp step-interval 1
  ms-power-control osmo
  phy 0 instance 0
