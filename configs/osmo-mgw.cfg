!
! OsmoMGW (1.7.0) configuration saved from vty
!!
!
log file /var/log/osmocom/osmo-mgw.log
 logging color 1
 logging timestamp 1
 logging filter all 1
 logging print category-hex 1
 logging print category 0
 logging print file 1
 logging level rtp notice
 logging level lglobal notice
 logging level llapd notice
 logging level linp notice
 logging level lmux notice
 logging level lmi notice
 logging level lmib notice
 logging level lsms notice
 logging level lctrl notice
 logging level lgtp notice
 logging level lstats notice
 logging level lgsup notice
 logging level loap notice
 logging level lss7 notice
 logging level lsccp notice
 logging level lsua notice
 logging level lm3ua notice
 logging level lmgcp notice
 logging level ljibuf notice
 logging level lrspro notice
log stderr
 logging filter all 1
 logging color 0
 logging print category-hex 1
 logging print category 0
 logging timestamp 0
 logging print file 1
 logging level rtp notice
 logging level lglobal notice
 logging level llapd notice
 logging level linp notice
 logging level lmux notice
 logging level lmi notice
 logging level lmib notice
 logging level lsms notice
 logging level lctrl notice
 logging level lgtp notice
 logging level lstats notice
 logging level lgsup notice
 logging level loap notice
 logging level lss7 notice
 logging level lsccp notice
 logging level lsua notice
 logging level lm3ua notice
 logging level lmgcp notice
 logging level ljibuf notice
 logging level lrspro notice
!
stats interval 5
!
line vty
 no login
!
!
mgcp
  domain mgw
  bind ip 127.0.0.1
  bind port 2427
  rtp port-range 4002 16001
  rtp bind-ip 127.0.0.1
  rtp ip-probing
!
! [2026-08-12] Keep-alive RTP DESACTIVE. osmo-mgw emettait 1 paquet dummy d'un
! octet (0x23 = MGCP_DUMMY_LOAD) par connexion, pour percer un NAT. Asterisk 18
! classe tout premier octet dans [20,63] comme un enregistrement DTLS, d'ou un
! "Received SSL traffic on RTP instance without an SSL session"
! (res_rtp_asterisk.c:3133) a chaque appel. Inutile ici : rtp bind-ip 127.0.0.1,
! le pair (Asterisk) est en loopback, il n'y a aucun NAT a percer.
  no rtp keep-alive
  rtcp-omit
  rtp-patch ssrc
  rtp-patch timestamp
  no rtp-patch rfc5993hr
  sdp audio-payload number 98
  sdp audio-payload name GSM
  sdp audio-payload send-ptime
  sdp audio-payload send-name
  loop 0
  number endpoints 31
  allow-transcoding
  osmux off
