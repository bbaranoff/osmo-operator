# mme.yaml - Open5GS MME of the bench (Open5GS v2.8.0, /opt/LTE/open5gs/install).
#
# Only what runs on this bench is kept (no roaming, DNS, SGSN or IPv6
# examples). The source is configs/open5gs/mme.yaml in the repository; the
# copy in service is /opt/LTE/open5gs/install/etc/open5gs/mme.yaml (cp, then
# restart open5gs-mmed).
#
# ADDRESS PLAN: the whole 4G core lives on the loopback, one address per
# function, so that ports 2123/2152/8805 do not collide:
#   127.0.0.2  MME (S1AP sctp 36412, GTP-C 2123, Diameter S6a, SGs to the MSC)
#   127.0.0.3  SGW-C     127.0.0.4  SMF (= PGW-C)     127.0.0.6  SGW-U
#   127.0.0.7  UPF       127.0.0.8  HSS               127.0.0.9  PCRF
#   127.0.0.1  osmo-msc (SGs 29118), osmo-stp, osmo-sgsn - the osmocom 2G.
# srsENB (ZeroMQ, 127.0.1.1) connects to the S1AP of 127.0.0.2 (enb.conf: mme_addr).
#
# Known limitation: the PGW is NOT chosen by gtpc.client.smf alone. If the HSS
# subscription (MongoDB, open5gs.subscribers, slice[].session[].smf) carries an
# address, it wins (the WebUI puts 127.0.0.200 there by default) and the SGW-C
# waits for a Create Session Response from nobody (GTP timeout, RRC release,
# "Attach failed" on the srsUE side). Leave that field empty in the database.

logger:
  file:
    path: /opt/LTE/open5gs/install/var/log/open5gs/mme.log

global:
  max:
    ue: 1024          # plenty: one srsUE and the bench phone

mme:
  freeDiameter: /opt/LTE/open5gs/install/etc/freeDiameter/mme.conf   # S6a to the HSS (127.0.0.8)

  # S1AP: what the MME listens on for the eNBs. srsENB connects to it over SCTP.
  s1ap:
    server:
      - address: 127.0.0.2

  # GTP-C (S11 to the SGW-C, S5 to the SMF when the HSS says nothing).
  gtpc:
    server:
      - address: 127.0.0.2
    client:
      sgwc:
        - address: 127.0.0.3
      smf:
        - address: 127.0.0.4

  metrics:
    server:
      - address: 127.0.0.2
        port: 9090

  # SGs: THE LINK WITH THE 2G. Through it the UE camped on 4G is also
  # registered in the osmo-msc VLR (combined EPS + IMSI attach), and CSFB
  # works: on a call or SMS the UE falls back to the BTS; meanwhile the MSC
  # knows where to reach it (paging by the MME). osmo-msc listens over SCTP
  # on 127.0.0.1:29118 (osmo-msc.cfg, "sgs" section). The "map" table
  # translates the 4G area (TAI: PLMN 001-01, TAC 7 - the one of srsENB's
  # rr.conf) into the 2G area (LAI: PLMN 001-01, LAC 1 - location_area_code
  # 0x0001 in osmo-bsc.cfg): the VLR files the subscriber in LAC 1 while it is
  # on LTE.
  sgsap:
    client:
      - address: 127.0.0.1
        local_address: 127.0.0.2
        map:
          tai:
            plmn_id:
              mcc: 001
              mnc: 01
            tac: 7
          lai:
            plmn_id:
              mcc: 001
              mnc: 01
            lac: 1

  # MME identity (GUMMEI): carried by the GUTI given to the UE.
  gummei:
    - plmn_id:
        mcc: 001
        mnc: 01
      mme_gid: 2
      mme_code: 1

  # Served areas: a single one, the one srsENB broadcasts.
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 7

  # NAS security: mandatory integrity (EIA2 first), null ciphering (EEA0)
  # first so that the NAS can be READ in Wireshark on this bench.
  security:
    integrity_order : [ EIA2, EIA1, EIA0 ]
    ciphering_order : [ EEA0, EEA1, EEA2 ]

  # The name the phone displays for 4G (EMM Information).
  network_name:
    full: OsmoDirect
    short: OsmoDirect
  mme_name: open5gs-mme0
