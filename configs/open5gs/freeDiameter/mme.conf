# mme.conf - freeDiameter config of the MME: S6a client of the HSS (Open5GS v2.8.0, /opt/LTE/open5gs/install).
# Repository osmo-operator, configs/open5gs/freeDiameter; installed by
# tools/osmo-lte-install.sh --configs into $PREFIX/etc/freeDiameter.
#
# The four .conf files (mme, hss, pcrf, smf) live in the repository because the
# Open5GS meson install skips its config files under DESTDIR: the
# osmo-build-open5gs .deb ships only bin/ and lib/, and each daemon aborts at
# init without its freeDiameter config. The TLS certificates are generated
# with openssl at install time ($PREFIX/etc/open5gs/tls).
#
# Peers use No_TLS (loopback only, so the Diameter traffic is readable in
# Wireshark); freeDiameter still requires a valid TLS_Cred at init.
# Addresses follow configs/open5gs/*.yaml (MME 127.0.0.2, HSS 127.0.0.8,
# SMF 127.0.0.4, PCRF 127.0.0.9). The install prefix (OPEN5GS_PREFIX) and the
# extension directory (lib/<triplet>/freeDiameter) are substituted at install time.

Identity = "mme.localdomain";
Realm = "localdomain";
ListenOn = "127.0.0.2";
TLS_Cred = "/opt/LTE/open5gs/install/etc/open5gs/tls/mme.crt", "/opt/LTE/open5gs/install/etc/open5gs/tls/mme.key";
TLS_CA = "/opt/LTE/open5gs/install/etc/open5gs/tls/ca.crt";
NoRelay;

LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dbg_msg_dumps.fdx" : "0x8888";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_rfc5777.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_mip6i.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_nasreq.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_nas_mipv6.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_dcca.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_dcca_3gpp.fdx";

ConnectPeer = "hss.localdomain" { ConnectTo = "127.0.0.8"; No_TLS; };
