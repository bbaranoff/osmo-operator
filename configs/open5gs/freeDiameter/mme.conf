# mme.conf - freeDiameter du MME : S6a vers le HSS (Open5GS v2.8.0, /opt/LTE/open5gs/install).
# Depot osmo-operator, configs/open5gs/freeDiameter ; pose par tools/osmo-lte-install.sh
# --configs dans $PREFIX/etc/freeDiameter. Le pourquoi est en tete de mme.conf.
#
# [2026-09-09] CE FICHIER MANQUAIT SUR L ISO, ET LE DEMON MOURAIT A L INIT.
# Open5GS pose ses configs (etc/open5gs/*.yaml, etc/freeDiameter/*.conf,
# etc/open5gs/tls/*) par un script d installation meson qui NE FAIT RIEN sous
# DESTDIR (meson.build : install_conf = «... if not os.environ.get("DESTDIR")»).
# Or packaging/osmo-deb.sh pack empaquette par « DESTDIR=… ninja install » :
# le .deb osmo-build-open5gs n a que bin/ et lib/. Les yaml, osmo-lte-install
# les reposait depuis le depot ; freeDiameter, personne - et open5gs-mmed
# s arretait sur « Unable to open configuration file … freeDiameter/mme.conf »
# (mme_fd_init: Assertion `ret == 0'), donc pas de S1AP sur 127.0.0.2, donc
# « Received ConnectionReject » cote srsUE et jamais d attach. Meme sort pour
# le HSS, le PCRF et le SMF - et osmo-epc disait quand meme « demarre ».
# Les quatre .conf sont donc DANS LE DEPOT, avec les certificats TLS generes
# a cote a la pose ($PREFIX/etc/open5gs/tls, openssl).
#
# Les pairs sont en No_TLS (boucle locale : on veut lire le Diameter dans
# Wireshark) ; freeDiameter exige quand meme un TLS_Cred valide a l init.
# Adresses : celles de configs/open5gs/*.yaml (MME 127.0.0.2, HSS 127.0.0.8,
# SMF 127.0.0.4, PCRF 127.0.0.9). Le prefixe est substitue a la pose
# (OPEN5GS_PREFIX), le dossier des extensions aussi (lib/<triplet>/freeDiameter).

Identity = "mme.localdomain";
Realm = "localdomain";
ListenOn = "127.0.0.2";
TLS_Cred = "/opt/LTE/open5gs/install/etc/open5gs/tls/mme.crt", "/opt/LTE/open5gs/install/etc/open5gs/tls/mme.key";
TLS_CA = "/opt/LTE/open5gs/install/etc/open5gs/tls/ca.crt";
NoRelay;

LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dbg_msg_dumps.fdx" : "0x8888";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_rfc5777.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_mip6i.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_nasreq.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_nas_mipv6.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_dcca.fdx";
LoadExtension = "/opt/LTE/open5gs/install/lib/x86_64-linux-gnu/freeDiameter/dict_dcca_3gpp.fdx";

ConnectPeer = "hss.localdomain" { ConnectTo = "127.0.0.8"; No_TLS; };
