!
! osmo-bsc.cfg — BSC opérateur __OPERATOR_ID__ (MCC __MCC__ / MNC __MNC__)
! 
! Pour opérateur 1: utiliser __CONTAINER_IP__ = 172.20.0.11
! Pour opérateur 2: utiliser __CONTAINER_IP__ = 172.20.0.12
!
log file /var/log/osmocom/osmo-bsc.log
 logging color 1
 logging timestamp 1
 logging filter all 1
 logging print category-hex 0
 logging print category 1
 logging print thread-id 0
 logging print level 1
 logging print file basename last
log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging print thread-id 0
 logging timestamp 0
 logging print level 1
 logging print file basename last
!
log gsmtap __GATEWAY_IP__
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging print level 1
 logging level rll notice
 logging level mm notice
 logging level rr notice
 logging level rsl notice
 logging level nm notice
 logging level pag notice
 logging level meas notice
 logging level msc notice
 logging level ho notice
 logging level hodec notice
 logging level ref notice
 logging level ctrl notice
 logging level filter notice
 logging level pcu notice
 logging level lcls notice
 logging level chan notice
 logging level ts notice
 logging level as notice
 logging level cbs notice
 logging level lcs notice
 logging level asci notice
 logging level reset notice
 logging level loop notice
 logging level lglobal notice
 logging level llapd notice
 logging level linp notice
 logging level lmux notice
 logging level lmi notice
 logging level lmib notice
 logging level lsms notice
 logging level lctrl notice
 logging level lgtp notice
 logging level lstats notice
 logging level lgsup notice
 logging level loap notice
 logging level lss7 notice
 logging level lsccp notice
 logging level lsua notice
 logging level lm3ua notice
 logging level lmgcp notice
 logging level ljibuf notice
 logging level lrspro notice
 logging level lns notice
 logging level lbssgp notice
 logging level lnsdata notice
 logging level lnssignal notice
 logging level liuup notice
 logging level lpfcp notice
 logging level lcsn1 notice
 logging level lio notice
 logging level ltcap notice
!
stats interval 5
!
line vty
 no login
!
e1_input
 e1_line 0 driver ipa
 e1_line 0 port 0
!
cs7 instance 0
 network-indicator international
 point-code __PC_BSC__

 asp asp-to-stp 2905 2907 m3ua
  remote-ip 127.0.0.1
  local-ip  127.0.0.1
  role asp
  sctp-role client
  no shutdown

 as as-bsc m3ua
  asp asp-to-stp
  routing-key __RCTX_BSC__ __PC_BSC__
  traffic-mode override

 sccp-address addr-msc
  routing-indicator PC
  point-code __PC_MSC__
  subsystem-number 254

network
 network country code __MCC__
 mobile network code __MNC__
 encryption __ENCRYPTION__
 neci 1
 paging any use tch 0
 handover 0
 handover algorithm 1
 handover1 window rxlev averaging 10
 handover1 window rxqual averaging 1
 handover1 window rxlev neighbor averaging 10
 handover1 power budget interval 6
 handover1 power budget hysteresis 3
 handover1 maximum distance 9999
 timer t3109 __T3109__
 mgw 0
  local-port 2727
  remote-ip 127.0.0.1
  remote-port 2427
 bts 0
  type osmo-bts
  band __BAND__
  cell_identity __CELL_ID__
  location_area_code __LAC__
  base_station_id_code __BSIC__
  ms max power __MS_MAX_POWER__
  cell reselection hysteresis __CELL_RESEL_HYST__
  rxlev access min __RXLEV_ACCESS_MIN__
  radio-link-timeout 32
  channel allocator mode chan-req descending
  channel allocator mode assignment ascending
  channel allocator mode handover ascending
  channel allocator mode vgcs-vbs ascending
  rach tx integer 9
  rach max transmission 7
  rach max-delay 63
  rach expiry-timeout 32
  channel-description attach 1
  channel-description bs-pa-mfrms 5
  channel-description bs-ag-blks-res 1
  no nch-position
  no access-control-class-ramping
  early-classmark-sending forbidden
  early-classmark-sending-3g allowed
  ipa unit-id __IPA_UNIT_ID__ 0
  oml ipa stream-id 255 line 0
  neighbor-list mode automatic
  codec-support fr
  amr tch-f modes 0 2 5 7
  amr tch-f threshold ms 13 25 37
  amr tch-f hysteresis ms 4 4 4
  amr tch-f threshold bts 13 25 37
  amr tch-f hysteresis bts 4 4 4
  amr tch-f start-mode auto
  amr tch-h modes 0 2 3 5
  amr tch-h threshold ms 16 24 32
  amr tch-h hysteresis ms 4 4 4
  amr tch-h threshold bts 16 24 32
  amr tch-h hysteresis bts 4 4 4
  amr tch-h start-mode auto
  gprs mode egprs
  gprs routing area 0
  gprs network-control-order nc0
  gprs power-control alpha 0
  gprs cell bvci __BVCI__
  gprs cell timer blocking-timer 3
  gprs cell timer blocking-retries 3
  gprs cell timer unblocking-retries 3
  gprs cell timer reset-timer 3
  gprs cell timer reset-retries 3
  gprs cell timer suspend-timer 10
  gprs cell timer suspend-retries 3
  gprs cell timer resume-timer 10
  gprs cell timer resume-retries 3
  gprs cell timer capability-update-timer 10
  gprs cell timer capability-update-retries 3
  gprs nsei __NSEI__
  gprs ns timer tns-block 3
  gprs ns timer tns-block-retries 3
  gprs ns timer tns-reset 3
  gprs ns timer tns-reset-retries 3
  gprs ns timer tns-test 30
  gprs ns timer tns-alive 3
  gprs ns timer tns-alive-retries 10
  gprs nsvc 0 nsvci __NSVCI__
  gprs nsvc 0 local udp port 23001
  gprs nsvc 0 remote ip __CONTAINER_IP__
  gprs nsvc 0 remote udp port 23000
  gprs nsvc 1 nsvci 0
  gprs nsvc 1 local udp port 0
  gprs nsvc 1 remote ip 0.0.0.0
  gprs nsvc 1 remote udp port 0
  bs-power-control
   mode static
  ms-power-control
   mode dyn-bts
   ctrl-interval 2
   step-size inc 4 red 2
   rxlev-thresh lower 32 upper 38
   rxlev-thresh-comp lower 10 12 upper 19 20
   rxqual-thresh lower 3 upper 0
   rxqual-thresh-comp lower 5 7 upper 15 18
   ci-thresh fr-efr disable
   ci-thresh fr-efr lower 13 upper 17
   ci-thresh-comp fr-efr lower 5 7 upper 15 18
   ci-thresh hr disable
   ci-thresh hr lower 16 upper 21
   ci-thresh-comp hr lower 5 7 upper 15 18
   ci-thresh amr-fr disable
   ci-thresh amr-fr lower 7 upper 11
   ci-thresh-comp amr-fr lower 5 7 upper 15 18
   ci-thresh amr-hr disable
   ci-thresh amr-hr lower 13 upper 17
   ci-thresh-comp amr-hr lower 5 7 upper 15 18
   ci-thresh sdcch disable
   ci-thresh sdcch lower 12 upper 16
   ci-thresh-comp sdcch lower 5 7 upper 15 18
   ci-thresh gprs disable
   ci-thresh gprs lower 18 upper 24
   ci-thresh-comp gprs lower 5 7 upper 15 18
  trx 0
   rf_locked 0
   arfcn __ARFCN__
   nominal power 23
   max_power_red 0
   rsl e1 tei 0
   timeslot 0
    phys_chan_config CCCH+SDCCH4
    hopping enabled 0
   timeslot 1
    phys_chan_config SDCCH8
    hopping enabled 0
   timeslot 2
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 3
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 4
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 5
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 6
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 7
    phys_chan_config TCH/F
    hopping enabled 0
!
! ── Seconde BTS : le side-car fake_trx ────────────────────────────────────────
! Elle manquait ici. osmo-bts-trx-bts1.cfg s'annonce avec l'unit-id calcule par
! generate_configs.sh (6000 + operateur*10 + 2), mais aucun bloc "bts 1" ne
! l'attendait cote BSC : le BSC repondait
!     "Unable to find BTS configuration for 6012/0/0, disconnecting"
! puis la BTS se coupait ("Abis close"), ne demandait jamais POWERON, fake_trx
! n'emettait donc aucune horloge, et le module de demarrage concluait a une
! "course No clock" - un diagnostic qui designait le mauvais coupable. La
! sequence s'arretant la, la BTS PRINCIPALE ne demarrait pas non plus : plus
! aucune radio, pour un identifiant qui ne correspondait pas.
!
! Les valeurs viennent du meme plan que le reste : unit-id et ARFCN decales
! pour ne croiser ni la BTS principale, ni les operateurs voisins.
!
! PLACEMENT - NE PAS DEPLACER CE BLOC EN FIN DE FICHIER.
! [2026-08-27] Il y avait ete ajoute, apres "msc 0" / "bsc" / "end". Le parseur
! VTY est un automate a noeuds : "msc 0" ferme le noeud "network", et "end"
! ramene a la racine. Un " bts 1" indente d'un cran a cet endroit ne designe
! plus rien, d'ou :
!     Error occurred during reading the below line:
!      bts 1
!     DNM FATAL Failed to parse the config file (Invalid argument)
! osmo-bsc sortait en code 1, systemd le relancait en boucle, et la sequence de
! demarrage rapportait "VTY OsmoBSC (4242) : toujours pas pret apres 40s" -
! encore un symptome qui designait le mauvais coupable. "bts 1" doit rester
! DANS le noeud "network", a la suite de "bts 0" et AVANT "msc 0".
 bts 1
  type osmo-bts
  band __BAND__
  cell_identity __IPA_UNIT_ID_BTS1__
  location_area_code __LAC__
  base_station_id_code __BSIC_BTS1__
  ms max power __MS_MAX_POWER__
  cell reselection hysteresis __CELL_RESEL_HYST__
  rxlev access min __RXLEV_ACCESS_MIN__
  radio-link-timeout 32
  channel allocator mode chan-req descending
  channel allocator mode assignment ascending
  channel allocator mode handover ascending
  rach tx integer 9
  rach max transmission 7
  ipa unit-id __IPA_UNIT_ID_BTS1__ 0
  oml ipa stream-id 255 line 0
  neighbor-list mode automatic
  codec-support fr
  gprs mode none
  trx 0
   rf_locked 0
   arfcn __ARFCN_BTS1__
   nominal power 23
   max_power_red 0
   rsl e1 tei 0
   timeslot 0
    phys_chan_config CCCH+SDCCH4
    hopping enabled 0
   timeslot 1
    phys_chan_config SDCCH8
    hopping enabled 0
   timeslot 2
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 3
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 4
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 5
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 6
    phys_chan_config TCH/F
    hopping enabled 0
   timeslot 7
    phys_chan_config TCH/F
    hopping enabled 0
msc 0
 codec-list fr1 hr1 fr2 fr3 hr3
 allow-emergency deny
 amr-config 12_2k allowed
 amr-config 10_2k allowed
 amr-config 7_95k allowed
 amr-config 7_40k allowed
 amr-config 6_70k allowed
 amr-config 5_90k allowed
 amr-config 5_15k allowed
 amr-config 4_75k allowed
 amr-payload octet-aligned
 msc-addr addr-msc
 asp-protocol m3ua
 lcls-mode bts-loop
 lcls-codec-mismatch allowed
bsc
 mid-call-timeout 0
end

