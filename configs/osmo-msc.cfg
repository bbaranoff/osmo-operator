!
stats interval 5
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code __PC_MSC__
!
 ! MSC -> STP: same container, loopback.
 asp asp-to-stp 2905 2906 m3ua
  remote-ip 127.0.0.2
  local-ip  127.0.0.1
  role asp
  sctp-role client
  no shutdown
!
 as as-msc m3ua
  asp asp-to-stp
  routing-key __RCTX_MSC__ __PC_MSC__
  traffic-mode override
!
 sccp-address addr-bsc
  routing-indicator PC
  point-code __PC_BSC__
  subsystem-number 254
!
network
 network country code __MCC__
 mobile network code __MNC__
 short name __OP_NAME__
 long name __OP_NAME__
 encryption __ENCRYPTION__
 authentication optional
 rrlp mode none
 mm info 0
 mgw 0
  remote-ip 127.0.0.1
msc
 mncc external /tmp/msc_mncc
 mncc guard-timeout 180
 ncss guard-timeout 30
 assign-tmsi
 ! X1 raised from the 5 s default: a full LU (auth, ciphering, TMSI REALLOC
 ! COMPLETE) on the slower-than-real-time DSP bench would otherwise be rejected.
 timer geran X1 30
 lcls-permitted
 check-imei-rqd early
 ! SMS-over-GSUP: SM-RP goes to the HLR (proto-smsc-daemon) instead of the
 ! internal SMS store.
 sms-over-gsup
 auth-tuple-max-reuse-count 3
 auth-tuple-reuse-on-error 1

mncc-int
 default-codec tch-f fr
 default-codec tch-h hr
smpp
 local-tcp-port 2775
 policy closed
 # smpp-first: the SMS is offered to the ESME before internal delivery.
 # tools/osmo-phonesim-banc.py binds here as ESME (bench phone = subscriber
 # 100101) and re-injects a copy to the mobile through the VTY so both ring.
 smpp-first
 esme msc_tester
  password osmocom1
  route prefix national isdn 33
  # The bench phone's number, in the four numbering forms an SMS may carry.
  route prefix unknown unknown 100101
  route prefix unknown isdn 100101
  route prefix national isdn 100101
  route prefix international isdn 100101
hlr
 remote-ip __HLR_IP__
 remote-port 4222
 ipa-name VLR-SDR-OP__OPERATOR_ID__
sgs
 local-port 29118
 local-ip 127.0.0.1
 vlr-name vlr.msc001.mnc001.mcc001.3gppnetwork.org
asci
 disable
 gcr
