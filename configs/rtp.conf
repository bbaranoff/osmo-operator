; rtp.conf - Asterisk RTP configuration: port range for voice media.
; Template: __RTP_START__ / __RTP_END__ are substituted by
; apply_config_templates() (generate_configs.sh).
;
; With an external Linphone these ports must be published by Docker (-p) and
; opened in the firewall.

[general]
rtpstart=__RTP_START__
rtpend=__RTP_END__
strictrtp=no
icesupport=no
stunaddr=
