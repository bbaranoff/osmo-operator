# mobile.cfg.template — avec placeholders
# KI : "ki comp128 XX XX XX ... XX"  16 octets, octet 15=ms_idx, 16=op_id
#
# AUDIO :
#   tch-voice l1phy → mobile décode les TCH-FR depuis les bursts TRXD
#   fake_trx transporte le payload → trxcon → mobile → ALSA
#   Requis dans le container : libasound2-plugins + /dev/snd + PULSE_SERVER
!
line vty
 no login
 bind 127.0.0.1 4247
!
gps device /dev/ttyACM0
gps baudrate default
no gps enable
!
no hide-default
!
!
log gsmtap 127.0.0.1
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
!
ms 1
 layer2-socket /tmp/osmocom_l2
 sim test
 network-selection-mode auto
 imei __IMEI__ 0
 imei-fixed
 no emergency-imsi
 sms-service-center __SMS_SC__
 no call-waiting
 no auto-answer
 no force-rekey
 no clip
 no clir
 tx-power auto
 no simulated-delay
 stick __ARFCN__
 location-updating
 neighbour-measurement
 codec full-speed prefer
 codec half-speed
 no abbrev
 support
  sms
  a5/1
  a5/2
  p-gsm
  e-gsm
  r-gsm
  no gsm-850
  dcs
  no pcs
  class-900 4
  class-850 4
  class-dcs 1
  class-pcs 1
  channel-capability sdcch+tchf+tchh
  full-speech-v1
  full-speech-v2
  half-speech-v1
  min-rxlev -106
  dsc-max 90
  no skip-max-per-band
 test-sim
  imsi __IMSI__
  ki __SIM_ALGO__ __KI__
  no barred-access
  rplmn __MCC__ __MNC__
 tch-voice
  io-handler gapk
! [2026-08-27] FORMAT DE TRAME TCH : rtp, PAS ti.
! « ti » est le format Texas Instruments des vrais telephones Calypso, ou
! c'est le DSP qui fait le vocodage et rend ses trames dans SA disposition.
! Ici le DSP ne fait pas le codage canal : c'est pont.py qui l'assure, avec
! libosmocoding (gsm0503_tch_fr_encode/decode), laquelle parle la disposition
! RTP/RFC3551 — 33 octets ouverts par la signature 0xD.
! Les deux bouts ne se comprenaient donc pas, DANS LES DEUX SENS, et le son
! sortait robotise sans qu'aucun compteur ne bronche : les trames passaient,
! elles etaient simplement lues avec le mauvais plan.
! MESURE : anneau descendant (ecrit par le pont) d2 2c fd a2 1b ec 20 39...
!          -> signature 0xD, contenu qui varie = vraie parole ;
!          anneau montant (ecrit par le mobile en « ti ») 83 00 05 e1 e0 08
!          10 00 22 01 ff ff ff ff ff ff e0 00... -> pas de 0xD, plages de
!          ff et de 00 = une trame a champs, la disposition TI.
  io-tch-format rtp
  alsa-output-dev gsm_out
  alsa-input-dev gsm_in
 no shutdown
!
! GSMTAP configuration
!
gsmtap
 remote-host __INTER_NET_GATEWAY__
 no local-host
 lchan sacch
 lchan lsacch
 lchan sacch/4
 lchan sacch/8
 lchan sacch/f
 lchan sacch/h
 lchan unknown
 lchan bcch
 lchan ccch
 lchan rach
 lchan agch
 lchan pch
 lchan sdcch
 lchan sdcch/4
 lchan sdcch/8
 lchan facch/f
 lchan facch/h
 lchan pacch
 lchan cbch
 lchan pdch
 lchan pttch
 lchan tch/f
 lchan tch/h
 category gprs dl-unknown
 category gprs dl-dummy
 category gprs dl-ctrl
 category gprs dl-data-gprs
 category gprs dl-data-egprs
 category gprs ul-unknown
 category gprs ul-dummy
 category gprs ul-ctrl
 category gprs ul-data-gprs
 category gprs ul-data-egprs
end
