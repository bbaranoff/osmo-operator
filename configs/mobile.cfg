# mobile.cfg - osmocom-bb "mobile" configuration template (placeholders
# __IMEI__, __IMSI__, __KI__, __SIM_ALGO__, __MCC__, __MNC__, __ARFCN__,
# __SMS_SC__, __INTER_NET_GATEWAY__ are filled in by the config generators).
# KI: "ki comp128 XX XX ... XX", 16 bytes; byte 15 = ms_idx, byte 16 = op_id.
#
# Audio: fake_trx carries the TCH payload -> trxcon -> mobile -> ALSA (gapk).
# Required in the container: libasound2-plugins + /dev/snd + PULSE_SERVER.
!
line vty
 no login
 bind 127.0.0.1 4247
!
gps device /dev/ttyACM0
gps baudrate default
no gps enable
!
no hide-default
!
!
log gsmtap 127.0.0.1
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
 logging level plmn debug
 logging level sim debug
 logging level sap debug
!
ms 1
 layer2-socket /tmp/osmocom_l2
! SIM: "sim test" (the test-sim block below) by default. "sim sap" (SIM served
! over the SAP socket by softSIM: PC/SC reader or software SIM) is only set
! when --sap / --softsim is passed to start-native.sh (SAP_MODE=1); both
! generate_mobile_cfg (06-banc-dsp-menu.sh) and generate_configs.sh apply it.
 sap-socket /tmp/osmocom_sap
 sim test
 network-selection-mode auto
 imei __IMEI__ 0
 imei-fixed
 no emergency-imsi
 sms-service-center __SMS_SC__
 no call-waiting
 no auto-answer
 no force-rekey
 no clip
 no clir
 tx-power auto
 no simulated-delay
 stick __ARFCN__
 location-updating
 neighbour-measurement
 codec full-speed prefer
 codec half-speed
 no abbrev
 support
  sms
  a5/1
  a5/2
  p-gsm
  e-gsm
  r-gsm
  no gsm-850
  dcs
  no pcs
  class-900 4
  class-850 4
  class-dcs 1
  class-pcs 1
  channel-capability sdcch+tchf+tchh
  full-speech-v1
  full-speech-v2
  half-speech-v1
  min-rxlev -106
  dsc-max 90
  no skip-max-per-band
 test-sim
  imsi __IMSI__
  ki __SIM_ALGO__ __KI__
  no barred-access
  rplmn __MCC__ __MNC__
 tch-voice
  io-handler gapk
! TCH frame format must be rtp, not ti: "ti" is the Texas Instruments layout
! of real Calypso phones (DSP vocoder). Here channel coding is done by pont.py
! with libosmocoding, which uses the RTP/RFC3551 layout (33 bytes, 0xD
! signature). A mismatch gives robotic audio without any counter error.
  io-tch-format rtp
  alsa-output-dev gsm_out
  alsa-input-dev gsm_in
 no shutdown
!
! GSMTAP configuration
!
gsmtap
 remote-host __INTER_NET_GATEWAY__
 no local-host
 lchan sacch
 lchan lsacch
 lchan sacch/4
 lchan sacch/8
 lchan sacch/f
 lchan sacch/h
 lchan unknown
 lchan bcch
 lchan ccch
 lchan rach
 lchan agch
 lchan pch
 lchan sdcch
 lchan sdcch/4
 lchan sdcch/8
 lchan facch/f
 lchan facch/h
 lchan pacch
 lchan cbch
 lchan pdch
 lchan pttch
 lchan tch/f
 lchan tch/h
 category gprs dl-unknown
 category gprs dl-dummy
 category gprs dl-ctrl
 category gprs dl-data-gprs
 category gprs dl-data-egprs
 category gprs ul-unknown
 category gprs ul-dummy
 category gprs ul-ctrl
 category gprs ul-data-gprs
 category gprs ul-data-egprs
end
