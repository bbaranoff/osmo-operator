# pmbootstrap_v3.cfg - pmbootstrap template for the postmarketOS phone image
# (Phosh UI, qemu-amd64 device, modem/audio packages). Installed by
# tools/osmo-pmos-install.sh; tools/osmo-pmos-build.sh substitutes @WORK@ and
# @APORTS@ and writes the result to ~/.config/pmbootstrap_v3.cfg.

[pmbootstrap]
aports = @APORTS@
build_pkgs_on_install = False
extra_packages = alsa-utils,alsa-ucm-conf,pipewire,pipewire-alsa,wireplumber,socat,minicom,picocom,networkmanager,networkmanager-ppp,ppp
hostname = pmos-gsm
is_default_channel = False
locale = fr_FR.UTF-8
timezone = Europe/Paris
ui = phosh
device = qemu-amd64
work = @WORK@

[providers]

[mirrors]

