!
! OsmoBTS BTS#1 (side-car faketrx) — généré par start-native.sh (mode faketrx-qemu)
! NE PAS confondre avec /etc/osmocom/osmo-bts-trx.cfg (= BTS#0 QEMU, INTOUCHÉ).
!
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
!
log gsmtap __GATEWAY_IP__
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging print level 1
 logging level rsl info
 logging level oml info
 logging level rr notice
 logging level trx notice
 logging level abis debug
!
vty telnet-port 4250
!
ctrl
 bind 127.0.0.2 4239
!
line vty
 no login
!
e1_input
 e1_line 0 driver ipa
 e1_line 0 port 0
 no e1_line 0 keepalive
!
phy 0
 instance 0
  osmotrx rx-gain 40
  osmotrx tx-attenuation 50
 osmotrx ip local 127.0.0.1
 osmotrx ip remote 127.0.0.1
 osmotrx base-port local 5820
 osmotrx base-port remote 5720
 ! [2026-10-26] AVANCE SUR L'HORLOGE DE fake_trx. Avec le defaut (fn-advance 2) la BTS#1 livrait ses
 ! bursts exactement 2 trames trop tard sur cet hote : fake_trx les jetait (« Stale TRXD message
 ! (fn=22051): fn=22049 », 1985 fois en 5 min le 26/10), MS#2 recevait des blocs vides (trxcon
 ! « bad frame ber=456/456 »), perdait la synchro (110 fois) et rallumait fake_trx a chaque fois ;
 ! l'horloge TRX sautait, la BTS#1 finissait en « PC clock skew too high ». Meme principe que la
 ! BTS#0 du pont (osmo-bts-trx.cfg, fn-advance 20) : 10 trames d'avance suffisent au faux TRX.
 osmotrx fn-advance 10
 osmotrx rts-advance 5
!
bts 0
 band DCS1800
 ipa unit-id __IPA_UNIT_ID_BTS1__ 0
 oml remote-ip 127.0.0.1
 pcu-socket /tmp/pcu_bts2
 rtp jitter-buffer 100
 paging queue-size 200
 paging lifetime 0
 min-qual-rach 50
 min-qual-norm -5
 gsmtap-sapi ccch
 gsmtap-sapi pdtch
 trx 0
  power-ramp max-initial 23000 mdBm
  power-ramp step-size 2000 mdB
  power-ramp step-interval 1
  ms-power-control osmo
  phy 0 instance 0
