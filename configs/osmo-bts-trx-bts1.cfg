!
! osmo-bts-trx-bts1.cfg - OsmoBTS BTS#1 (fake_trx side-car), generated by
! start-native.sh (faketrx-qemu mode).
! Not to be confused with /etc/osmocom/osmo-bts-trx.cfg (BTS#0, QEMU).
!
log stderr
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
!
log gsmtap __GATEWAY_IP__
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging print level 1
 logging level rsl info
 logging level oml info
 logging level rr notice
 logging level trx notice
 logging level abis debug
!
vty telnet-port 4250
!
ctrl
 bind 127.0.0.2 4239
!
line vty
 no login
!
e1_input
 e1_line 0 driver ipa
 e1_line 0 port 0
 no e1_line 0 keepalive
!
phy 0
 instance 0
  osmotrx rx-gain 40
  osmotrx tx-attenuation 50
 osmotrx ip local 127.0.0.1
 osmotrx ip remote 127.0.0.1
 osmotrx base-port local 5820
 osmotrx base-port remote 5720
 ! Advance on the fake_trx clock: with the default fn-advance 2 the bursts
 ! arrive late and fake_trx drops them ("Stale TRXD message"). 10 frames are
 ! enough for the fake TRX (the bridge BTS#0 uses 20, see osmo-bts-trx.cfg).
 osmotrx fn-advance 10
 osmotrx rts-advance 5
!
bts 0
 band DCS1800
 ipa unit-id __IPA_UNIT_ID_BTS1__ 0
 oml remote-ip 127.0.0.1
 pcu-socket /tmp/pcu_bts2
 rtp jitter-buffer 100
 paging queue-size 200
 paging lifetime 0
 min-qual-rach 50
 min-qual-norm -5
 gsmtap-sapi ccch
 gsmtap-sapi pdtch
 trx 0
  power-ramp max-initial 23000 mdBm
  power-ramp step-size 2000 mdB
  power-ramp step-interval 1
  ms-power-control osmo
  phy 0 instance 0
