; ── Functions ────────────────────────────────────────────────────────────────
load = func_callerid.so
load = func_cdr.so
load = func_pjsip_endpoint.so
load = func_sorcery.so
load = func_devstate.so
load = func_strings.so
; [2026-09-09] MANQUAIT - ET IL CASSAIT TOUT APPEL VERS UN MOBILE LOCAL.
; func_logic fournit ${IF()}, utilise TROIS fois dans extensions.conf :
;     same => n,Set(ANNU_NUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:0)})
;     same => n,Gosub(sub-annuaire,${ANNU_NUM},1)
; dans [internal], [gsm_in] et [interop_in], sur le motif _1001XX. Le banc est
; en « autoload = no » : la fonction n etait pas enregistree, la substitution
; rendait une chaine VIDE, et le Gosub partait sur une extension vide - donc en
; echec, donc raccrochage. Trace, a chaque tentative d appel :
;     ERROR pbx_functions.c: Function IF not registered
; Le module etait pourtant bien present sur le disque
; (/usr/lib/x86_64-linux-gnu/asterisk/modules/func_logic.so) : rien a installer,
; juste cette ligne. Verifier : asterisk -rx "core show function IF".
load = func_logic.so

; ── PBX ──────────────────────────────────────────────────────────────────────
load = pbx_config.so

