[modules]
autoload = no

; ── BLOQUÉS — pas de SRTP/DTLS dans un core GSM ─────────────────────────────
; res_srtp est chargé comme dépendance par res_rtp_asterisk même avec autoload=no.
; Il inspecte les paquets RTP entrants et certains frames GSM-FR déclenchent :
;   "Received SSL traffic on RTP instance without an SSL session"
; → l'audio est jeté → pas de son.
; noload empêche le chargement même par dépendance.
noload = res_srtp.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so

; ── Applications ─────────────────────────────────────────────────────────────
load = app_bridgewait.so
load = app_dial.so
load = app_playback.so
load = app_stack.so
load = app_verbose.so
load = app_voicemail.so
load = app_directory.so
load = app_confbridge.so
load = app_queue.so
load = app_echo.so
load = app_mixmonitor.so

; ── Functions audio (jitterbuffer : lisse le transcodage forcé par l'enregistrement) ──
load = func_jitterbuffer.so

; ── Bridging ─────────────────────────────────────────────────────────────────
load = bridge_builtin_features.so
load = bridge_builtin_interval_features.so
load = bridge_holding.so
load = bridge_native_rtp.so
load = bridge_simple.so
load = bridge_softmix.so

; ── CDR ──────────────────────────────────────────────────────────────────────
load = cdr_custom.so
; [2026-09-09] AJOUTE - AUCUN APPEL N ETAIT ENREGISTRE NULLE PART.
; « cdr show status » listait « Registered Backends » VIDE : cdr_custom sans
; cdr_custom.conf n ecrit rien, et cdr_csv n etait pas charge. Master.csv
; restait donc absent alors qu Asterisk comptait 23 appels traites. Sans trace
; par appel (source, destination, disposition, duree), impossible de comparer
; deux tentatives - « la deuxieme a marche, pas les autres » n a aucun support.
; cdr_csv ecrit /var/log/asterisk/cdr-csv/Master.csv, une ligne par appel.
load = cdr_csv.so

; ── Channels ─────────────────────────────────────────────────────────────────
load = chan_bridge_media.so
load = chan_pjsip.so
; [2026-08-13] chan_iax2 RETIRÉ — inutilisé, mesuré et non supposé :
;   asterisk -rx "iax2 show peers"        -> 0 iax2 peers
;   asterisk -rx "module show like iax"   -> Use Count 0
;   aucun trunk/extension IAX dans extensions.conf. Tout passe par PJSIP.
;
; ⚠️ EFFET DE BORD, à connaître avant de chercher une sonde disparue :
; chan_iax2.so est le SEUL module du répertoire qui importe `jb_setoutput`
; (vérifié : nm -D -u sur tous les .so de /usr/lib/x86_64-linux-gnu/asterisk/
; modules). C'est donc lui qui branche les sorties de journal du moteur
; jitterbuf — moteur qui vit dans /usr/sbin/asterisk (la chaîne "Resyncing the
; jb" y est, elle n'est PAS dans chan_iax2.so) et qui sert le JITTERBUFFER
; adaptatif de func_jitterbuffer, pas IAX.
; Conséquence : sans chan_iax2, le jitterbuffer TOURNE TOUJOURS mais devient
; MUET — plus une seule ligne « Resyncing the jb ... » dans /var/log/asterisk/
; messages. C'était la seule sonde du JB. Pour la récupérer : remettre `load`.
noload = chan_iax2.so

; ── Codecs ───────────────────────────────────────────────────────────────────
load = codec_gsm.so
load = codec_resample.so
load = codec_alaw.so
load = codec_ulaw.so
