; modules.conf - Asterisk module list for the GSM core (autoload = no:
; only the modules listed below are loaded).
[modules]
autoload = no

; ── Blocked - no SRTP/DTLS in a GSM core ─────────────────────────────────────
; res_srtp is pulled in as a dependency by res_rtp_asterisk even with
; autoload=no. It inspects incoming RTP and some GSM-FR frames trigger
; "Received SSL traffic on RTP instance without an SSL session", after which
; the audio is dropped. noload prevents loading even as a dependency.
noload = res_srtp.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so

; ── Applications ─────────────────────────────────────────────────────────────
load = app_bridgewait.so
load = app_dial.so
load = app_playback.so
load = app_stack.so
load = app_verbose.so
load = app_voicemail.so
load = app_directory.so
load = app_confbridge.so
load = app_queue.so
load = app_echo.so
load = app_mixmonitor.so

; ── Audio functions (jitterbuffer: smooths the transcoding forced by recording) ──
load = func_jitterbuffer.so

; ── Bridging ─────────────────────────────────────────────────────────────────
load = bridge_builtin_features.so
load = bridge_builtin_interval_features.so
load = bridge_holding.so
load = bridge_native_rtp.so
load = bridge_simple.so
load = bridge_softmix.so

; ── CDR ──────────────────────────────────────────────────────────────────────
load = cdr_custom.so
; cdr_csv writes /var/log/asterisk/cdr-csv/Master.csv, one line per call
; (cdr_custom alone writes nothing without a cdr_custom.conf).
load = cdr_csv.so

; ── Channels ─────────────────────────────────────────────────────────────────
load = chan_bridge_media.so
load = chan_pjsip.so
; chan_iax2 is unused (everything goes through PJSIP). Side effect: it is the
; only module that calls jb_setoutput, i.e. the only one that wires the log
; output of the jitterbuf engine used by func_jitterbuffer. Without it the
; jitterbuffer still runs but logs no "Resyncing the jb ..." lines; set
; `load` again to get that probe back.
noload = chan_iax2.so

; ── Codecs ───────────────────────────────────────────────────────────────────
load = codec_gsm.so
load = codec_resample.so
load = codec_alaw.so
load = codec_ulaw.so
load = codec_g722.so

; ── Formats ──────────────────────────────────────────────────────────────────
load = format_gsm.so
load = format_pcm.so
load = format_wav_gsm.so
load = format_wav.so

; ── Functions ────────────────────────────────────────────────────────────────
load = func_callerid.so
load = func_cdr.so
load = func_pjsip_endpoint.so
load = func_sorcery.so
load = func_devstate.so
load = func_strings.so
; func_logic provides ${IF()}, used by extensions.conf ([internal], [gsm_in],
; [interop_in]); without it calls to local mobiles fail with
; "Function IF not registered". Check: asterisk -rx "core show function IF".
load = func_logic.so

; ── PBX ──────────────────────────────────────────────────────────────────────
load = pbx_config.so

