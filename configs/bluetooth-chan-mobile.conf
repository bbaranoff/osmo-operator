# chan_mobile (Asterisk) publie son profil mains-libres par l ancienne interface
# SDP de BlueZ : il faut le mode compatible (-C), sinon « sdp_register: Failed »
# et le telephone coupe la poignee de main. Le socket SDP est ouvert au groupe
# d Asterisk.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -C
ExecStartPost=/bin/sh -c 'for i in 1 2 3 4 5; do [ -S /var/run/sdp ] && break; sleep 1; done; chgrp asterisk /var/run/sdp; chmod 660 /var/run/sdp; true'
