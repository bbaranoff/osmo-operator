-- =============================================================================
--  osmo-conky.conf - Conky dashboard of the bench (live ISO and installed system)
-- =============================================================================
--  Started by /etc/xdg/autostart/osmo-conky.desktop (installed by build-iso.sh
--  in the desktop block) for every GNOME session: root on the live USB key,
--  the user created by Calamares on an installed disk.
--      conky -c /opt/GSM/osmo-operator/configs/conky/osmo-conky.conf
--
--  The bench lines come from tools/conky-osmo-status.sh (execpi: its output is
--  conky text with its own colours). The path /opt/GSM/osmo-operator is fixed:
--  the repository lives there on both the live key and the installed disk.
--
--  The SELECTOR (◀ ... ▶): the central block follows the chosen stop - op1,
--  the running docker operators, the inter-STP hub, 4G. Conky receives no
--  clicks: the arrows are driven with Ctrl+AltGr+Left/Right, with the arrows
--  of the panel (tools/osmo-panel.py) or with "osmo-op --next" (tools/osmo-op.sh).
--  The list of stops is that of "osmo-op --list-vue".
--
--  Appearance: Ubuntu font for all text, Ubuntu Mono for what aligns in
--  columns. The dots ● ○ and arrows ↓ ↑ ◀ ▶, which Ubuntu lacks, are drawn
--  glyph by glyph in DejaVu Sans 9 by the status script (OK/KO/WARN, FS/FU):
--  Conky does not fall back to another font. osmo-conky.lua (Cairo) paints a
--  translucent dark rounded panel behind the text. Colours by kind of
--  information: titles and CPU blue (color1), OK green (color2), missing red
--  (color3), warnings and upload orange (color4), labels grey (color5),
--  hostname and disk violet (color6), time and highlighted values yellow
--  (color7).
--  Conky is on screen only while a bench runs: osmo-panel.py fades it in and
--  out (window opacity) together with the panel.
conky.config = {
    alignment = 'top_right',
    gap_x = 20, gap_y = 44,
    minimum_width = 400, maximum_width = 400,
    update_interval = 2.0,
    total_run_times = 0,
    background = false,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2, net_avg_samples = 2,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    -- the panel is painted by osmo-conky.lua (rounded corners): the window
    -- itself stays fully transparent
    own_window_argb_value = 0,
    own_window_colour = '0b1020',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 18, border_outer_margin = 0,
    draw_borders = false, draw_shades = false, draw_outline = false, draw_graph_borders = false,
    lua_load = '/opt/GSM/osmo-operator/configs/conky/osmo-conky.lua',
    lua_draw_hook_pre = 'panneau',
    use_xft = true, font = 'Ubuntu:size=9', xftalpha = 1,
    override_utf8_locale = true,
    default_color = 'e8eef6',
    color1 = '5ac8fa',   -- blue    : titles, CPU, values
    color2 = '3fe08a',   -- green   : OK, RAM, download rate
    color3 = 'ff5c6c',   -- red     : missing, failed
    color4 = 'ffb347',   -- orange  : warnings, upload rate, load
    color5 = '9aa7b8',   -- grey    : labels, rules
    color6 = 'b48cff',   -- violet  : the machine, the disk, the operator
    color7 = 'ffd166',   -- yellow  : time, highlighted values
    default_bar_width = 180, default_bar_height = 5,
    default_graph_width = 364, default_graph_height = 26,
    text_buffer_size = 4096,
};

conky.text = [[
${font Ubuntu:bold:size=16}${color1}OSMO${color5}-${color6}OPERATOR${font}${color}${alignr}${font Ubuntu:size=8}${color5}${execi 60 . /etc/os-release 2>/dev/null; echo "${VARIANT:-$PRETTY_NAME}"}${font}${color}
${voffset -2}${color5}${hr 1}${color}
${voffset 2}${font Ubuntu Mono:size=9}${color5}hôte   ${color6}${nodename}${color}${alignr}${execpi 30 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh role}
${color5}noyau  ${color}${kernel}${alignr}${color5}up ${color7}${uptime_short} ${color5}· charge ${color4}${loadavg 1}${color}${font}
${voffset 8}${font Ubuntu:bold:size=10}${color1}Système${font}${color}${alignr}${font Ubuntu:size=8}${color5}${freq_g} GHz · ${color4}${execi 10 t=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null); [ -n "$t" ] && echo "$((t/1000))°C"}${font}${color}
${voffset 3}${color5}CPU${color}     ${color1}${cpu cpu0}%${color}${alignr}${color1}${cpubar 5,220 cpu0}${color}
${voffset 2}${cpugraph cpu0 26,364 3fe08a 5ac8fa}
${voffset -2}${color5}RAM${color}     ${color2}${mem}${color5} / ${memmax}${color}${alignr}${color2}${membar 5,220}${color}
${voffset 2}${color5}Disque${color}  ${color6}${fs_used /}${color5} / ${fs_size /}${color}${alignr}${color6}${fs_bar 5,220 /}${color}
${voffset 2}${color5}Procs${color}   ${processes} ${color5}· ${color2}${running_processes}${color5} actifs${color}${alignr}${color5}top ${color7}${top name 1} ${top cpu 1}%${color}
${voffset 8}${font Ubuntu:bold:size=10}${color1}Réseau${font}${color}
${voffset 3}${font Ubuntu Mono:size=9}${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh net}${font}
${voffset 6}${color5}${hr 1}${color}
${voffset 3}${execpi 5 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh vue}
${voffset 6}${color5}${hr 1}${color}
${voffset 3}${font Ubuntu:bold:size=10}${color1}Services${font}${color}
${voffset 3}${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh services}
${voffset 6}${color5}${hr 1}${color}
${voffset 3}${alignc}${font Ubuntu:size=8}${color7}sudo -i · ./start-native.sh${color}   ${color5}web ${color1}:8443${color}   ${color5}VTY ${color1}nc 127.0.0.1 4239${color}${font}
]]
