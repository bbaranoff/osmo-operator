-- =============================================================================
--  osmo-conky.conf - le tableau de bord Conky du banc (live ET systeme installe)
-- =============================================================================
--  Lance par /etc/xdg/autostart/osmo-conky.desktop (pose par build-iso.sh dans
--  le bloc desktop) pour toute session GNOME, donc pour root sur la cle et
--  pour l utilisateur cree par Calamares sur le disque. Les lignes du banc
--  LE SELECTEUR (◀ ... ▶) : le bloc central suit l arret choisi - op1, les
--  operateurs docker qui tournent, le hub inter-STP, la 4G. Conky ne recoit
--  pas les clics : on pousse les fleches avec Ctrl+AltGr+Gauche/Droite, celles
--  de l encart (tools/osmo-panel.py) ou « osmo-op --next ». La liste des
--  arrets est celle de « osmo-op --list-vue ».
--  Les lignes du banc
--  viennent de tools/conky-osmo-status.sh (execpi : la sortie est du texte
--  conky, avec ses couleurs). Chemin fixe /opt/GSM/osmo-operator : c est la
--  que vit le depot sur les deux.
--      conky -c /opt/GSM/osmo-operator/configs/conky/osmo-conky.conf
--
--  [2026-10-01] LE VISUEL. Police Ubuntu (titres, texte) et Ubuntu Mono pour ce
--  qui s aligne en colonnes (reseau, pastilles) ; plus de cadre blanc autour
--  du graphe CPU (draw_graph_borders), un degrade vert -> bleu a la place ;
--  des libelles en gris doux (color5) devant les valeurs en clair ; des
--  barres fines et longues ; un peu d air entre les sections (voffset).
--  Les blocs du script d etat (reseau, vue, services) restent en DejaVu Sans
--  Mono : ils portent ◀ ▶ ● ○ ↓ ↑, qu Ubuntu Mono n a pas (carres a l ecran,
--  verifie) - et Conky ne replie pas sur une autre police.
conky.config = {
    alignment = 'top_right',
    gap_x = 20, gap_y = 44,
    minimum_width = 400, maximum_width = 400,
    update_interval = 2.0,
    total_run_times = 0,
    background = false,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2, net_avg_samples = 2,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 196,
    own_window_colour = '0b1020',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 14, border_outer_margin = 0,
    draw_borders = false, draw_shades = false, draw_outline = false, draw_graph_borders = false,
    use_xft = true, font = 'Ubuntu:size=9', xftalpha = 0.96,
    override_utf8_locale = true,
    default_color = 'e6edf3',
    color1 = '58a6ff',   -- bleu : titres, valeurs
    color2 = '3fb950',   -- vert : OK
    color3 = 'f85149',   -- rouge : absent
    color4 = 'd29922',   -- jaune : attention
    color5 = '8b949e',   -- gris : libelles, lignes de separation
    default_bar_width = 180, default_bar_height = 5,
    default_graph_width = 372, default_graph_height = 26,
    text_buffer_size = 4096,
};

conky.text = [[
${font Ubuntu:bold:size=15}${color1}OSMO-OPERATOR${font}${color}${alignr}${font Ubuntu:size=8}${color5}${execi 60 tools_dir=/opt/GSM/osmo-operator; . /etc/os-release 2>/dev/null; echo "${VARIANT:-$PRETTY_NAME}"}${font}${color}
${voffset -4}${color5}${hr 1}${color}
${font Ubuntu Mono:size=9}${color5}hôte  ${color}${nodename}${alignr}${execpi 30 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh role}
${color5}noyau ${color}${kernel}${alignr}${color5}up${color} ${uptime_short} ${color5}· charge${color} ${loadavg 1}${font}
${voffset 6}${font Ubuntu:bold:size=10}${color1}Système${font}${color}${alignr}${font Ubuntu:size=8}${color5}${freq_g} GHz · ${execi 10 t=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null); [ -n "$t" ] && echo "$((t/1000))°C"}${font}${color}
${voffset 2}${color5}CPU${color}  ${cpu cpu0}%${alignr}${color1}${cpubar 5,220 cpu0}${color}
${voffset 2}${cpugraph cpu0 26,372 3fb950 58a6ff}
${voffset -2}${color5}RAM${color}  ${mem} ${color5}/${color} ${memmax}${alignr}${color1}${membar 5,220}${color}
${voffset 2}${color5}Disque${color}  ${fs_used /} ${color5}/${color} ${fs_size /}${alignr}${color1}${fs_bar 5,220 /}${color}
${voffset 2}${color5}Procs${color}  ${processes} ${color5}·${color} ${running_processes} actifs${alignr}${color5}top${color} ${top name 1} ${top cpu 1}%
${voffset 6}${font Ubuntu:bold:size=10}${color1}Réseau${font}${color}
${voffset 2}${font DejaVu Sans Mono:size=9}${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh net}${font}
${voffset 6}${color5}${hr 1}${color}
${voffset 2}${font DejaVu Sans Mono:size=9}${execpi 5 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh vue}${font}
${voffset 6}${color5}${hr 1}${color}
${voffset 2}${font Ubuntu:bold:size=10}${color1}Services${font}${color}
${voffset 2}${font DejaVu Sans Mono:size=9}${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh services}${font}
${voffset 6}${color5}${hr 1}${color}
${voffset 2}${alignc}${font Ubuntu:size=8}${color4}sudo -i · ./start-direct.sh${color}   ${color5}web${color} :8443   ${color5}VTY${color} nc 127.0.0.1 4239${font}
]]
