-- =============================================================================
--  osmo-conky.conf - le tableau de bord Conky du banc (live ET systeme installe)
-- =============================================================================
--  Lance par /etc/xdg/autostart/osmo-conky.desktop (pose par build-iso.sh dans
--  le bloc desktop) pour toute session GNOME, donc pour root sur la cle et
--  pour l utilisateur cree par Calamares sur le disque. Les lignes du banc
--  viennent de tools/conky-osmo-status.sh (execpi : la sortie est du texte
--  conky, avec ses couleurs). Chemin fixe /opt/GSM/osmo-operator : c est la
--  que vit le depot sur les deux.
--      conky -c /opt/GSM/osmo-operator/configs/conky/osmo-conky.conf
conky.config = {
    alignment = 'top_right',
    gap_x = 24, gap_y = 40,
    minimum_width = 400, maximum_width = 400,
    update_interval = 2.0,
    total_run_times = 0,
    background = false,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2, net_avg_samples = 2,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = '0d1117',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 12, border_outer_margin = 0,
    draw_borders = false, draw_shades = false, draw_outline = false, draw_graph_borders = true,
    use_xft = true, font = 'DejaVu Sans Mono:size=9', xftalpha = 0.95,
    override_utf8_locale = true,
    default_color = 'e6edf3',
    color1 = '58a6ff',   -- bleu : titres, valeurs
    color2 = '3fb950',   -- vert : OK
    color3 = 'f85149',   -- rouge : absent
    color4 = 'd29922',   -- jaune : attention
    default_graph_width = 180, default_graph_height = 24,
    text_buffer_size = 4096,
};

conky.text = [[
${font DejaVu Sans:bold:size=15}${color1}OSMO-OPERATOR${font}${color}${alignr}${execi 60 tools_dir=/opt/GSM/osmo-operator; . /etc/os-release 2>/dev/null; echo "${VARIANT:-$PRETTY_NAME}"}
${color1}${hr 1}${color}
${nodename}${alignr}${execpi 30 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh role}
${kernel}${alignr}up ${uptime_short}  · charge ${loadavg 1}
${font DejaVu Sans:bold:size=10}${color1}Systeme${font}${color}
CPU ${cpu cpu0}% ${cpubar 7,110 cpu0}${alignr}${freq_g} GHz  ${execi 10 t=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null); [ -n "$t" ] && echo "$((t/1000))°C"}
${cpugraph cpu0 24,376 58a6ff 3fb950 -t}
RAM ${mem} / ${memmax}${alignr}${membar 7,110}
Disque / ${fs_used /} / ${fs_size /}${alignr}${fs_bar 7,110 /}
Procs ${processes} (${running_processes} actifs)${alignr}top ${top name 1} ${top cpu 1}%
${font DejaVu Sans:bold:size=10}${color1}Reseau${font}${color}
${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh net}
${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh ops}
${font DejaVu Sans:bold:size=10}${color1}Coeur GSM${font}${color}
${execpi 5 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh core}
${font DejaVu Sans:bold:size=10}${color1}Radio / MS${font}${color}
${execpi 5 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh radio}
${font DejaVu Sans:bold:size=10}${color1}Abonnes (HLR)${font}${color}
${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh subs}
${font DejaVu Sans:bold:size=10}${color1}Services${font}${color}
${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh services}
${color1}${hr 1}${color}
${alignc}${color4}sudo -i · ./start-direct.sh${color}   web :8443   VTY nc 127.0.0.1 4239
]]
