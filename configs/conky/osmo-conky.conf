-- =============================================================================
--  osmo-conky.conf - le tableau de bord Conky du banc (live ET systeme installe)
-- =============================================================================
--  Lance par /etc/xdg/autostart/osmo-conky.desktop (pose par build-iso.sh dans
--  le bloc desktop) pour toute session GNOME, donc pour root sur la cle et
--  pour l utilisateur cree par Calamares sur le disque. Les lignes du banc
--  LE SELECTEUR (◀ ... ▶) : le bloc central suit l arret choisi - op1, les
--  operateurs docker qui tournent, le hub inter-STP, la 4G. Conky ne recoit
--  pas les clics : on pousse les fleches avec Ctrl+AltGr+Gauche/Droite, celles
--  de l encart (tools/osmo-panel.py) ou « osmo-op --next ». La liste des
--  arrets est celle de « osmo-op --list-vue ».
--  Les lignes du banc
--  viennent de tools/conky-osmo-status.sh (execpi : la sortie est du texte
--  conky, avec ses couleurs). Chemin fixe /opt/GSM/osmo-operator : c est la
--  que vit le depot sur les deux.
--      conky -c /opt/GSM/osmo-operator/configs/conky/osmo-conky.conf
--
--  [2026-10-01] LE VISUEL. Police Ubuntu (titres, texte) et Ubuntu Mono pour ce
--  qui s aligne en colonnes (reseau, pastilles) ; plus de cadre blanc autour
--  du graphe CPU (draw_graph_borders), un degrade vert -> bleu a la place ;
--  des libelles en gris doux (color5) devant les valeurs en clair ; des
--  barres fines et longues ; un peu d air entre les sections (voffset).
--  Les blocs du script d etat (reseau, vue, services) restent en DejaVu Sans
--  Mono : ils portent ◀ ▶ ● ○ ↓ ↑, qu Ubuntu Mono n a pas (carres a l ecran,
--  verifie) - et Conky ne replie pas sur une autre police.
--
--  [2026-10-12] REFONTE : UBUNTU PARTOUT, UN PANNEAU, DES COULEURS.
--  - Le fond d ecran est devenu une ville sous un ciel bleu clair : le texte
--    pose a meme le ciel ne se lisait plus. osmo-conky.lua (Cairo) peint une
--    plaque sombre translucide aux coins arrondis, un filet, un trait d accent.
--    Plus d ombres portees : la plaque suffit.
--  - Police Ubuntu pour TOUT le texte (Ubuntu Mono pour ce qui s aligne en
--    colonnes). Les pastilles ● ○ et les fleches ↓ ↑ ◀ ▶, qu Ubuntu n a pas,
--    sont rendues glyphe par glyphe en DejaVu Sans 9 par le script d etat
--    (tools/conky-osmo-status.sh : OK/KO/WARN, FS/FU) - l ancien bloc en
--    DejaVu Sans Mono rendait des carres des que le script remettait la police
--    par defaut (${font}) devant une pastille.
--  - Des couleurs PAR NATURE d information, pas une seule teinte : titres et
--    CPU en bleu (color1), ce qui va bien en vert (color2), ce qui manque en
--    rouge (color3), l attention et le debit montant en orange (color4), les
--    libelles en gris (color5), le nom de la machine et le disque en violet
--    (color6), le temps et les valeurs mises en avant en jaune (color7).
--  - Conky n est a l ecran que si un banc tourne : osmo-panel.py le fait
--    apparaitre et disparaitre en fondu (opacite de la fenetre) avec l encart.
conky.config = {
    alignment = 'top_right',
    gap_x = 20, gap_y = 44,
    minimum_width = 400, maximum_width = 400,
    update_interval = 2.0,
    total_run_times = 0,
    background = false,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2, net_avg_samples = 2,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    -- la plaque est peinte par osmo-conky.lua (coins arrondis) : la fenetre
    -- elle-meme reste entierement transparente
    own_window_argb_value = 0,
    own_window_colour = '0b1020',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 18, border_outer_margin = 0,
    draw_borders = false, draw_shades = false, draw_outline = false, draw_graph_borders = false,
    lua_load = '/opt/GSM/osmo-operator/configs/conky/osmo-conky.lua',
    lua_draw_hook_pre = 'panneau',
    use_xft = true, font = 'Ubuntu:size=9', xftalpha = 1,
    override_utf8_locale = true,
    default_color = 'e8eef6',
    color1 = '5ac8fa',   -- bleu    : titres, CPU, valeurs
    color2 = '3fe08a',   -- vert    : OK, RAM, debit descendant
    color3 = 'ff5c6c',   -- rouge   : absent, en echec
    color4 = 'ffb347',   -- orange  : attention, debit montant, charge
    color5 = '9aa7b8',   -- gris    : libelles, filets
    color6 = 'b48cff',   -- violet  : la machine, le disque, l operateur
    color7 = 'ffd166',   -- jaune   : le temps, les valeurs en avant
    default_bar_width = 180, default_bar_height = 5,
    default_graph_width = 364, default_graph_height = 26,
    text_buffer_size = 4096,
};

conky.text = [[
${font Ubuntu:bold:size=16}${color1}OSMO${color5}-${color6}OPERATOR${font}${color}${alignr}${font Ubuntu:size=8}${color5}${execi 60 . /etc/os-release 2>/dev/null; echo "${VARIANT:-$PRETTY_NAME}"}${font}${color}
${voffset -2}${color5}${hr 1}${color}
${voffset 2}${font Ubuntu Mono:size=9}${color5}hôte   ${color6}${nodename}${color}${alignr}${execpi 30 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh role}
${color5}noyau  ${color}${kernel}${alignr}${color5}up ${color7}${uptime_short} ${color5}· charge ${color4}${loadavg 1}${color}${font}
${voffset 8}${font Ubuntu:bold:size=10}${color1}Système${font}${color}${alignr}${font Ubuntu:size=8}${color5}${freq_g} GHz · ${color4}${execi 10 t=$(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null); [ -n "$t" ] && echo "$((t/1000))°C"}${font}${color}
${voffset 3}${color5}CPU${color}     ${color1}${cpu cpu0}%${color}${alignr}${color1}${cpubar 5,220 cpu0}${color}
${voffset 2}${cpugraph cpu0 26,364 3fe08a 5ac8fa}
${voffset -2}${color5}RAM${color}     ${color2}${mem}${color5} / ${memmax}${color}${alignr}${color2}${membar 5,220}${color}
${voffset 2}${color5}Disque${color}  ${color6}${fs_used /}${color5} / ${fs_size /}${color}${alignr}${color6}${fs_bar 5,220 /}${color}
${voffset 2}${color5}Procs${color}   ${processes} ${color5}· ${color2}${running_processes}${color5} actifs${color}${alignr}${color5}top ${color7}${top name 1} ${top cpu 1}%${color}
${voffset 8}${font Ubuntu:bold:size=10}${color1}Réseau${font}${color}
${voffset 3}${font Ubuntu Mono:size=9}${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh net}${font}
${voffset 6}${color5}${hr 1}${color}
${voffset 3}${execpi 5 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh vue}
${voffset 6}${color5}${hr 1}${color}
${voffset 3}${font Ubuntu:bold:size=10}${color1}Services${font}${color}
${voffset 3}${execpi 10 /opt/GSM/osmo-operator/tools/conky-osmo-status.sh services}
${voffset 6}${color5}${hr 1}${color}
${voffset 3}${alignc}${font Ubuntu:size=8}${color7}sudo -i · ./start-direct.sh${color}   ${color5}web ${color1}:8443${color}   ${color5}VTY ${color1}nc 127.0.0.1 4239${color}${font}
]]
