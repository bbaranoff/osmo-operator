<!doctype html><html><head><meta charset="utf-8">
<title>LAB GSM</title>
<style>
  /* [2026-10-01] LISIBLE, EN UBUNTU, ET VIVANTE.
     - Les tailles sont en vw (largeur de la zone, 1110 px de reference), plus en
       vh : la fenetre est rabattue sur la hauteur du contenu (osmo-topzone.py,
       INJECT_CSS), et des polices en vh de 500 px donnaient 7 a 10 px de texte.
     - Tailles calees pour que la carte (TOP_BOX y=60) S ARRETE AU-DESSUS de
       l encart (y=220) : sans titre, elle tient en ~160 px de reference.
     - Police Ubuntu partout (fonts-ubuntu est dans l image, 80-chroot.sh).
     - Une rangee « banc en temps reel » sous les timeslots : coeur, radio,
       abonnes, appels, depuis quand - poussee par osmo-ts-probe.py dans
       timeslots.json (core / radio / phy / subs / calls / up). */
  :root{
    --ink:#131018; --ink2:#1c1822; --card:rgba(13,11,20,.68);
    --bone:#f4eddc; --dim:#c9bfab; --violet:#9d8cf0; --violet2:#6f5fc0;
    --teal:#4fe0b6; --moon:#b4c2ea; --orange:#ff9a3c; --pink:#ff4d6d;
    --ok:#3fb950; --ko:#f85149;
    --line:rgba(244,237,220,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;color:var(--bone);
    font-family:"Ubuntu","Ubuntu Sans",sans-serif;overflow:hidden}
  #card{position:absolute;inset:0;border:1px solid var(--line);border-radius:18px;
    background:var(--card);backdrop-filter:blur(3px);padding:1vw 1.8vw .9vw;
    display:flex;flex-direction:column;gap:.45vw;transition:opacity .6s ease}
  #card.faded{opacity:0;pointer-events:none}
  .eyebrow{display:flex;justify-content:space-between;align-items:center;
    color:var(--dim);letter-spacing:.16em;font-size:.9vw;font-weight:500}
  .eyebrow .dot{color:var(--teal)}
  .pill{border:1px solid rgba(79,224,182,.55);border-radius:.8vw;padding:.3vw .9vw;color:var(--teal);
    font-family:"Ubuntu Mono",monospace;letter-spacing:.06em;font-size:.95vw}
  h1{margin:0;font-family:"Ubuntu","Ubuntu Sans",sans-serif;font-weight:700;
    font-size:5vw;line-height:1;letter-spacing:.01em;
    background:linear-gradient(92deg,var(--violet),#c4b6ff 60%,var(--moon));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:#e6ddcb;font-size:1.35vw;line-height:1.4;max-width:78%}
  .lede b{color:#fff;font-weight:500}
  .meta{color:var(--dim);letter-spacing:.12em;font-size:.85vw;font-weight:500}
  /* la rangee des timeslots : huit colonnes de meme largeur, hautes */
  #ts{display:grid;grid-template-columns:repeat(8,1fr);gap:.7vw;min-height:4.2vw}
  .ts{border:1px solid rgba(180,194,234,.3);border-radius:.8vw;padding:.5vw .4vw;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vw;
    text-align:center;background:rgba(28,24,34,.55);position:relative;gap:.3vw;
    transition:box-shadow .18s,border-color .18s,background .18s}
  .ts .n{font-weight:700;font-size:1.5vw;line-height:1}
  .ts .k{color:var(--dim);font-size:.9vw;letter-spacing:.04em;font-family:"Ubuntu Mono",monospace}
  .ts.bcch{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}
  /* clignotement orange quand le timeslot porte des bursts */
  .ts.on{border-color:var(--orange);
    background:rgba(255,154,60,.16);
    box-shadow:0 0 14px rgba(255,154,60,.55),0 0 0 1px var(--orange) inset;
    animation:blink .9s steps(2,end) infinite}
  @keyframes blink{50%{box-shadow:0 0 4px rgba(255,154,60,.2),0 0 0 1px rgba(255,154,60,.4) inset;
    background:rgba(255,154,60,.05)}}
  /* ── LE BANC EN TEMPS REEL ──────────────────────────────────────────── */
  #live{display:flex;gap:.6vw;flex-wrap:wrap;align-items:center;
    border-top:1px solid var(--line);padding-top:.45vw}
  .grp{display:flex;align-items:center;gap:.35vw;border:1px solid var(--line);
    border-radius:.8vw;padding:.2vw .6vw;background:rgba(28,24,34,.45);font-size:.95vw}
  .grp .lab{color:var(--dim);letter-spacing:.08em;font-size:.9vw;margin-right:.2vw;font-weight:500}
  .grp .d{font-family:"Ubuntu Mono",monospace;font-size:.95vw;color:var(--dim)}
  .grp .d.ok{color:var(--ok)} .grp .d.ko{color:var(--ko)}
  .grp b{font-weight:500;color:var(--bone)}
  .grp.warn{border-color:rgba(255,154,60,.6);color:var(--orange)}
  .grp.call{border-color:rgba(79,224,182,.7);color:var(--teal)}
  .tags{display:flex;gap:.5vw;flex-wrap:wrap;align-items:center}
  .tag{border:1px solid var(--line);border-radius:.8vw;padding:.2vw .7vw;color:var(--dim);font-size:.9vw}
  .tag b{color:var(--bone);font-weight:500}
  .foot{margin-left:auto;color:var(--dim);font-size:.85vw}
  #noconf{color:var(--orange);opacity:.9}
</style></head>
<body>
<div id="card">
  <div class="eyebrow">
    <div><span class="dot">●</span> SOFTWARE DEFINED RADIO · UM INTERFACE · GR-GSM</div>
    <div class="pill" id="arfcn">ARFCN 514 · DCS 1800</div>
  </div>
  <!-- [2026-10-01] Plus de titre « LAB GSM » ni de paragraphe de presentation :
       la banniere ne porte que le vivant - timeslots, banc, tags. -->
  <div class="meta">TRAME TDMA · 8 TIMESLOTS · 4,615 MS</div>
  <div id="ts"></div>
  <div id="live"></div>
  <div class="tags" id="tags">
    <div class="tag">IMSI <b id="imsi">001-01</b></div>
    <div class="tag" id="a5tag">A5/1 <b>✓</b></div>
    <div class="tag">COMP128v1 <b>✓</b></div>
    <div class="tag">TCH/F · GAPK fr</div>
    <div class="tag">gr-gsm · trxcon · osmo-bts-trx</div>
    <div id="noconf" class="tag" hidden>osmo-bsc non détecté — animation de démonstration</div>
    <div class="foot">bbaranoff.github.io</div>
  </div>
</div>

<script>
// Libelles courts par type de canal physique (phys_chan_config d osmo-bsc).
const LABEL = {
  "CCCH+SDCCH4":"FCCH·SCH·BCCH", "CCCH":"FCCH·SCH·BCCH", "BCCH":"BCCH",
  "SDCCH8":"SDCCH", "SDCCH8+CBCH":"SDCCH", "SDCCH":"SDCCH",
  "TCH/F":"TCH/F", "TCH/H":"TCH/H", "TCH/F_PDCH":"TCH/F·PDCH",
  "PDCH":"PDCH", "TCH/F_TCH/H_PDCH":"TCH", "NONE":"—"
};
let TS = [
  {n:0,type:"CCCH+SDCCH4"},{n:1,type:"SDCCH8"},{n:2,type:"TCH/F"},{n:3,type:"TCH/F"},
  {n:4,type:"TCH/F"},{n:5,type:"TCH/F"},{n:6,type:"TCH/F"},{n:7,type:"TCH/F"}
];
function drawTS(){
  const box=document.getElementById('ts'); box.innerHTML='';
  TS.forEach(t=>{
    const d=document.createElement('div'); d.className='ts'; d.dataset.n=t.n;
    if((t.type||'').indexOf('CCCH')>=0||(t.type||'').indexOf('BCCH')>=0) d.classList.add('bcch');
    d.innerHTML='<div class="n">TS'+t.n+'</div><div class="k">'+(LABEL[t.type]||t.type||'—')+'</div>';
    box.appendChild(d);
  });
}
// ── LA RANGEE « BANC » ───────────────────────────────────────────────────────
// Ordre fixe : on lit toujours les pastilles au meme endroit.
const CORE=["HLR","MSC","BSC","STP","MGW","BTS","SIP","SMSC","PBX"];
const RADIO=["TRX","MOBILE","TRXCON","QEMU","GAPK"];
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function dots(names,etat){
  return names.map(n=>{const v=etat&&etat[n];
    return '<span class="d '+(v===undefined?'':(v?'ok':'ko'))+'">'+(v===undefined?'○':'●')+'</span>'+esc(n);
  }).join(' ');
}
function duree(s){
  s=Math.max(0,s|0); if(s<60) return s+' s';
  const m=Math.floor(s/60)%60, h=Math.floor(s/3600);
  return h?h+' h '+String(m).padStart(2,'0'):m+' min';
}
function drawLive(state){
  const box=document.getElementById('live'); if(!box) return;
  if(!state || !state.bsc){
    box.innerHTML='<div class="grp warn"><span class="lab">BANC</span> à l\'arrêt — <b>./start-direct.sh</b> ou le bouton <b>run standalone</b></div>';
    return;
  }
  const s=state.subs||{}; const calls=state.calls|0;
  let h='';
  h+='<div class="grp"><span class="lab">CŒUR</span>'+dots(CORE,state.core)+'</div>';
  h+='<div class="grp"><span class="lab">RADIO</span>'+dots(RADIO,state.radio)+(state.phy?' <b>· '+esc(state.phy)+'</b>':'')+'</div>';
  h+='<div class="grp"><span class="lab">ABONNÉS</span><b>'+(s.total===undefined?'—':s.total)+'</b>'
     +(s.attached!==undefined?' · <span class="d ok">●</span> '+s.attached+' rattaché'+(s.attached>1?'s':''):'')+'</div>';
  h+='<div class="grp'+(calls?' call':'')+'"><span class="lab">APPELS</span><b>'+calls+'</b>'+(calls?' TCH en voix':'')+'</div>';
  if(state.up) h+='<div class="grp"><span class="lab">DEBOUT</span><b>'+duree(state.up)+'</b></div>';
  box.innerHTML=h;
}
// osmoUpdate({ts:[{n,type,active,voice}], bsc:true, arfcn:"...", core:{}, radio:{}, subs:{}, calls:n, up:s})
// - appele par osmo-topzone.py
window.osmoUpdate=function(state){
  try{
    if(state.ts && state.ts.length){ TS=state.ts; drawTS(); }
    document.getElementById('noconf').hidden = !!state.bsc;
    if(state.arfcn) document.getElementById('arfcn').textContent=state.arfcn;
    if(state.imsi) document.getElementById('imsi').textContent=state.imsi;
    if(state.a5) document.getElementById('a5tag').innerHTML='A5/'+state.a5+' <b>✓</b>';
    (state.ts||[]).forEach(t=>{
      const el=document.querySelector('.ts[data-n="'+t.n+'"]'); if(!el) return;
      // .on = ce timeslot porte des bursts (voix comprise) : c est le SEUL
      // clignotement de la carte depuis que le chronogramme est parti.
      el.classList.toggle('on', !!t.active || !!t.voice);
    });
    drawLive(state);
  }catch(e){}
};
// fondu : osmo-topzone.py bascule .faded pour laisser place a une appli
window.osmoFade=function(on){document.getElementById('card').classList.toggle('faded',!!on);};
drawTS(); drawLive(null);
// demo si personne ne pousse d etat (osmo-topzone absent) : un timeslot au hasard
let demo=setInterval(()=>{ if(window.__osmoLive) return clearInterval(demo);
  TS.forEach(t=>{const el=document.querySelector('.ts[data-n="'+t.n+'"]');
    if(el) el.classList.toggle('on', (t.type||'').indexOf('TCH')>=0 && Math.random()<0.25);});
},700);
</script>
</body></html>
