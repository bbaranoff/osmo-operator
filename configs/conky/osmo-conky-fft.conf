-- =============================================================================
--  osmo-conky-fft.conf - le spectre I/Q du mobile (montant) en bas a droite
-- =============================================================================
--  Seconde instance Conky, lancee avec osmo-conky.conf par l autostart
--  osmo-conky.desktop. Les images viennent de tools/osmo-fft-snap.py
--  (osmo-fft-snap.service) : /run/osmo-fft/ms.png (376x300), refaite chaque
--  seconde depuis /psd du dashboard - le meme spectre que l onglet FFT
--  (vue fft1) du navigateur. Meme largeur (400) et meme habillage que le
--  tableau de bord.
--  [2026-09-04] A GAUCHE DU TABLEAU DE BORD, ALIGNE EN HAUT. L ancrage en bas
--  a droite ne tenait qu en 1080 lignes : en 1280x800 (VM, ecran de portable)
--  la fenetre remontait sous le tableau de bord et les deux se chevauchaient -
--  titre du spectre sur « Radio / MS », image noyee sous les abonnes. Le
--  tableau fait 426 px de large (400 + 2 x 12 de marge) a 24 px du bord :
--  gap_x = 24 + 426 + 12 pose ce cadre juste a sa gauche, meme haut, quelle
--  que soit la hauteur de l ecran.
conky.config = {
    alignment = 'top_right',
    gap_x = 462, gap_y = 40,
    minimum_width = 400, maximum_width = 400,
    minimum_height = 350,
    update_interval = 1.0,
    total_run_times = 0,
    background = false,
    double_buffer = true,
    no_buffers = true,
    imlib_cache_size = 0,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = '0d1117',
    own_window_class = 'Conky',
    own_window_title = 'conky-fft (osmo-egprs)',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 12, border_outer_margin = 0,
    draw_borders = false, draw_shades = false, draw_outline = false,
    use_xft = true, font = 'DejaVu Sans Mono:size=9', xftalpha = 0.95,
    override_utf8_locale = true,
    default_color = 'e6edf3',
    color1 = '58a6ff',
    color2 = '3fb950',
    color3 = 'f85149',
};

-- ${image -n} : pas de cache imlib, le fichier est relu a chaque cycle.
-- Les ${voffset} reservent la hauteur des images dans la fenetre.
conky.text = [[
${font DejaVu Sans Mono:bold:size=11}${color1}Spectre I/Q du mobile${color}${font}${alignr}${color2}live${color}  ${color3}${if_existing /run/osmo-fft/ms.png}${else}snap arrete${endif}${color}
${image /run/osmo-fft/ms.png -p 12,34 -s 376x300 -n}${voffset 302}
${color1}dashboard${color} http://127.0.0.1:8080  ·  onglet FFT
]]
