-- =============================================================================
--  osmo-conky-fft.conf - les deux spectres I/Q (MS, BTS) en bas a droite
-- =============================================================================
--  Seconde instance Conky, lancee avec osmo-conky.conf par l autostart
--  osmo-conky.desktop. Les images viennent de tools/osmo-fft-snap.py
--  (osmo-fft-snap.service) : /run/osmo-fft/ms.png et bts.png, refaites chaque
--  seconde depuis /psd du dashboard - les memes spectres que l onglet FFT
--  (vue fft1) du navigateur. Meme largeur (400) et meme habillage que le
--  tableau de bord au-dessus ; ancre en bas a droite, il ne le chevauche pas
--  en 1920x1080 (le tableau finit vers y=660, celui-ci commence vers y=690).
conky.config = {
    alignment = 'bottom_right',
    gap_x = 24, gap_y = 40,
    minimum_width = 400, maximum_width = 400,
    minimum_height = 350,
    update_interval = 1.0,
    total_run_times = 0,
    background = false,
    double_buffer = true,
    no_buffers = true,
    imlib_cache_size = 0,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = '0d1117',
    own_window_class = 'Conky',
    own_window_title = 'conky-fft (osmo-egprs)',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    border_inner_margin = 12, border_outer_margin = 0,
    draw_borders = false, draw_shades = false, draw_outline = false,
    use_xft = true, font = 'DejaVu Sans Mono:size=9', xftalpha = 0.95,
    override_utf8_locale = true,
    default_color = 'e6edf3',
    color1 = '58a6ff',
    color2 = '3fb950',
    color3 = 'f85149',
};

-- ${image -n} : pas de cache imlib, le fichier est relu a chaque cycle.
-- Les ${voffset} reservent la hauteur des images dans la fenetre.
conky.text = [[
${font DejaVu Sans Mono:bold:size=11}${color1}Spectres I/Q${color}${font}${alignr}${color2}live${color}  ${color3}${if_existing /run/osmo-fft/ms.png}${else}snap arrete${endif}${color}
${image /run/osmo-fft/ms.png -p 12,34 -s 376x150 -n}${voffset 152}
${image /run/osmo-fft/bts.png -p 12,192 -s 376x150 -n}${voffset 150}
${color1}dashboard${color} http://127.0.0.1:8080  ·  onglet FFT
]]
