# osmo-operator: /opt/log, the one flat directory of all our logs. Writable by
# every account (the session account's tools log there too), like /tmp. Once
# /home is open it is a directory of the encrypted volume (unlock-home); it is
# never written to the system disk (osmo-racine-live). /var/log/osmocom, where
# the Osmocom daemons write, is a link to it.
d /opt/log 1777 root root -
L /var/log/osmocom - - - - /opt/log
