# /etc/asound.conf — Osmocom GSM audio via PulseAudio
#
# gsm_out : osmo-gapk playback → sink PulseAudio "gsm_audio"
# gsm_in  : osmo-gapk capture  → moniteur de "gsm_mic" (silence)
#
# [2026-08-08] gsm_in n'avait PAS de `device` : il retombait sur la source par
# défaut, qui est gsm_audio.monitor — la sortie que les mobiles venaient
# d'écrire. Chaque mobile s'entendait donc lui-même et entendait l'autre :
# boucle fermée par construction (mesuré : RMS ×11 en 10 s sur un appel de 13 s,
# crête 17728). En pointant la capture sur un sink que personne n'alimente, la
# boucle s'ouvre sans changer quoi que ce soit côté mobiles.

pcm.gsm_out {
    # [2026-08-10] NE PAS remettre period_size / buffer_size dans un bloc
    # `slave` : ALSA les REJETTE — « snd_pcm_slave_conf: Unknown field
    # period_size » — et le peripherique ne s'ouvre plus (plus aucun sink-input
    # sur gsm_audio). Essai fait et annule le 10/08. La geometrie du tampon se
    # negocie cote APPLICATION (gapk, snd_pcm_set_params dans pq_alsa), pas ici.
    #
    # CONSTAT QUI RESTE A EXPLIQUER : sur un appel muet, le flux de lecture du
    # mobile tourne a vide -- 6 300 ecritures/s sur le tube de reveil du greffon
    # ALSA-PulseAudio (fd 17), `Buffer Latency = 0 us`, crete 0, et AUCUNE
    # erreur (ni « execution aborted » de la file gapk, ni message ALSA).
    # L'autre mobile, au repos, fait 6 ecritures/s.
    type pulse
    device gsm_audio
}

ctl.gsm_out {
    type pulse
}

pcm.gsm_in {
    type pulse
    device gsm_mic.monitor
}

ctl.gsm_in {
    type pulse
}

pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
