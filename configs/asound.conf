# asound.conf - ALSA devices for Osmocom GSM audio (mobile/osmo-gapk) via
# PulseAudio. Installed as /etc/asound.conf.
#
# gsm_out : osmo-gapk playback -> PulseAudio sink "gsm_audio"
# gsm_in  : osmo-gapk capture  -> monitor of "gsm_mic" (silence)
#
# gsm_in must point at a sink nobody feeds: capturing the default source
# (gsm_audio.monitor) loops the mobiles' own output back into their uplink.

pcm.gsm_out {
    # Do not add period_size / buffer_size in a `slave` block: ALSA rejects
    # them ("snd_pcm_slave_conf: Unknown field period_size") and the device
    # no longer opens. Buffer geometry is negotiated by the application
    # (gapk, snd_pcm_set_params).
    #
    # Known limitation: on a silent call the mobile's playback loop spins
    # (~6300 writes/s on the ALSA-PulseAudio plugin wake-up pipe, peak 0,
    # no error reported). Cause not identified.
    type pulse
    device gsm_audio
}

ctl.gsm_out {
    type pulse
}

pcm.gsm_in {
    type pulse
    device gsm_mic.monitor
}

ctl.gsm_in {
    type pulse
}

pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
