!
! osmo-sip-connector.cfg - MNCC <-> SIP bridge between OsmoMSC and Asterisk.
! Template: __SIP_REMOTE_IP__ is substituted by apply_config_templates()
! (generate_configs.sh); it defaults to 127.0.0.1 and can be overridden with
! the SIP_REMOTE_IP_OVERRIDE environment variable.
!
log file /var/log/osmocom/osmo-sip-connector.log
 logging level sip info
 logging level mncc info
 logging color 1
 logging timestamp 1
 logging filter all 1
 logging print category 1
 logging print level 1
!
mncc
  socket-path /tmp/msc_mncc
sip
  local 127.0.0.1 5061
  ! The SIP leg is local in both topologies (container and ISO): Asterisk
  ! listens on 0.0.0.0:5060 and only identifies this leg on loopback
  ! (pjsip.conf [gsm_msc-identify] match=127.0.0.1, contact sip:127.0.0.1:5061).
  ! The inter-operator backbone address must NOT be used here.
  remote __SIP_REMOTE_IP__ 5060
