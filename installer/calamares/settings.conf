# =============================================================================
#  settings.conf - Calamares, the installer of the osmo-operator ISO
# =============================================================================
#  Calamares rather than Ubiquity: Ubiquity reads the live system state
#  through casper, while this ISO boots with Debian's live-boot (build-iso.sh
#  installs live-boot and live-boot-initramfs-tools, not casper), so Ubiquity
#  would find neither the squashfs nor the medium mount point. Calamares is
#  simply TOLD where the squashfs is (modules/unpackfs.conf).
#
#  The MODULE ORDER MATTERS. "exec" runs top to bottom and each step assumes
#  the previous one: partition creates the filesystems, mount mounts them,
#  unpackfs extracts the squashfs into them, and everything after (machineid,
#  fstab, locale, users, grub) writes INTO that mounted target. A module
#  placed before unpackfs writes into an empty directory that is then
#  overwritten.
# -----------------------------------------------------------------------------
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

# A named INSTANCE of the shellprocess module: it carries our own guarantees
# (root by default, osmocom second) and runs after grub, inside the target.
instances:
- id:     osmo
  module: shellprocess
  config: shellprocess-osmo.conf
# NVIDIA driver: the choice page, then the conditional installation.
- id:     nvidia
  module: packagechooser
  config: packagechooser-nvidia.conf
- id:     nvidia
  module: contextualprocess
  config: contextualprocess-nvidia.conf
# Ubuntu mirror of the installed system: the choice page (measured by
# osmo-install at startup, fastest one as default), then the write.
- id:     mirror
  module: packagechooser
  config: packagechooser-mirror.conf
- id:     mirror
  module: contextualprocess
  config: contextualprocess-mirror.conf
# Installs grub2-common into the target BEFORE bootloader, otherwise
# grub-install does not exist there and the module fails with "error code 127".
# The .deb packages arrive through the /run/osmo-debs bind of mount.conf.
- id:     grub
  module: shellprocess
  config: shellprocess-grub.conf
# addition.sh supplements: check boxes, then the origin of the operator image;
# the osmosupplements job writes them into the target for the first boot.
- id:     supplements
  module: packagechooser
  config: packagechooser-supplements.conf
- id:     image
  module: packagechooser
  config: packagechooser-image.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@nvidia
  - packagechooser@mirror
  - packagechooser@supplements
  - packagechooser@image
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  # The chosen mirror, BEFORE anything that could run apt in the target.
  - contextualprocess@mirror
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  # LUKS (see partition.conf): only /home is encrypted, the root carries
  # noEncrypt. luksbootkeyfile and initramfscfg therefore find no encrypted
  # root and do nothing; initramfs regenerates the initrd, which
  # shellprocess@osmo does again anyway. They stay for a MANUAL partitioning
  # where the operator encrypts the root himself. The crypttab line of /home
  # is handled by crypthome-postinstall (shellprocess@osmo): "noauto",
  # unlock-home asks for the passphrase.
  - luksbootkeyfile
  - initramfscfg
  - initramfs
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@grub
  - grubcfg
  - bootloader
  - shellprocess@osmo
  - osmosupplements
  - contextualprocess@nvidia
  - umount
- show:
  - finished

branding: osmo

# Ask for confirmation before writing: this installer runs on a bench, next
# to disks that hold captures and HLR databases.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true

# These two keys are REQUIRED by calamares: without them it logs
# "Required settings.conf key ... is missing" at every start and falls back
# to an unwritten default.
#   quit-at-end: false                -> the "finished" screen stays, the
#                                        operator reads the result before closing.
#   hide-back-and-next-during-exec    -> during the copy (exec), Back/Next
#                                        are hidden: nothing to navigate
#                                        while the installation runs.
quit-at-end: false
hide-back-and-next-during-exec: true
