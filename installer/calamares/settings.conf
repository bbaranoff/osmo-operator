# =============================================================================
#  Calamares - l'installeur de l'ISO osmo_egprs
# =============================================================================
#  POURQUOI CALAMARES ET PAS UBIQUITY. Ubiquity est l'installeur d'Ubuntu, il
#  est dans jammy (22.04.15) et il aurait l'air du bon choix. Il ne l'est pas :
#  il lit l'etat du systeme live par CASPER, l'initramfs d'Ubuntu. Cette ISO
#  demarre avec LIVE-BOOT, celui de Debian (build-iso.sh installe live-boot et
#  live-boot-initramfs-tools, pas casper). Ubiquity ne trouverait donc ni le
#  squashfs, ni le point de montage du medium, et echouerait avant la premiere
#  question. Calamares, lui, ne suppose rien : on lui DIT ou est le squashfs
#  (modules/unpackfs.conf). C'est l'installeur des distributions qui ne sont
#  pas Ubuntu tout en etant construites sur Debian - exactement notre cas.
#
#  L'ORDRE DES MODULES N'EST PAS DECORATIF. "exec" s'execute de haut en bas et
#  chaque etape suppose la precedente : partition cree les systemes de fichiers,
#  mount les monte, unpackfs y deverse le squashfs, et TOUT ce qui suit
#  (machineid, fstab, locale, users, grub) ecrit DANS cette cible montee. Placer
#  users avant unpackfs, c'est ecrire dans un repertoire vide qui sera ensuite
#  recouvert - le compte disparait sans un message.
# -----------------------------------------------------------------------------
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

# Une INSTANCE nommee du module shellprocess : elle porte nos garanties propres
# (root par defaut, osmocom en second) et tourne apres grub, dans la cible.
instances:
- id:     osmo
  module: shellprocess
  config: shellprocess-osmo.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - shellprocess@osmo
  - umount
- show:
  - finished

branding: osmo

# On demande confirmation avant d'ecrire : cet installeur tourne sur un banc, a
# cote de disques qui portent des captures et des bases HLR.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true

# Ces deux cles sont REQUISES par calamares : sans elles, il journalise
# "Required settings.conf key ... is missing" a chaque lancement et retombe sur
# un defaut non ecrit. On les pose explicitement.
#   quit-at-end: false                -> l ecran "termine" reste, l operateur
#                                        lit le resultat avant de fermer.
#   hide-back-and-next-during-exec    -> pendant la copie (exec), on masque
#                                        Precedent/Suivant : rien a naviguer
#                                        tant que l installation tourne.
quit-at-end: false
hide-back-and-next-during-exec: true
