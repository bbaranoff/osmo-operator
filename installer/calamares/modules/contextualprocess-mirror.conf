# =============================================================================
#  contextualprocess@mirror - ecrit le miroir choisi dans la cible
# =============================================================================
#  Lit la cle globalstorage packagechooser_mirror (page packagechooser@mirror).
#  Tourne juste apres unpackfs, dans la cible (dontChroot: false) : tout apt
#  qui suit (le pilote NVIDIA, une mise a jour au premier boot) lit deja le bon
#  miroir. "keep" ne touche a rien. Les autres cles sont ecrites par
#  osmo-install a chaque lancement (m1, m2... dans l ordre des mesures) : un
#  sed sur /etc/apt/sources.list, et sur ubuntu.sources (deb822) s il existe.
---
dontChroot: false
timeout: 60
packagechooser_mirror:
    "keep":
        - "-/bin/true"
