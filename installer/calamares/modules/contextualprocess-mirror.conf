# =============================================================================
#  contextualprocess-mirror.conf - contextualprocess@mirror: writes the chosen
#  apt mirror into the target
# =============================================================================
#  Reads the globalstorage key packagechooser_mirror (page packagechooser@mirror).
#  Runs right after unpackfs, inside the target (dontChroot: false): every apt
#  that follows (NVIDIA driver, first-boot update) already reads the right
#  mirror. "keep" changes nothing. The other keys (m1, m2... in measurement
#  order) are generated by the osmo-install launcher at each start: a sed on
#  /etc/apt/sources.list, and on ubuntu.sources (deb822) if present.
---
dontChroot: false
timeout: 60
packagechooser_mirror:
    "keep":
        - "-/bin/true"
