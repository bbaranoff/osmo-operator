# netinstall-options.conf - the « Options » page of the installer: the
# SUPPLEMENTS and the options, EACH ONE WITH ITS OWN CHECKBOX (any number of
# them, none by default) - not one choice among several.
#
# netinstall is used for its tree of checkboxes only: the « packages » below
# are not packages, they are the names the job osmo-options (modules/
# osmo-options/main.py, run at the end of the installation) reads back from
# the page and turns into /etc/osmo-supplements - the addition.sh flags that
# osmo-supplements.service runs at the first boot, once the network is up -
# and, for the kind of machine (first box), the secured bench set up in the
# target. Nothing is
# downloaded by the installer itself (the « packages » module is not in the
# sequence): the page works without network.
---
groupsUrl: local
required: false
label:
    sidebar: "Options"
    sidebar[fr]: "Options"
    title: "Supplements and options - tick each one you want"
    title[fr]: "Supplements et options - cocher chacun de ceux voulus"
groups:
    # THE KIND OF MACHINE. One box, ticked by default: the secured bench - what
    # this project is. Unticked: an ordinary Ubuntu (the disk written to
    # directly, nothing wiped, no black box, no fingerprint, no TPM). The
    # secured bench REQUIRES a TPM 2.0: osmo-install rewrites this page at
    # every launch and, without one, shows the box UNTICKED AND GREYED OUT
    # (immutable) with what to do; the osmo-options job checks again.
    - name: "Poste securise - TPM 2.0 EXIGE (decocher : Ubuntu ordinaire)"
      description: "LE CONCEPT. Le disque systeme reste en lecture seule et toute la session tourne en memoire : a l extinction, la console demande la phrase de /home - tapee, la session est ecrite sur le disque ; sinon tout est efface. /home est chiffre (cocher « Chiffrer » a l etape des partitions) : sans sa phrase au demarrage, on n obtient qu un root invite, sans rien de personnel. Une boite noire garde le journal de chaque session sous sa propre phrase. L empreinte du disque est signee et verifiee a chaque demarrage. LE TPM : il ancre cette signature et, au demarrage, n affiche TA phrase secrete (apres ton PIN) que si la machine n a pas ete modifiee - phrase et PIN sont demandes au PREMIER demarrage, apres la phrase de /home. DECOCHE : une Ubuntu ordinaire, le disque ecrit directement, rien d efface, ni boite noire ni TPM."
      selected: true
      packages: [ osmo-option-securise ]
    - name: "Poste securise : code sur le telephone plutot que phrase secrete + PIN"
      description: "Le TPM calcule un code a 6 chiffres (TOTP) a comparer a une appli du telephone, au lieu d afficher une phrase. Plus sur (le code change toutes les 30 s), mais demande un second appareil. Se pose apres le premier demarrage : sudo osmo-tpm poser. Sans effet si le poste securise est decoche."
      selected: false
      packages: [ osmo-option-tpm ]
    - name: "Multi-operateur (Docker, SS7)"
      description: "Le moteur de conteneurs, l image operateur telechargee, operateurs 2 et 3 et l inter-STP. ~11 Go."
      selected: false
      packages: [ osmo-option-multi ]
    - name: "OpenCL (calcul GPU)"
      description: "La pile OpenCL pour le calcul sur carte graphique."
      selected: false
      packages: [ osmo-option-opencl ]
    - name: "Claude Code"
      description: "L assistant en ligne de commande."
      selected: false
      packages: [ osmo-option-claude ]
    - name: "Jeux et medias"
      description: "Doom, Quake III, Kodi, YouTube + uBlock, Wireshark root, Linphone."
      selected: false
      packages: [ osmo-option-extras ]
    - name: "Chaine arm-elf-gcc 4.5.2 (gnuarm)"
      description: "L ancienne chaine de compilation des firmwares, copiee de l image osmocom-bb-trx."
      selected: false
      packages: [ osmo-option-gnuarm ]
    - name: "FreeCalypso Magnetite (C139)"
      description: "Wine + TI TMS470, sources, correctifs du banc, image a flasher."
      selected: false
      packages: [ osmo-option-magnetite ]
    - name: "osmocom-bb TRX"
      description: "L image Docker publiee et le firmware trx (TX) compile avec gnuarm."
      selected: false
      packages: [ osmo-option-trx ]
    - name: "Firmwares Calypso du banc"
      description: "osmocom-bb recompile avec gnuarm : layer1 GPRS, rssi."
      selected: false
      packages: [ osmo-option-calypso-fw ]
    - name: "Fernvale (MT6260)"
      description: "fernly, fernvale-nuttx, layer1 MTK."
      selected: false
      packages: [ osmo-option-fernvale ]
    - name: "SIMCom"
      description: "Documentation et SDK SIMCom. ~3,4 Go."
      selected: false
      packages: [ osmo-option-simcom ]
