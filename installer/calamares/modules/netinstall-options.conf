# netinstall-options.conf - the « Options » page of the installer: the
# SUPPLEMENTS and the options, EACH ONE WITH ITS OWN CHECKBOX (any number of
# them, none by default) - not one choice among several.
#
# netinstall is used for its tree of checkboxes only: the « packages » below
# are not packages, they are the names the job osmo-options (modules/
# osmo-options/main.py, run at the end of the installation) reads back from
# the page and turns into /etc/osmo-supplements - the addition.sh flags that
# osmo-supplements.service runs at the first boot, once the network is up -
# and, for the TPM options, lines of /etc/osmo-operator/options. Nothing is
# downloaded by the installer itself (the « packages » module is not in the
# sequence): the page works without network.
---
groupsUrl: local
required: false
label:
    sidebar: "Options"
    sidebar[fr]: "Options"
    title: "Supplements and options - tick each one you want"
    title[fr]: "Supplements et options - cocher chacun de ceux voulus"
groups:
    - name: "Multi-operateur (Docker, SS7)"
      description: "Le moteur de conteneurs, l image operateur telechargee, operateurs 2 et 3 et l inter-STP. ~11 Go."
      selected: false
      packages: [ osmo-option-multi ]
    - name: "OpenCL (calcul GPU)"
      description: "La pile OpenCL pour le calcul sur carte graphique."
      selected: false
      packages: [ osmo-option-opencl ]
    - name: "Claude Code"
      description: "L assistant en ligne de commande."
      selected: false
      packages: [ osmo-option-claude ]
    - name: "Jeux et medias"
      description: "Doom, Quake III, Kodi, YouTube + uBlock, Wireshark root, Linphone."
      selected: false
      packages: [ osmo-option-extras ]
    - name: "Chaine arm-elf-gcc 4.5.2 (gnuarm)"
      description: "L ancienne chaine de compilation des firmwares, copiee de l image osmocom-bb-trx."
      selected: false
      packages: [ osmo-option-gnuarm ]
    - name: "FreeCalypso Magnetite (C139)"
      description: "Wine + TI TMS470, sources, correctifs du banc, image a flasher."
      selected: false
      packages: [ osmo-option-magnetite ]
    - name: "osmocom-bb TRX"
      description: "L image Docker publiee et le firmware trx (TX) compile avec gnuarm."
      selected: false
      packages: [ osmo-option-trx ]
    - name: "Firmwares Calypso du banc"
      description: "osmocom-bb recompile avec gnuarm : layer1 GPRS, rssi."
      selected: false
      packages: [ osmo-option-calypso-fw ]
    - name: "Fernvale (MT6260)"
      description: "fernly, fernvale-nuttx, layer1 MTK."
      selected: false
      packages: [ osmo-option-fernvale ]
    - name: "SIMCom"
      description: "Documentation et SDK SIMCom. ~3,4 Go."
      selected: false
      packages: [ osmo-option-simcom ]
    # THE TPM, ALL OF IT OPTIONAL. Nothing is posed by the installer (each one
    # needs the /home passphrase, typed on the installed machine): the choice
    # is kept in /etc/osmo-operator/options and « osmo-tpm etat » says what is
    # still to do. The two measured boots exclude each other (the last one
    # posed wins); either can be posed later, ticked here or not.
    - name: "TPM : ancre de la signature (TPM 2.0)"
      description: "La cle qui signe l empreinte du disque est epinglee dans le TPM : la remplacer sans la phrase de /home se voit au demarrage. Se pose apres le premier demarrage : sudo osmo-empreinte ancrer."
      selected: false
      packages: [ osmo-option-tpm-ancre ]
    - name: "TPM : demarrage mesure, code sur le telephone (TPM 2.0)"
      description: "Un code a 6 chiffres calcule par le TPM seulement si micrologiciel, GRUB, noyau, initramfs et disque systeme sont intacts, a comparer a ton telephone (appli TOTP) avant de taper la phrase de /home. Le plus sur des deux. Se pose apres le premier demarrage : sudo osmo-tpm poser."
      selected: false
      packages: [ osmo-option-tpm ]
    - name: "TPM : demarrage mesure, phrase secrete et PIN, sans telephone (TPM 2.0)"
      description: "Le TPM affiche une phrase a toi, apres un PIN, seulement si la machine est intacte. Aucun autre appareil ; moins sur que le code du telephone (une phrase ne change pas). Se pose apres le premier demarrage : sudo osmo-tpm poser --secret."
      selected: false
      packages: [ osmo-option-tpm-secret ]
