# =============================================================================
#  grubcfg.conf - /etc/default/grub du systeme installe
# =============================================================================
#  overwrite: false - on complete le fichier de la cible au lieu de le
#  remplacer : les valeurs que dpkg y a mises (GRUB_CMDLINE_LINUX_DEFAULT du
#  paquet grub-common) restent.
---
overwrite: false
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DISABLE_OS_PROBER: false
    # ── LUKS : sans cette ligne, une installation chiffree NE DEMARRE PAS ──
    # [2026-09-04] partition.conf ne declare qu UNE partition (racine, 100%) :
    # quand l operateur coche "Chiffrer le systeme", /boot part DANS le
    # conteneur LUKS avec le reste - il n y a pas de /boot en clair. GRUB doit
    # donc ouvrir le volume lui-meme pour lire son noyau, et il ne compile
    # cryptomount/cryptodisk dans son image que si grub-mkconfig voit ce "y".
    # Sans lui : "error: disk `cryptouuid/...' not found" puis l invite grub>.
    # GRUB 2.12 (noble) sait ouvrir le LUKS2 argon2id de luksGeneration.
    # Sur une installation NON chiffree la cle ne change rien : grub-mkconfig
    # ne trouve aucun volume chiffre sur le chemin d amorcage et n emet rien.
    GRUB_ENABLE_CRYPTODISK: "y"
