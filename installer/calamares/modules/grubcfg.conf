# =============================================================================
#  grubcfg.conf - /etc/default/grub of the installed system
# =============================================================================
#  overwrite: false - the target file is completed instead of replaced: the
#  values dpkg put there (GRUB_CMDLINE_LINUX_DEFAULT from grub-common) remain.
---
overwrite: false
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DISABLE_OS_PROBER: false
    # LUKS: without this key an encrypted installation DOES NOT BOOT.
    # partition.conf declares a single partition (root, 100%): with "Encrypt
    # system" checked, /boot lives INSIDE the LUKS container, there is no
    # cleartext /boot. GRUB must open the volume itself to read its kernel,
    # and grub-mkconfig only builds cryptomount/cryptodisk into the image when
    # it sees this "y" (otherwise: "error: disk `cryptouuid/...' not found"
    # then the grub> prompt). GRUB 2.12 (noble) opens LUKS2 argon2id.
    # On an unencrypted installation the key has no effect.
    GRUB_ENABLE_CRYPTODISK: "y"
