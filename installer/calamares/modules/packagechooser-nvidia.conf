# =============================================================================
#  packagechooser@nvidia - le pilote NVIDIA dans les choix d installation
# =============================================================================
#  [2026-09-03] Une page "Pilotes graphiques" avec deux entrees : aucun pilote
#  supplementaire (defaut) ou le pilote proprietaire NVIDIA. Calamares ne sait
#  pas griser une entree selon le materiel ; c est osmo-install (le lanceur du
#  live, build-iso.sh) qui REECRIT ce fichier juste avant de lancer Calamares :
#    - carte NVIDIA vue par lspci  -> l entree NVIDIA est proposee, avec le nom
#                                     de la carte, et pre-selectionnee ;
#    - pas de carte                 -> l entree reste, mais marquee "aucune carte
#                                     detectee", et l installation ne fera rien.
#  L installation elle-meme est dans contextualprocess-nvidia.conf : elle ne
#  part que si l entree est choisie ET qu une carte est la (lspci dans la cible),
#  et elle a besoin du reseau (les paquets viennent des depots Ubuntu).
#
#  [2026-09-04] LA VERSION EST FIGEE : nvidia-driver-610. Plus d arbitrage par
#  ubuntu-drivers - voir contextualprocess-nvidia.conf.
---
mode: optional
method: legacy
labels:
    step: "Pilotes graphiques"
    step[fr]: "Pilotes graphiques"
default: none
items:
    - id: none
      name: "Aucun pilote supplementaire"
      description: "Le pilote libre (nouveau) du noyau, comme sur la cle live."
    - id: nvidia
      name: "Pilote NVIDIA 610 (proprietaire)"
      description: "Installe nvidia-driver-610 depuis les depots Ubuntu (reseau requis). @@NVIDIA_STATE@@"
