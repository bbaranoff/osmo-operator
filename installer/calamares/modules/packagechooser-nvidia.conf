# =============================================================================
#  packagechooser@nvidia - optional NVIDIA driver page
# =============================================================================
#  Two entries: no extra driver (default) or the proprietary NVIDIA driver,
#  pinned to nvidia-driver-610 (no ubuntu-drivers selection).
#  Calamares cannot grey out an entry based on hardware, so osmo-install (the
#  live launcher, build-iso.sh) REWRITES this file just before starting
#  Calamares:
#    - NVIDIA card seen by lspci -> the NVIDIA entry shows the card name and is
#                                   pre-selected;
#    - no card                   -> the entry stays but is marked "no card
#                                   detected" and installs nothing.
#  The installation itself is in contextualprocess-nvidia.conf: it runs only
#  if the entry is selected AND a card is present (lspci in the target), and it
#  needs network access (packages come from the Ubuntu archive).
---
mode: optional
method: legacy
labels:
    step: "Pilotes graphiques"
    step[fr]: "Pilotes graphiques"
default: none
items:
    - id: none
      name: "Aucun pilote supplementaire"
      description: "Le pilote libre (nouveau) du noyau, comme sur la cle live."
    - id: nvidia
      name: "Pilote NVIDIA 610 (proprietaire)"
      description: "Installe nvidia-driver-610 depuis les depots Ubuntu (reseau requis). @@NVIDIA_STATE@@"
