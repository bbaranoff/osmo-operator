---
# packagechooser-image.conf - origin of the operator Docker image, like the
# second window (radio buttons) of addition.sh. No effect unless
# "Docker et multi-operateur SS7" is checked on the supplements page.
mode: required
method: legacy
labels:
    step: "Image operateur"
    step[fr]: "Image operateur"
default: ghcr
items:
    - id: ghcr
      name: "Le depot (GHCR)"
      description: "ghcr.io/bbaranoff/osmo-operator/osmocom-nitb:latest, publiee par la CI a chaque push. Ignore sans le supplement multi-operateur."
    - id: hub
      name: "Docker Hub"
      description: "bastienbaranoff/norf_gsm, la pile publiee a la main. Ignore sans le supplement multi-operateur."
