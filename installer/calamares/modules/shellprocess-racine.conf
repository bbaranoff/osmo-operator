# shellprocess-racine.conf - root's live system, at installation.
#
# OUTSIDE the target (dontChroot): the source - the ISO image osmo-install
# bound on /run/osmo-install-src, the live kernel and initrd of /boot - is the
# live session's. osmo-racine-copier fills the osmo-racine partition, mounted
# on ${ROOT}/var/lib/osmo-racine (partition.conf). The first GRUB menu
# (osmo-grub-esp, shellprocess-osmo.conf) boots it when nirvana's passphrase
# is not given.
---
dontChroot: true
timeout: 1800
script:
    - "-/usr/local/sbin/osmo-racine-copier ${ROOT}"
