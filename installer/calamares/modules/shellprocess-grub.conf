# =============================================================================
#  shellprocess-grub - GRUB DOIT EXISTER DANS LA CIBLE AVANT LE MODULE bootloader
# =============================================================================
#  LE SYMPTOME. L'installation va jusqu'au bout de la copie, puis :
#
#      Le chargeur de demarrage n'a pas pu etre installe. La commande
#      grub-install --target=x86_64-efi --efi-directory=/boot/efi
#      --bootloader-id=ubuntu --force a renvoye le code d'erreur 127.
#
#  127 = commande introuvable. Rien dans le message ne le dit, et le disque
#  reste partitionne, rempli, et NON AMORCABLE.
#
#  LA CAUSE. Le module bootloader tourne avec dont-chroot: false, donc DANS LE
#  SYSTEME INSTALLE. Or ce systeme sort du squashfs, et le squashfs n'avait que
#  grub-common (grub-mkconfig, grub-probe) -- PAS grub2-common, qui fournit
#  grub-install. build-iso.sh installait bien grub-efi-amd64-bin, mais sur la
#  MACHINE QUI FABRIQUE L'ISO (ISO_HOST_PKGS), pour rendre l'image amorcable :
#  deux choses differentes, et la confusion ne se voit qu'ici.
#
#  build-iso.sh pose desormais ces paquets DANS le rootfs, avec un garde-fou qui
#  refuse de produire une ISO sans eux. Ce module-ci reste utile pour deux
#  raisons : il repare les ISO deja gravees, et il rend l'installation
#  independante d'une regression du build.
#
#  D'OU VIENNENT LES .deb. De /run/osmo-debs, un bind du /var/cache/osmo-debs
#  de l'hote pose par mount.conf. On a d'abord essaye une instance
#  dontChroot: true qui copiait les fichiers : le journal montre qu'elle a
#  tourne DANS la cible malgre le reglage, n'a rien trouve, et l'erreur 127 est
#  revenue. Un bind ne se discute pas.
#
#  TOUT EST NON FATAL (prefixe "-"). Si les .deb ne sont pas la -- ISO
#  reconstruite qui n'en a plus besoin -- dpkg n'a rien a faire et
#  l'installation continue vers un module bootloader qui, lui, trouvera
#  grub-install dans le rootfs.
---
dontChroot: false
timeout: 600
script:
    # dpkg et pas apt : on installe des fichiers locaux, sans reseau ni miroir.
    # `ls` en garde : "dpkg -i /chemin/*.deb" sur un repertoire vide passerait
    # le glob non developpe a dpkg, qui sortirait en erreur.
    - "-/bin/bash -c \"ls /run/osmo-debs/*.deb >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive dpkg -i /run/osmo-debs/*.deb || true\""
    # La preuve, pas l'esperance : si grub-install manque encore, on le DIT dans
    # le journal de l'installateur, la ou quelqu'un ira lire apres l'echec.
    - "-/bin/bash -c \"command -v grub-install >/dev/null || echo 'ATTENTION: grub-install absent de la cible - le module bootloader va echouer (code 127)' >&2\""
