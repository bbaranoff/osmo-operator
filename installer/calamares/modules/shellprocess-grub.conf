# =============================================================================
#  shellprocess-grub - check that grub-install exists in the target before the
#                      bootloader module runs
# =============================================================================
#  The bootloader module runs inside the installed system (dontChroot: false),
#  so grub-install (package grub2-common) must be in the squashfs; build-iso.sh
#  installs it in the rootfs and refuses to build an ISO without it. If it is
#  missing anyway, bootloader fails with exit code 127 and the disk is left
#  unbootable.
#  This module is a single non-fatal check ("-" prefix): it logs a warning in
#  the installer log, before the bootloader module, if grub-install is missing.
---
dontChroot: false
timeout: 600
script:
    # Log a warning if grub-install is missing in the target.
    - "-/bin/bash -c \"command -v grub-install >/dev/null || echo 'ATTENTION: grub-install absent de la cible - le module bootloader va echouer (code 127)' >&2\""
