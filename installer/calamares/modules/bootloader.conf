# GRUB, en EFI comme en BIOS.
#
# efiBootloaderId : le repertoire cree sous /boot/efi/EFI/. On garde "ubuntu"
# et PAS "osmo_egprs" - ce n'est pas de la coquetterie : les binaires GRUB
# signes par Canonical (grub-efi-amd64-signed) ont /EFI/ubuntu compile comme
# prefixe. Les poser ailleurs, c'est un GRUB signe qui ne trouve pas sa
# configuration et tombe sur son invite "grub>" - le meme piege que celui
# documente dans build-iso.sh a l'etape Secure Boot, mais sur le disque cette
# fois. Le systeme installe reste ainsi amorcable Secure Boot, comme l'ISO.
---
efiBootLoader:      grub
grubInstall:        grub-install
grubMkconfig:       grub-mkconfig
grubCfg:            /boot/grub/grub.cfg
grubProbe:          grub-probe
efiBootMgr:         efibootmgr
efiBootloaderId:    ubuntu
installEFIFallback: true
