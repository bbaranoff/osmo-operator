# bootloader.conf - GRUB, in EFI as well as BIOS mode.
#
# efiBootloaderId: the directory created under /boot/efi/EFI/. Keep "ubuntu",
# NOT "osmo-operator": the GRUB binaries signed by Canonical
# (grub-efi-amd64-signed) have /EFI/ubuntu compiled in as prefix. Installed
# anywhere else, the signed GRUB does not find its configuration and drops to
# the "grub>" prompt. The installed system thus stays Secure Boot bootable,
# like the ISO.
---
efiBootLoader:      grub
grubInstall:        grub-install
grubMkconfig:       grub-mkconfig
grubCfg:            /boot/grub/grub.cfg
grubProbe:          grub-probe
efiBootMgr:         efibootmgr
efiBootloaderId:    ubuntu
installEFIFallback: true
