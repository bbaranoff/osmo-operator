# welcome.conf - Calamares welcome page: installation requirements
# (at least 20 GiB of disk and 2 GiB of RAM; disk space and root are mandatory).
---
showSupportUrl:      false
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
requirements:
    requiredStorage:  20
    requiredRam:      2
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - root
