# welcome.conf - Calamares welcome page: installation requirements
# (at least 40 GiB of disk: 30 for / + 8 for the encrypted /home + EFI, and 2 GiB of RAM; disk space and root are mandatory).
---
showSupportUrl:      false
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
requirements:
    requiredStorage:  40
    requiredRam:      2
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - root
