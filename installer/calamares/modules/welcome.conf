# welcome.conf - Calamares welcome page: installation requirements
# (at least 55 GiB of disk: 16 root system + 5 black box + 30 nirvana + EFI and 2 GiB of RAM; disk space and root are mandatory).
---
showSupportUrl:      false
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
requirements:
    requiredStorage:  55
    requiredRam:      2
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - root
