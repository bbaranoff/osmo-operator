# =============================================================================
#  shellprocess-osmo - turn the copied live system into an INSTALLED system
# =============================================================================
#  The installation settings take precedence over the live key defaults:
#    - the user is the one from the "Users" page (${USER}), with its password,
#      its autologin if ticked, and its hostname;
#    - root stays a working account: unlocked, password = the one entered
#      during installation (users.conf, setRootPassword);
#    - the live key's osmocom account is removed (unless it is the chosen name);
#    - the live key's root autologins (console, GDM) and the PAM rule change
#      that allowed them are reverted: GDM logs into ${USER}, as on Ubuntu.
#  The bench is still driven as root (sudo -i or root login): desktop
#  launchers, units and /opt/GSM are set up for ${USER}, who is a sudoer
#  (users.conf, defaultGroups).
#
#  dontChroot: false - commands run INSIDE the mounted target, not on the live
#  system (otherwise the USB key's root account would be modified).
#  Generous timeout: update-initramfs is slow on slow disks.
#  ${USER} and ${ROOT} are substituted by Calamares (shellprocess module).
---
dontChroot: false
timeout: 600
script:
    # Unlock root; its password is the one entered on the "Users" page
    # (users.conf, setRootPassword).
    - "-/usr/bin/passwd -u root"

    # ── Remove the live osmocom account ──────────────────────────────────────
    # Unless the installer chose that name: then it is the user's own account,
    # created by the users module, and is left alone.
    - "-/bin/bash -c \"[ \\\"${USER}\\\" = osmocom ] || { pkill -u osmocom 2>/dev/null; userdel -r osmocom 2>/dev/null; groupdel osmocom 2>/dev/null; rm -rf /home/osmocom; }\""

    # ── Encrypted /home: wire up what the installer produced ─────────────────
    # Must run AFTER the osmocom removal: it writes CRYPTHOME_OWNER=${USER}, the
    # session account that owns the encrypted home.
    # It encrypts nothing (Calamares did, see partition.conf: the root has
    # noEncrypt, only /home is LUKS2). It switches crypttab and fstab to "noauto"
    # so that unlock-home asks at boot without blocking it, and puts root's
    # keyring on the volume. If /home is not encrypted, it says so and does nothing.
    # At boot: "yes" opens GDM on ${USER} (persistent), "no" on root, ephemeral,
    # writing to /tmp (unlock-home, session_root). The GDM lines below are the
    # "yes" configuration, which unlock-home restores at every boot.
    - "-/usr/local/sbin/crypthome-postinstall ${USER}"

    # ── Remove the live key's root autologins ─────────────────────────────────
    # Console: tty1 and ttyS0 drop-ins installed by build-iso.sh.
    - "-/bin/bash -c \"rm -f /etc/systemd/system/getty@tty1.service.d/10-autologin-root.conf /etc/systemd/system/serial-getty@ttyS0.service.d/10-autologin-root.conf\""
    - "-/bin/bash -c \"rmdir /etc/systemd/system/getty@tty1.service.d /etc/systemd/system/serial-getty@ttyS0.service.d 2>/dev/null || true\""
    # GDM: the displaymanager module (just before, in settings.conf) wrote the
    # ${USER} autologin if ticked. A leftover AutomaticLogin=root line from the
    # live key is switched to the installed user.
    - "-/bin/bash -c \"[ -f /etc/gdm3/custom.conf ] && sed -i 's/^AutomaticLogin=root$/AutomaticLogin=${USER}/' /etc/gdm3/custom.conf || true\""
    # Restore Ubuntu's PAM rule 'user != root' (commented out on the live key so
    # GDM could open a root session).
    - "-/bin/bash -c \"sed -i 's/^#\\\\(auth.*pam_succeed_if.so user != root quiet_success\\\\)/\\\\1/' /etc/pam.d/gdm-password /etc/pam.d/gdm-autologin 2>/dev/null || true\""

    # ── ${USER}'s desktop: same launchers as the live key ─────────────────────
    # The home comes from /etc/skel, filled by build-iso.sh (launchers, favourites,
    # gnome-initial-setup-done). Make sure a home created before skel was read
    # (users module) has the launchers and the right owner.
    - "-/bin/bash -c \"h=\\$(getent passwd ${USER} | cut -d: -f6); [ -n \\\"\\$h\\\" ] && for d in Desktop Bureau; do [ -d /etc/skel/\\$d ] && mkdir -p \\$h/\\$d && cp -n /etc/skel/\\$d/*.desktop \\$h/\\$d/ 2>/dev/null; done; [ -n \\\"\\$h\\\" ] && chown -R ${USER}: \\$h || true\""

    # Web dashboard unit, taken from the repository shipped in the target
    # (/opt/GSM/osmo-operator), so nothing is downloaded. The TLS certificate is
    # generated at build time (Dockerfile).
    - "-/bin/bash -c \"cp -f /opt/GSM/osmo-operator/services/osmo-egprs-web.service /etc/systemd/system/ 2>/dev/null || true\""
    - "-/bin/bash -c \"mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /etc/systemd/system/osmo-egprs-web.service /etc/systemd/system/multi-user.target.wants/osmo-egprs-web.service\""

    # ── Remove the "Install" icon ──────────────────────────────────────────
    # build-iso.sh puts it on root's desktop and in /etc/skel. On an installed
    # disk it would open Calamares with the machine's own disk as a target.
    # Remove it from every desktop under both names ("Desktop" and "Bureau" both
    # exist; the session locale decides which one is shown) and from
    # /usr/share/applications (application menu). /usr/local/bin/osmo-install is
    # kept: it can install ANOTHER machine from this one with a live key plugged in.
    - "-/bin/bash -c \"rm -f /root/Desktop/osmo-install.desktop /root/Bureau/osmo-install.desktop /usr/share/applications/osmo-install.desktop /etc/skel/Desktop/osmo-install.desktop /etc/skel/Bureau/osmo-install.desktop\""
    - "-/bin/bash -c \"for h in /home/*; do rm -f \\$h/Desktop/osmo-install.desktop \\$h/Bureau/osmo-install.desktop; done\""
    # The calamares package's own entry (NoDisplay on the live key) is removed:
    # it starts /usr/bin/calamares directly, bypassing osmo-install's safeguards.
    - "-/bin/bash -c \"rm -f /usr/share/applications/calamares.desktop\""
    - "-/bin/bash -c \"update-desktop-database /usr/share/applications >/dev/null 2>&1 || true\""

    # ── Smartphone UI: ${USER}'s pmbootstrap config ───────────────────────────
    # pmbootstrap runs as the session user (it refuses root) and reads
    # ~/.config/pmbootstrap_v3.cfg. 88-lte-pmos.sh installed the template in
    # /etc/skel (pmbootstrap_v3.cfg.osmo, with @WORK@/@APORTS@); instantiate it
    # here with ${USER}'s home so the icon works immediately (osmo-pmos-build
    # would do the same on first launch). Work dir: ~/.local/var/pmbootstrap.
    - "-/bin/bash -c \"h=\\$(getent passwd ${USER} | cut -d: -f6); t=/etc/skel/.config/pmbootstrap_v3.cfg.osmo; [ -n \\\"\\$h\\\" ] && [ -f \\$t ] && [ ! -f \\$h/.config/pmbootstrap_v3.cfg ] && mkdir -p \\$h/.config && sed \\\"s#@WORK@#\\$h/.local/var/pmbootstrap#g; s#@APORTS@#\\$h/.local/var/pmbootstrap/cache_git/pmaports#g\\\" \\$t > \\$h/.config/pmbootstrap_v3.cfg && chown -R ${USER}: \\$h/.config || true\""
    - "-/bin/bash -c \"chmod -R a+rX /opt/user_interface 2>/dev/null || true\""

    # Purge live-boot: its initramfs scripts would look for a live medium at
    # every boot.
    - "-/bin/bash -c \"apt-get purge -y live-boot live-boot-initramfs-tools >/dev/null 2>&1 || true\""
    - "-/bin/bash -c \"update-initramfs -u >/dev/null 2>&1 || true\""
