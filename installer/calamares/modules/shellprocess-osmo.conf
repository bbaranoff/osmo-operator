# =============================================================================
#  Ce qui distingue un systeme INSTALLE de la cle live
# =============================================================================
#  [2026-09-03] INVERSION DE LA REGLE. Jusqu ici ce module faisait ressembler
#  le disque a la cle : session sur root, autologin root en console et dans
#  GDM, un compte osmocom au mot de passe fixe. Le disque restait FIGE au live,
#  et ce que l on tapait dans l ecran "Utilisateurs" ne comptait pour rien.
#
#  Desormais ce sont les CARACTERISTIQUES DE L INSTALLATION qui font foi :
#    - l utilisateur est celui de l ecran "Utilisateurs" (${USER}), avec son
#      mot de passe, son autologin s il l a coche, son nom de machine ;
#    - root reste un compte de travail : deverrouille, mot de passe = celui
#      demande a l installation (users.conf, setRootPassword) ;
#    - le compte osmocom de la cle DISPARAIT (sauf si c est le nom choisi) ;
#    - les autologins root de la cle (console, GDM) et la regle PAM qui les
#      permettait sont retires : GDM ouvre sur ${USER}, comme sur tout Ubuntu.
#  Le banc, lui, se pilote toujours en root (sudo -i, ou login root) : les
#  lanceurs du bureau, les unites et /opt/GSM sont en place pour ${USER}, qui
#  est sudoer (users.conf, defaultGroups).
#
#  dontChroot: false - les commandes tournent DANS la cible montee, pas sur le
#  systeme live. Sans cela on modifierait le compte root de la cle USB.
#  timeout genereux : sur un disque lent, update-initramfs prend son temps.
#  ${USER} et ${ROOT} sont substitues par Calamares (module shellprocess).
---
dontChroot: false
timeout: 600
script:
    # root est le compte de travail : compte deverrouille. Son mot de passe est
    # CELUI TAPE dans l'ecran "Utilisateurs" (users.conf, setRootPassword).
    - "-/usr/bin/passwd -u root"

    # ── Plus de compte osmocom sur le disque ──────────────────────────────
    # Il n existait que pour la cle. Sauf si l installateur a justement choisi
    # ce nom : alors c est SON compte, cree par le module users, on n y touche pas.
    - "-/bin/bash -c \"[ \\\"${USER}\\\" = osmocom ] || { pkill -u osmocom 2>/dev/null; userdel -r osmocom 2>/dev/null; groupdel osmocom 2>/dev/null; rm -rf /home/osmocom; }\""

    # ── Les autologins root de la cle sont retires ────────────────────────
    # Console : tty1 et ttyS0 ouvraient sur root sans demander (drop-ins poses
    # par build-iso.sh). Sur le disque, le login est celui d Ubuntu.
    - "-/bin/bash -c \"rm -f /etc/systemd/system/getty@tty1.service.d/10-autologin-root.conf /etc/systemd/system/serial-getty@ttyS0.service.d/10-autologin-root.conf\""
    - "-/bin/bash -c \"rmdir /etc/systemd/system/getty@tty1.service.d /etc/systemd/system/serial-getty@ttyS0.service.d 2>/dev/null || true\""
    # GDM : le module displaymanager (juste avant, dans settings.conf) a ecrit
    # l autologin de ${USER} s il a ete coche. Si la ligne AutomaticLogin=root
    # de la cle a survecu, elle prend le nom de l utilisateur installe.
    - "-/bin/bash -c \"[ -f /etc/gdm3/custom.conf ] && sed -i 's/^AutomaticLogin=root$/AutomaticLogin=${USER}/' /etc/gdm3/custom.conf || true\""
    # La regle PAM 'user != root' avait ete commentee sur la cle pour laisser
    # GDM ouvrir une session root. On la remet : c est celle d Ubuntu.
    - "-/bin/bash -c \"sed -i 's/^#\\\\(auth.*pam_succeed_if.so user != root quiet_success\\\\)/\\\\1/' /etc/pam.d/gdm-password /etc/pam.d/gdm-autologin 2>/dev/null || true\""

    # ── Le bureau de ${USER} : les memes lanceurs que la cle ──────────────
    # Le home vient de /etc/skel, que build-iso.sh a rempli (lanceurs, favoris,
    # gnome-initial-setup-done). On s assure que ce qui a ete cree avant que le
    # skel ne soit lu (module users) ait bien les lanceurs, et le bon proprietaire.
    - "-/bin/bash -c \"h=\\$(getent passwd ${USER} | cut -d: -f6); [ -n \\\"\\$h\\\" ] && for d in Desktop Bureau; do [ -d /etc/skel/\\$d ] && mkdir -p \\$h/\\$d && cp -n /etc/skel/\\$d/*.desktop \\$h/\\$d/ 2>/dev/null; done; [ -n \\\"\\$h\\\" ] && chown -R ${USER}: \\$h || true\""

    # Le dashboard web : les deux unites, et l'oneshot arme au boot. Elles sont
    # prises dans le depot, qui voyage DANS la cible (/opt/GSM/osmo-operator) -
    # rien a telecharger, et une ISO qui n'aurait pas encore les unites dans son
    # squashfs produit quand meme un disque qui les a. Le certificat TLS est
    # fige au build (Dockerfile) : le premier demarrage n a rien a telecharger.
    - "-/bin/bash -c \"cp -f /opt/GSM/osmo-operator/services/osmo-egprs-web.service /etc/systemd/system/ 2>/dev/null || true\""
    - "-/bin/bash -c \"mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /etc/systemd/system/osmo-egprs-web.service /etc/systemd/system/multi-user.target.wants/osmo-egprs-web.service\""

    # ── L'ICONE « INSTALLER » N'A PLUS RIEN A INSTALLER ────────────────────
    # Elle est posee sur le bureau de root et dans /etc/skel par build-iso.sh,
    # et elle a un sens sur la cle : c'est la premiere chose qu'on y cherche.
    # Sur le disque, elle est au mieux inutile, au pire dangereuse - un
    # double-clic ouvre Calamares sur la machine qu'on vient d'installer, avec
    # son propre disque dans la liste des cibles.
    #
    # osmo-install s'en protege (il refuse de partir sans medium live), mais un
    # refus n'est pas une reponse : l'icone ne doit pas etre la. On l'efface de
    # tous les bureaux et de leurs deux noms - "Desktop" et "Bureau" existent
    # tous les deux dans l'image, c'est la locale de la session qui decide
    # lequel est affiche, et n'en effacer qu'un laisserait l'autre en place.
    #
    # /usr/share/applications aussi : sans ca l'entree reste dans le menu des
    # applications, ou elle est plus discrete mais tout aussi active. Le binaire
    # /usr/local/bin/osmo-install, lui, RESTE - il ne fait rien de mal sur un
    # disque, et il sert a installer une AUTRE machine depuis celle-ci si on
    # rebranche une cle.
    - "-/bin/bash -c \"rm -f /root/Desktop/osmo-install.desktop /root/Bureau/osmo-install.desktop /usr/share/applications/osmo-install.desktop /etc/skel/Desktop/osmo-install.desktop /etc/skel/Bureau/osmo-install.desktop\""
    - "-/bin/bash -c \"for h in /home/*; do rm -f \\$h/Desktop/osmo-install.desktop \\$h/Bureau/osmo-install.desktop; done\""
    # L'entree du paquet calamares, elle, etait seulement masquee (NoDisplay).
    # Sur le disque on la retire : elle lance /usr/bin/calamares en direct, donc
    # sans aucun des garde-fous d'osmo-install.
    - "-/bin/bash -c \"rm -f /usr/share/applications/calamares.desktop\""
    - "-/bin/bash -c \"update-desktop-database /usr/share/applications >/dev/null 2>&1 || true\""

    # live-boot n'a plus rien a faire sur un disque : ses scripts d'initramfs
    # chercheraient un medium live a chaque demarrage et allongent le boot.
    - "-/bin/bash -c \"apt-get purge -y live-boot live-boot-initramfs-tools >/dev/null 2>&1 || true\""
    - "-/bin/bash -c \"update-initramfs -u >/dev/null 2>&1 || true\""
