# =============================================================================
#  Ce qui fait qu'un systeme INSTALLE ressemble a la cle live
# =============================================================================
#  Sans ce module, l'installation produit un Ubuntu ordinaire : session sur le
#  compte cree a l'ecran precedent, root verrouille, pas d'osmocom. Or le banc
#  se pilote en root - start-direct.sh, les VTY, tcpdump, les netns - et tout
#  ce qui est ecrit ailleurs dans ce depot suppose ce modele. Une machine
#  installee qui ne l'a pas se comporte autrement que la cle qui l'a installee,
#  et c'est le genre d'ecart qu'on ne decouvre qu'en pleine manipulation.
#
#  dontChroot: false - les commandes tournent DANS la cible montee, pas sur le
#  systeme live. Sans cela on modifierait le compte root de la cle USB.
#  timeout genereux : sur un disque lent, update-initramfs prend son temps.
---
dontChroot: false
timeout: 600
script:
    # root est le compte de travail : compte deverrouille. Son mot de passe est
    # CELUI TAPE dans l'ecran "Utilisateurs" (users.conf, setRootPassword) -
    # jusqu'au 2026-09-02 un "echo root:osmo | chpasswd" ici l'ecrasait en
    # silence, et le mot de passe demande a l'installation ne marchait jamais.
    - "-/usr/bin/passwd -u root"

    # osmocom : le second compte, non privilegie, sudoer. -m cree son home,
    # || true parce que l'installeur a pu deja creer un compte de ce nom.
    - "-/bin/bash -c \"id -u osmocom >/dev/null 2>&1 || useradd -m -s /bin/bash -c 'Compte osmocom (non privilegie)' osmocom\""
    - "-/bin/bash -c \"echo osmocom:osmo | chpasswd\""
    - "-/bin/bash -c \"for g in sudo adm dialout audio video plugdev netdev; do getent group \\$g >/dev/null && usermod -aG \\$g osmocom; done\""

    # La session s'ouvre sur root, comme sur la cle. GDM refuse l'uid 0 par une
    # regle PAM et non par sa configuration : sans la neutraliser, l'autologin
    # est ignore et aucun mot de passe ne passe, y compris le bon.
    - "-/bin/bash -c \"sed -i '/pam_succeed_if.so user != root quiet_success/s/^/#/' /etc/pam.d/gdm-password /etc/pam.d/gdm-autologin 2>/dev/null || true\""
    - "-/bin/bash -c \"mkdir -p /etc/gdm3 && printf '[daemon]\\nAutomaticLoginEnable=true\\nAutomaticLogin=root\\nWaylandEnable=false\\n' > /etc/gdm3/custom.conf\""

    # Console : tty1 ouvre sur root sans demander. Meme comportement que le live.
    - "-/bin/bash -c \"mkdir -p /etc/systemd/system/getty@tty1.service.d && printf '[Service]\\nExecStart=\\nExecStart=-/sbin/agetty --autologin root --noclear %%I \\$TERM\\n' > /etc/systemd/system/getty@tty1.service.d/10-autologin-root.conf\""

    # Le dashboard web : les deux unites, et l'oneshot arme au boot. Elles sont
    # prises dans le depot, qui voyage DANS la cible (/opt/GSM/osmo-operator) -
    # rien a telecharger, et une ISO qui n'aurait pas encore les unites dans son
    # squashfs produit quand meme un disque qui les a. Le certificat TLS n'est
    # Fige au build (Dockerfile) : le premier demarrage n a rien a telecharger
    # du disque, avec le nom et les adresses de la machine installee, donc
    # different de celui de la cle qui a servi a l'installer.
    - "-/bin/bash -c \"cp -f /opt/GSM/osmo-operator/services/osmo-egprs-web.service /etc/systemd/system/ 2>/dev/null || true\""
    - "-/bin/bash -c \"mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /etc/systemd/system/osmo-egprs-web.service /etc/systemd/system/multi-user.target.wants/osmo-egprs-web.service\""

    # ── L'ICONE « INSTALLER » N'A PLUS RIEN A INSTALLER ────────────────────
    # Elle est posee sur le bureau de root et d'osmocom par build-iso.sh, et
    # elle a un sens sur la cle : c'est la premiere chose qu'on y cherche. Sur
    # le disque, elle est au mieux inutile, au pire dangereuse - un double-clic
    # ouvre Calamares sur la machine qu'on vient d'installer, avec son propre
    # disque dans la liste des cibles.
    #
    # osmo-install s'en protege (il refuse de partir sans medium live), mais un
    # refus n'est pas une reponse : l'icone ne doit pas etre la. On l'efface des
    # DEUX bureaux et de leurs deux noms - "Desktop" et "Bureau" existent tous
    # les deux dans l'image, c'est la locale de la session qui decide lequel est
    # affiche, et n'en effacer qu'un laisserait l'autre en place.
    #
    # /usr/share/applications aussi : sans ca l'entree reste dans le menu des
    # applications, ou elle est plus discrete mais tout aussi active. Le binaire
    # /usr/local/bin/osmo-install, lui, RESTE - il ne fait rien de mal sur un
    # disque, et il sert a installer une AUTRE machine depuis celle-ci si on
    # rebranche une cle.
    #
    # Les metadonnees gvfs qui portaient l'attribut « approuve » (voir
    # osmo-trust-desktop) partent avec le fichier : rien a nettoyer de plus.
    - "-/bin/bash -c \"rm -f /root/Desktop/osmo-install.desktop /root/Bureau/osmo-install.desktop /usr/share/applications/osmo-install.desktop\""
    - "-/bin/bash -c \"for h in /home/*; do rm -f \\$h/Desktop/osmo-install.desktop \\$h/Bureau/osmo-install.desktop; done\""
    # L'entree du paquet calamares, elle, etait seulement masquee (NoDisplay).
    # Sur le disque on la retire : elle lance /usr/bin/calamares en direct, donc
    # sans aucun des garde-fous d'osmo-install.
    - "-/bin/bash -c \"rm -f /usr/share/applications/calamares.desktop\""
    - "-/bin/bash -c \"update-desktop-database /usr/share/applications >/dev/null 2>&1 || true\""

    # live-boot n'a plus rien a faire sur un disque : ses scripts d'initramfs
    # chercheraient un medium live a chaque demarrage et allongent le boot.
    - "-/bin/bash -c \"apt-get purge -y live-boot live-boot-initramfs-tools >/dev/null 2>&1 || true\""
    - "-/bin/bash -c \"update-initramfs -u >/dev/null 2>&1 || true\""
