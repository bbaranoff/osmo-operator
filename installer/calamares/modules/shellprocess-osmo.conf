# =============================================================================
#  Ce qui fait qu'un systeme INSTALLE ressemble a la cle live
# =============================================================================
#  Sans ce module, l'installation produit un Ubuntu ordinaire : session sur le
#  compte cree a l'ecran precedent, root verrouille, pas d'osmocom. Or le banc
#  se pilote en root - start-direct.sh, les VTY, tcpdump, les netns - et tout
#  ce qui est ecrit ailleurs dans ce depot suppose ce modele. Une machine
#  installee qui ne l'a pas se comporte autrement que la cle qui l'a installee,
#  et c'est le genre d'ecart qu'on ne decouvre qu'en pleine manipulation.
#
#  dontChroot: false - les commandes tournent DANS la cible montee, pas sur le
#  systeme live. Sans cela on modifierait le compte root de la cle USB.
#  timeout genereux : sur un disque lent, update-initramfs prend son temps.
---
dontChroot: false
timeout: 600
script:
    # root est le compte de travail : mot de passe pose, compte deverrouille.
    - "-/bin/bash -c \"echo root:osmo | chpasswd\""
    - "-/usr/bin/passwd -u root"

    # osmocom : le second compte, non privilegie, sudoer. -m cree son home,
    # || true parce que l'installeur a pu deja creer un compte de ce nom.
    - "-/bin/bash -c \"id -u osmocom >/dev/null 2>&1 || useradd -m -s /bin/bash -c 'Compte osmocom (non privilegie)' osmocom\""
    - "-/bin/bash -c \"echo osmocom:osmo | chpasswd\""
    - "-/bin/bash -c \"for g in sudo adm dialout audio video plugdev netdev; do getent group \\$g >/dev/null && usermod -aG \\$g osmocom; done\""

    # La session s'ouvre sur root, comme sur la cle. GDM refuse l'uid 0 par une
    # regle PAM et non par sa configuration : sans la neutraliser, l'autologin
    # est ignore et aucun mot de passe ne passe, y compris le bon.
    - "-/bin/bash -c \"sed -i '/pam_succeed_if.so user != root quiet_success/s/^/#/' /etc/pam.d/gdm-password /etc/pam.d/gdm-autologin 2>/dev/null || true\""
    - "-/bin/bash -c \"mkdir -p /etc/gdm3 && printf '[daemon]\\nAutomaticLoginEnable=true\\nAutomaticLogin=root\\nWaylandEnable=false\\n' > /etc/gdm3/custom.conf\""

    # Console : tty1 ouvre sur root sans demander. Meme comportement que le live.
    - "-/bin/bash -c \"mkdir -p /etc/systemd/system/getty@tty1.service.d && printf '[Service]\\nExecStart=\\nExecStart=-/sbin/agetty --autologin root --noclear %%I \\$TERM\\n' > /etc/systemd/system/getty@tty1.service.d/10-autologin-root.conf\""

    # live-boot n'a plus rien a faire sur un disque : ses scripts d'initramfs
    # chercheraient un medium live a chaque demarrage et allongent le boot.
    - "-/bin/bash -c \"apt-get purge -y live-boot live-boot-initramfs-tools >/dev/null 2>&1 || true\""
    - "-/bin/bash -c \"update-initramfs -u >/dev/null 2>&1 || true\""
