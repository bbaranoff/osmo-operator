# =============================================================================
#  packagechooser@tpm - « Demarrage » page: the TPM code before the passphrase
# =============================================================================
#  osmo-install (the live launcher) REWRITES this file at every launch from
#  /sys/class/tpm: with an active TPM 2.0 (fTPM / PTT enabled in the BIOS) the
#  « porte » entry is offered and preselected; without, only « grub ». This
#  file is the fallback without a TPM. contextualprocess-tpm.conf writes the
#  choice to /etc/osmo-porte/mode, read by osmo-grub-esp.
---
mode: required
method: legacy
labels:
    step: "Demarrage"
default: grub
items:
    - id: grub
      name: "Phrase de nirvana demandee par GRUB"
      description: "Aucun TPM actif : active fTPM (AMD) ou PTT (Intel) dans le BIOS, puis relance l installeur pour avoir le code TPM avant la phrase."
