# =============================================================================
#  contextualprocess@nvidia - installe le pilote NVIDIA si l entree est choisie
# =============================================================================
#  Lit la cle globalstorage packagechooser_nvidia (page packagechooser@nvidia).
#  Valeur "nvidia" : on installe, DANS LA CIBLE, le pilote recommande par
#  ubuntu-drivers (nvidia-driver-5xx de base, sans les paquets serveur). Deux
#  gardes : une carte NVIDIA doit etre vue (lspci, vendor 10de) et le reseau
#  doit repondre - sinon on le dit dans le journal et l installation continue :
#  un disque sans pilote proprietaire vaut mieux qu une installation echouee.
#
#  /run de la cible est un tmpfs vide (mount.conf) : /etc/resolv.conf, lien vers
#  /run/systemd/resolve/stub-resolv.conf, y pointe dans le vide. On y ecrit des
#  resolveurs publics le temps de l apt ; le tmpfs disparait au demontage.
---
dontChroot: false
timeout: 1800
packagechooser_nvidia:
    "nvidia":
        - "-/bin/bash -c \"if ! lspci -n 2>/dev/null | grep -qi ' 10de:'; then echo '[nvidia] aucune carte NVIDIA (10de) : pilote non installe'; exit 0; fi; mkdir -p /run/systemd/resolve; [ -s /run/systemd/resolve/stub-resolv.conf ] || printf 'nameserver 1.1.1.1\\\\nnameserver 8.8.8.8\\\\n' > /run/systemd/resolve/stub-resolv.conf; export DEBIAN_FRONTEND=noninteractive; apt-get update -qq || { echo '[nvidia] pas de reseau : pilote non installe'; exit 0; }; apt-get install -y --no-install-recommends ubuntu-drivers-common pciutils >/dev/null 2>&1 || true; if ubuntu-drivers install --gpgpu 2>/dev/null || ubuntu-drivers install; then echo '[nvidia] pilote installe :'; dpkg -l 'nvidia-driver-*' 2>/dev/null | awk '/^ii/{print \\$2, \\$3}'; else echo '[nvidia] ubuntu-drivers a echoue - essai nvidia-driver-550'; apt-get install -y nvidia-driver-550 || echo '[nvidia] installation impossible'; fi\""
        - "-/bin/bash -c \"update-initramfs -u >/dev/null 2>&1 || true\""
    "none":
        - "-/bin/true"
