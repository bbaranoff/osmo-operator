# =============================================================================
#  contextualprocess-nvidia.conf - contextualprocess@nvidia: installs the
#  NVIDIA driver when that entry is selected
# =============================================================================
#  Reads the globalstorage key packagechooser_nvidia (page packagechooser@nvidia).
#  Value "nvidia": installs nvidia-driver-610 INSIDE THE TARGET, a pinned
#  version from noble-updates/multiverse (no `ubuntu-drivers`, whose choice
#  varies between machines and needs network at the right moment):
#      sudo apt install nvidia-driver-610
#
#  Two guards: an NVIDIA card must be visible (lspci, vendor 10de) and the
#  network must answer; otherwise it is logged and the installation continues
#  (a disk without the proprietary driver is better than a failed install).
#
#  /run of the target is an empty tmpfs (mount.conf): /etc/resolv.conf, a link
#  to /run/systemd/resolve/stub-resolv.conf, points nowhere. Public resolvers
#  are written there for the duration of apt; the tmpfs vanishes at unmount.
---
dontChroot: false
timeout: 1800
packagechooser_nvidia:
    "nvidia":
        - "-/bin/bash -c \"if ! lspci -n 2>/dev/null | grep -qi ' 10de:'; then echo '[nvidia] aucune carte NVIDIA (10de) : pilote non installe'; exit 0; fi; mkdir -p /run/systemd/resolve; [ -s /run/systemd/resolve/stub-resolv.conf ] || printf 'nameserver 1.1.1.1\\\\nnameserver 8.8.8.8\\\\n' > /run/systemd/resolve/stub-resolv.conf; export DEBIAN_FRONTEND=noninteractive; apt-get update -qq || { echo '[nvidia] pas de reseau : pilote non installe'; exit 0; }; if apt-get install -y nvidia-driver-610; then echo '[nvidia] pilote installe :'; dpkg -l 'nvidia-driver-*' 2>/dev/null | awk '/^ii/{print \\$2, \\$3}'; else echo '[nvidia] nvidia-driver-610 non installable (absent du miroir ?) - le pilote libre nouveau reste en place'; fi\""
        - "-/bin/bash -c \"update-initramfs -u >/dev/null 2>&1 || true\""
    "none":
        - "-/bin/true"
