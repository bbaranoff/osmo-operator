# =============================================================================
#  contextualprocess@nvidia - installe le pilote NVIDIA si l entree est choisie
# =============================================================================
#  Lit la cle globalstorage packagechooser_nvidia (page packagechooser@nvidia).
#  Valeur "nvidia" : on installe, DANS LA CIBLE, nvidia-driver-610.
#
#  [2026-09-04] UNE VERSION FIGEE, PLUS `ubuntu-drivers`. Le choix du pilote
#  passait par `ubuntu-drivers install`, qui interroge les depots et decide
#  seul : d une machine a l autre, et d une semaine a l autre, on n installait
#  pas la meme chose - et sur une cible fraiche, sans ubuntu-drivers-common ni
#  reseau au bon moment, il ne decidait rien du tout. Le banc demande
#  nvidia-driver-610, il est dans noble-updates/multiverse, il s installe comme
#  n importe quel paquet. C est ce que fait un operateur a la main :
#      sudo apt install nvidia-driver-610
#
#  Deux gardes restent : une carte NVIDIA doit etre vue (lspci, vendor 10de) et
#  le reseau doit repondre - sinon on le dit dans le journal et l installation
#  continue : un disque sans pilote proprietaire vaut mieux qu une installation
#  echouee.
#
#  /run de la cible est un tmpfs vide (mount.conf) : /etc/resolv.conf, lien vers
#  /run/systemd/resolve/stub-resolv.conf, y pointe dans le vide. On y ecrit des
#  resolveurs publics le temps de l apt ; le tmpfs disparait au demontage.
---
dontChroot: false
timeout: 1800
packagechooser_nvidia:
    "nvidia":
        - "-/bin/bash -c \"if ! lspci -n 2>/dev/null | grep -qi ' 10de:'; then echo '[nvidia] aucune carte NVIDIA (10de) : pilote non installe'; exit 0; fi; mkdir -p /run/systemd/resolve; [ -s /run/systemd/resolve/stub-resolv.conf ] || printf 'nameserver 1.1.1.1\\\\nnameserver 8.8.8.8\\\\n' > /run/systemd/resolve/stub-resolv.conf; export DEBIAN_FRONTEND=noninteractive; apt-get update -qq || { echo '[nvidia] pas de reseau : pilote non installe'; exit 0; }; if apt-get install -y nvidia-driver-610; then echo '[nvidia] pilote installe :'; dpkg -l 'nvidia-driver-*' 2>/dev/null | awk '/^ii/{print \\$2, \\$3}'; else echo '[nvidia] nvidia-driver-610 non installable (absent du miroir ?) - le pilote libre nouveau reste en place'; fi\""
        - "-/bin/bash -c \"update-initramfs -u >/dev/null 2>&1 || true\""
    "none":
        - "-/bin/true"
