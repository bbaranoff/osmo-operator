# =============================================================================
#  users.conf - account created during installation
# =============================================================================
#  The installer creates the account entered on this page (sudoer).
#  shellprocess@osmo, which runs afterwards, removes the live key's osmocom
#  account (unless it is the chosen name) and keeps root as an unlocked working
#  account.
#
#  setRootPassword: true - root is the bench's working account, so "su" needs
#  a root password. doAutologin: true - the installer sets up autologin for
#  the created account if ticked.
---
defaultGroups:
    - adm
    - cdrom
    - sudo
    - dip
    - plugdev
    - lpadmin
    - dialout
    - audio
    - video
    # pulse-access: bench audio goes through a SYSTEM PulseAudio
    # (osmo-pulse.service). Its socket accepts anonymous clients (auth-anonymous=1,
    # set by iso_modules/82-services.sh), but this group is PulseAudio's documented
    # access path in system mode.
    - pulse-access
    # docker: Conky (tools/conky-osmo-status.sh) and the panel
    # (tools/osmo-panel.py) run under THIS account and probe each containerised
    # operator with "docker exec"; without the group every probe fails with
    # "permission denied" and the operator is shown as stopped.
    # The group exists only once docker is installed (addition.sh); Calamares
    # silently ignores a missing group, and addition.sh adds the session account
    # itself (_docker_groupe_session).
    - docker

autologinGroup:  autologin
doAutologin:     true
sudoersGroup:    sudo
setRootPassword: true
doReusePassword: false

# No password policy on a lab bench.
passwordRequirements:
    nonempty:  false
    minLength: -1

user:
    shell: /bin/bash
    # Only root is forbidden. Choosing "osmocom" makes it the user's own account
    # (shellprocess-osmo.conf then keeps it).
    forbidden_names:
        - root
