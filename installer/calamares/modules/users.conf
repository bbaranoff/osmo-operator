# =============================================================================
#  Le compte cree pendant l'installation
# =============================================================================
#  LE MODELE DE CETTE IMAGE : root est le compte de travail par defaut, et
#  osmocom est un SECOND compte, non privilegie, sudoer, qu'on choisit
#  explicitement. C'est vrai sur la cle live comme sur le systeme installe.
#
#  Cet ecran est donc la ou l'on "demande si on veut changer l'utilisateur par
#  defaut" : la personne qui installe peut creer le compte qu'elle veut. Quoi
#  qu'elle reponde, l'instance shellprocess@osmo qui tourne juste apres
#  RETABLIT les deux garanties de l'image - autologin sur root, et osmocom
#  present et sudoer. Un choix personnalise s'ajoute, il ne remplace pas.
#
#  setRootPassword: true - sans mot de passe root, "su" est inutilisable sur un
#  systeme dont root EST le compte de travail. doAutologin est laisse a true :
#  l'installeur pose l'autologin sur le compte cree, et shellprocess le bascule
#  ensuite sur root.
---
defaultGroups:
    - adm
    - cdrom
    - sudo
    - dip
    - plugdev
    - lpadmin
    - dialout
    - audio
    - video

autologinGroup:  autologin
doAutologin:     true
sudoersGroup:    sudo
setRootPassword: true
doReusePassword: false

# Un banc n'est pas une machine de production : on n'impose pas de politique de
# mot de passe, elle ne ferait que faire choisir "azerty" plus lentement.
passwordRequirements:
    nonempty:  false
    minLength: -1

user:
    shell: /bin/bash
    forbidden_names:
        - root
        - osmocom
