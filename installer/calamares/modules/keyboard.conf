# =============================================================================
#  keyboard.conf - keyboard configuration written to the target
# =============================================================================
#  Without this file Calamares logs "No config file for keyboard found" and
#  applies a default (us) keyboard. The values below are only the starting
#  point; the keyboard page still lets the operator change them.
# -----------------------------------------------------------------------------
---
# Generic 105-key keyboard model: the right default for a bench PC.
keyboardModel: pc105

# X11 keyboard configuration file written to the target and keymap conversion path.
xOrgConfFileName:   "00-keyboard.conf"
convertedKeymapPath: "/usr/share/X11/xkb/symbols/pc"

# Also write the console configuration (vconsole/keymap) to the target, not
# only X: a bench is often driven from a tty.
writeEtcDefaultKeyboard: true
