# =============================================================================
#  keyboard.conf - le clavier ecrit dans la cible
# =============================================================================
#  Sans ce fichier, calamares journalisait "No config file for keyboard found"
#  et posait un clavier par defaut (us) qui ne correspond pas au banc. On lui
#  donne un modele et une disposition de repli ; l'ecran clavier laisse toujours
#  l'operateur changer, ceci n'est que le point de depart.
# -----------------------------------------------------------------------------
---
# Modele de clavier generique 105 touches : le bon defaut pour un PC de banc.
keyboardModel: pc105

# Disposition de repli si l'ecran clavier n'est pas confirme. fr : ce banc est
# opere en France ; l'operateur peut choisir autre chose a l'ecran keyboard.
xOrgConfFileName:   "00-keyboard.conf"
convertedKeymapPath: "/usr/share/X11/xkb/symbols/pc"

# Ecrit aussi la configuration console (vconsole/keymap) dans la cible, pas
# seulement X : un banc se pilote souvent en tty.
writeEtcDefaultKeyboard: true
