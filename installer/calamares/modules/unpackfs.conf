# Ou est le systeme a deverser sur le disque.
#
# /run/live/medium est le point de montage que LIVE-BOOT donne au medium (une
# ISO Ubuntu montee par casper serait sous /cdrom - c'est toute la difference,
# et c'est la raison pour laquelle ubiquity ne pouvait pas servir ici).
# Le chemin doit correspondre a ce que build-iso.sh ecrit :
#     mksquashfs "$ROOTFS" "$ISOROOT/live/filesystem.squashfs"
# soit /live/filesystem.squashfs sur le medium.
---
unpack:
    - source: /run/live/medium/live/filesystem.squashfs
      sourcefs: squashfs
      destination: ""
