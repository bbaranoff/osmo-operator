# unpackfs.conf - source of the system copied onto the target disk.
#
# /run/osmo-install-src/live/filesystem.squashfs is a path that
# /usr/local/bin/osmo-install guarantees before starting Calamares: it finds the
# squashfs actually mounted (via the loop device backing the running root) and
# bind-mounts it there. This makes the path independent of the boot mode:
# live-boot's /run/live/medium/live/filesystem.squashfs only exists in normal
# mode ("toram" puts the file at /run/live/medium/filesystem.squashfs,
# "persistent" may leave /run/live/medium empty).
#
# Consequence: starting /usr/bin/calamares directly does not work; always use
# osmo-install (which also cleans up targets left mounted).
---
unpack:
    - source: /run/osmo-install-src/live/filesystem.squashfs
      sourcefs: squashfs
      destination: ""
