# Ou est le systeme a deverser sur le disque.
#
# ── POURQUOI PAS /run/live/medium/live/filesystem.squashfs ──────────────────
# C'etait la valeur d'avant, et c'est le chemin que live-boot donne EN MODE
# NORMAL : le medium est monte sur /run/live/medium, et le squashfs y est a sa
# place d'origine, dans live/.
#
# Ce chemin n'existe pas dans les autres modes de demarrage, et l'ISO en offre
# deux autres dans son menu :
#
#   « en RAM » (toram=filesystem.squashfs) : live-boot ne recopie pas
#     l'arborescence du medium, il copie LE FICHIER seul a la racine d'un tmpfs
#     qu'il deplace ensuite sur /run/live/medium. Le squashfs est alors en
#     /run/live/medium/filesystem.squashfs - sans le "live/". Le systeme
#     demarre tres bien (live-boot sait ou il l'a mis) et l'installation, elle,
#     echouait : « Mauvaise configuration unpackfs », ou le refus prealable
#     d'osmo-install.
#   « persistant » : live-boot balaie les disques et peut monter la cle sous
#     /run/live/persistence/sdX, laissant /run/live/medium vide.
#
# ── CE QU'ON LIT A LA PLACE ─────────────────────────────────────────────────
# /run/osmo-install-src/live/filesystem.squashfs est un chemin que
# /usr/local/bin/osmo-install GARANTIT avant de lancer Calamares : il retrouve
# le squashfs reellement monte (par le loop qui porte la racine en cours
# d'execution, pas par un chemin suppose) et le bind-monte la. Le chemin ne
# depend donc plus d'aucun mode de demarrage - c'est le lanceur qui absorbe la
# difference, une fois, a un endroit.
#
# COROLLAIRE : lancer /usr/bin/calamares directement ne marche plus. C'est
# voulu et c'etait deja le cas : son entree de menu est en NoDisplay sur la cle
# et supprimee a l'installation, parce qu'elle court-circuite aussi le
# nettoyage des cibles restees montees. On passe par osmo-install.
---
unpack:
    - source: /run/osmo-install-src/live/filesystem.squashfs
      sourcefs: squashfs
      destination: ""
