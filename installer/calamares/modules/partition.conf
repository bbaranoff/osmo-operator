# =============================================================================
#  partition.conf - le decoupage du disque cible
# =============================================================================
#  Sans ce fichier, le module partition tournait sur ses defauts internes et
#  journalisait trois avertissements ("initialSwapChoice absent",
#  "defaultFileSystemType absent", "defaultPartitionTableType absent"). Pire :
#  le defaut d'un partitionneur qui ne sait rien du contexte est le mauvais
#  pour un banc - il proposait le redimensionnement d'un Windows qui n'existe
#  pas. On lui dit ce qu'on veut : effacer et installer, en ext4, sur une table
#  GPT quand la machine demarre en UEFI.
# -----------------------------------------------------------------------------
---
# efiSystemPartition : le point de montage de la partition EFI. Doit
# correspondre a ce que bootloader/grubcfg attendent (GRUB EFI y depose
# grubx64/shimx64). /boot/efi est la convention Debian/Ubuntu.
efiSystemPartition:     "/boot/efi"

# Taille de l'ESP. 300 MiB laisse la place a shim + grub + un noyau de secours
# sans etre avare.
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI

# Le systeme de fichiers par defaut de la racine. ext4 : ce banc n'a besoin ni
# des instantanes de btrfs ni du journal de xfs, et ext4 est celui que
# fsck/grub/live-boot connaissent le mieux ici.
defaultFileSystemType:  "ext4"

# La table de partitions quand rien n'impose l'inverse : GPT en UEFI (le cas de
# cette ISO, qui demarre par shim signe), msdos en BIOS herite.
defaultPartitionTableType: gpt

# Le swap. "none" par defaut : un banc de mesure tourne en RAM et un fichier
# d'echange sur SSD n'apporte rien ; l'operateur peut toujours choisir
# "swapfile" dans la liste ci-dessous s'il installe sur une petite machine.
initialSwapChoice: none
userSwapChoices:
    - none
    - swapfile

# On autorise l'effacement complet ET l'installation manuelle. Pas de
# "alongside" (cohabitation) : un banc GSM n'est pas un poste bureautique a
# cote d'un autre OS, et l'option ne ferait qu'ouvrir une voie a l'erreur.
allowManualPartitioning: true

# ── LUKS : CE QUI EST CHIFFRE, C EST /home - PAS LA RACINE ─────────────────
# [2026-09-25] La case "Chiffrer le systeme" apparait dans les modes
# automatiques (effacer le disque, installer a cote, remplacer). Cochee, elle ne
# chiffre PAS tout : la racine porte "noEncrypt" ci-dessous, seule la partition
# /home passe en LUKS2.
#
# LE MODELE, en une phrase : tout ce qui est systeme reste lisible, tout ce qui
# tient au trousseau est chiffre. Le banc se pilote en root (VTY, netns,
# tcpdump) et un operateur doit pouvoir sortir une trace, relire un journal ou
# reparer la machine depuis une cle live sans rien dechiffrer. Ce qui n a rien a
# faire en clair, ce sont les SECRETS : trousseau, cookies, jetons, profils -
# et ceux-la vivent tous dans /home.
#
# CE QUE CELA SIMPLIFIE. Racine en clair = GRUB lit la racine directement, pas
# de /boot separe, pas de phrase de passe dans l initramfs, pas de
# /crypto_keyfile.bin (luksbootkeyfile constate qu aucune racine n est chiffree
# et ne fait rien). Le volume /home n est ouvert qu apres, par unlock-home.
#
# ET CE QUE CELA DEMANDE. Calamares ecrirait pour /home une ligne crypttab
# ordinaire : systemd demanderait la phrase de passe au demarrage et
# ATTENDRAIT. crypthome-postinstall (shellprocess@osmo) repasse crypttab et
# fstab en "noauto" et remplit /etc/default/crypthome, pour que ce soit
# unlock-home.service qui pose la question - avec un delai, et un demarrage qui
# se termine quelle que soit la reponse.
#
# En partitionnement MANUEL, rien de tout cela n est impose : le chiffrement se
# coche partition par partition, et crypthome-postinstall raccorde ce qu il
# trouve sous /home, chiffre ou non.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
# LVM : Calamares ne le propose pas en mode automatique ; il est disponible
# dans le partitionnement MANUEL (creer un groupe de volumes, y poser la racine,
# chiffrer le volume physique en LUKS si on veut LUKS-sur-LVM). lvm2 est dans
# le rootfs (build-iso.sh, bloc desktop) : l installeur, l initrd de la cible
# (initramfscfg + initramfs) et le systeme installe le comprennent.

# ── LE DECOUPAGE ────────────────────────────────────────────────────────────
# Deux partitions, et c est ce qui rend le chiffrement de /home possible : tant
# que /home etait un repertoire de la racine, il n y avait rien a chiffrer
# separement, et cocher la case aurait chiffre le systeme entier.
#
# LES TAILLES. Moitie-moitie, avec deux garde-fous. La racine porte /opt/GSM,
# les images docker et les .deb du banc - d ou un plancher a 25 GiB, au-dessus
# des 20 GiB que welcome.conf exige deja. /home porte les profils ET les images
# disque de pmbootstrap, qui se comptent en dizaines de gigaoctets : lui laisser
# le reste (100% = ce qui n a pas ete pris) evite d avoir a deviner.
#
# Sur un disque trop petit pour les deux, la racine prend tout et il n y a pas
# de /home separe : crypthome-postinstall le CONSTATE et le dit en clair plutot
# que de laisser croire a un banc chiffre.
partitionLayout:
    - name: "osmo-egprs"
      filesystem: "ext4"
      mountPoint: "/"
      size: 50%
      minSize: 25GiB
      # Le point du dispositif : la racine reste LISIBLE, meme quand
      # l operateur coche "chiffrer". Sans cette ligne, cocher la case
      # chiffrerait le systeme et on perdrait la reparation depuis une cle live.
      noEncrypt: true
    - name: "crypthome"
      filesystem: "ext4"
      mountPoint: "/home"
      size: 100%
      minSize: 5GiB
