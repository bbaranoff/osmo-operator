# =============================================================================
#  partition.conf - partitioning of the target disk
# =============================================================================
#  Erase-and-install (or manual partitioning), ext4, GPT when booting UEFI.
# -----------------------------------------------------------------------------
---
# Mount point of the EFI system partition. Must match what bootloader/grubcfg
# expect (GRUB EFI installs grubx64/shimx64 there). /boot/efi is the
# Debian/Ubuntu convention.
efiSystemPartition:     "/boot/efi"

# ESP size: room for shim + grub + a fallback kernel.
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI

# Default root filesystem.
defaultFileSystemType:  "ext4"

# Partition table when nothing forces otherwise: GPT on UEFI (this ISO boots
# through signed shim), msdos on legacy BIOS.
defaultPartitionTableType: gpt

# Swap: none. / is read-only (RAM layer) and /home's writes are in RAM too
# until shutdown; no choice to make.
initialSwapChoice: none
userSwapChoices:
    - none

# Full erase AND manual partitioning are allowed; no "alongside" install.
allowManualPartitioning: true

# ── ONE SYSTEM, SIMPLE ──────────────────────────────────────────────────────
#   EFI          clear  Ubuntu's GRUB (shim + grub signed: Secure Boot)
#   /            clear  the system, READ-ONLY once installed: every session
#                       runs in RAM (overlayroot, osmo-racine-live)
#   osmo-diffs   clear  the black box (each record encrypted with age)
#   /home        LUKS2  nirvana's home
#
# At boot unlock-home asks the /home passphrase (Enter: root session, no
# /home). At SHUTDOWN the same passphrase writes the whole session - /, /root,
# /opt/GSM and /home - to the disk, atomically; without it everything is
# wiped (red warning on the console). The black box records every session,
# validated or wiped; its own passphrase, different, only reads it back.
#
# TICK « Encrypt system » on the erase page: / and osmo-diffs carry
# noEncrypt, so only /home is encrypted. Without it there is no passphrase to
# validate with: osmo-racine-live then leaves / read-write (and says so).
#
# CHOOSING THE VOLUMES, LVM INCLUDED: « Manual partitioning » (allowed below)
# sets every size, and its « New Volume Group » button builds LVM. Accepted,
# as long as the four roles stay as above:
#   - partitions or LVs, any mix: / , /var/lib/osmo-diffs and /home each on
#     its own file system (/boot may be on its own, in clear);
#   - / and osmo-diffs NOT encrypted; /home encrypted, LUKS2 « on top »:
#     the /home partition or LV gets « Encrypt » ticked, so fstab reads
#     /dev/mapper/luks-* (crypthome-postinstall wires that up);
#   - NOT a volume group on an encrypted physical volume: / would be
#     encrypted too, GRUB would have to open it, and nothing could tell the
#     /home passphrase from the system's.
# lvm2 is in the image: its initramfs hook activates the volume group before
# the root is mounted, and before unlock-home opens /home. A /home left in
# clear is reported by crypthome-postinstall, and / then stays read-write
# (osmo-racine-live has no passphrase to validate with).
#
# LUKS2: GRUB never opens it (/ and /boot are in clear), so Argon2 is fine.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

# ── LAYOUT ───────────────────────────────────────────────────────────────
# / : /opt/GSM, docker images, the bench .debs, pmbootstrap disk images - and
# room for the staging copy of a session at shutdown. osmo-diffs: 5 GiB.
# /home : the rest.
partitionLayout:
    - name: "osmo-egprs"
      filesystem: "ext4"
      mountPoint: "/"
      size: 60%
      minSize: 40GiB
      noEncrypt: true
    # osmo-diffs (configs/crypthome/osmo-diffs): the BLACK BOX. Not LUKS:
    # every record is encrypted with age for a public key, so the machine
    # fills it without being able to read it; only its own passphrase does.
    - name: "osmo-diffs"
      filesystem: "ext4"
      mountPoint: "/var/lib/osmo-diffs"
      size: 5GiB
      noEncrypt: true
    - name: "osmo-home"
      filesystem: "ext4"
      mountPoint: "/home"
      size: 100%
      minSize: 10GiB
