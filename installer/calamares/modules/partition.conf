# =============================================================================
#  partition.conf - partitioning of the target disk
# =============================================================================
#  Erase-and-install (or manual partitioning), ext4, GPT when booting UEFI.
# -----------------------------------------------------------------------------
---
# Mount point of the EFI system partition. Must match what bootloader/grubcfg
# expect (GRUB EFI installs grubx64/shimx64 there). /boot/efi is the
# Debian/Ubuntu convention.
efiSystemPartition:     "/boot/efi"

# ESP size: room for shim + grub + a fallback kernel.
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI

# Default root filesystem.
defaultFileSystemType:  "ext4"

# Partition table when nothing forces otherwise: GPT on UEFI (this ISO boots
# through signed shim), msdos on legacy BIOS.
defaultPartitionTableType: gpt

# Swap: none by default; "swapfile" can be selected for small machines.
initialSwapChoice: none
userSwapChoices:
    - none
    - swapfile

# Full erase AND manual partitioning are allowed; no "alongside" install.
allowManualPartitioning: true

# ── LUKS: ONLY /home IS ENCRYPTED, NOT THE ROOT ───────────────────────────
# The "Encrypt system" checkbox (automatic modes) does NOT encrypt everything:
# the root partition has "noEncrypt" below, only /home becomes LUKS2.
#
# Model: everything system-related stays readable (the bench is driven as root
# and must be repairable from a live key without decrypting anything); secrets
# (keyring, cookies, tokens, profiles) live in /home and are encrypted.
#
# Consequences: GRUB reads the root directly, no separate /boot, no passphrase
# in the initramfs, no /crypto_keyfile.bin (luksbootkeyfile sees no encrypted
# root and does nothing). /home is opened later by unlock-home.
#
# Calamares writes a regular crypttab line for /home, which would make systemd
# block at boot waiting for the passphrase. crypthome-postinstall
# (shellprocess@osmo) switches crypttab and fstab to "noauto" and fills
# /etc/default/crypthome so that unlock-home.service asks instead, with a
# timeout, and boot completes whatever the answer.
#
# In MANUAL partitioning nothing is enforced: encryption is chosen per
# partition, and crypthome-postinstall wires up whatever it finds under /home,
# encrypted or not.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
# LVM: not offered in automatic mode; available in MANUAL partitioning
# (create a volume group, put the root on it, optionally encrypt the physical
# volume for LUKS-on-LVM). lvm2 is in the rootfs (build-iso.sh, desktop block),
# so the installer, the target initrd (initramfscfg + initramfs) and the
# installed system support it.

# ── LAYOUT ───────────────────────────────────────────────────────────────
# Two partitions; a separate /home is what makes encrypting only /home possible.
#
# Sizes: half/half with two limits. The root holds /opt/GSM, docker images and
# the bench .debs, hence a 25 GiB floor (above the 20 GiB required by
# welcome.conf). /home holds profiles AND pmbootstrap disk images (tens of GB),
# so it gets the rest (100% = whatever is left).
#
# On a disk too small for both, the root takes everything and there is no
# separate /home: crypthome-postinstall detects and reports it.
partitionLayout:
    - name: "osmo-egprs"
      filesystem: "ext4"
      mountPoint: "/"
      size: 50%
      minSize: 25GiB
      # The root stays READABLE even when the operator ticks "encrypt"; without
      # this line the whole system would be encrypted and live-key repair lost.
      noEncrypt: true
    - name: "crypthome"
      filesystem: "ext4"
      mountPoint: "/home"
      size: 100%
      minSize: 5GiB
