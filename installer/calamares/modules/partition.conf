# =============================================================================
#  partition.conf - partitioning of the target disk
# =============================================================================
#  Erase-and-install (or manual partitioning), ext4, GPT when booting UEFI.
# -----------------------------------------------------------------------------
---
# Mount point of the EFI system partition. Must match what bootloader/grubcfg
# expect (GRUB EFI installs grubx64/shimx64 there). /boot/efi is the
# Debian/Ubuntu convention.
efiSystemPartition:     "/boot/efi"

# ESP size: room for shim + grub + a fallback kernel.
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI

# Default root filesystem.
defaultFileSystemType:  "ext4"

# Partition table when nothing forces otherwise: GPT on UEFI (this ISO boots
# through signed shim), msdos on legacy BIOS.
defaultPartitionTableType: gpt

# Swap: none. / is read-only for root's sessions (overlayroot), a swapfile
# there would be pointless.
initialSwapChoice: none
userSwapChoices:
    - none

# Full erase AND manual partitioning are allowed; no "alongside" install.
allowManualPartitioning: true

# ── ONE SYSTEM, ONLY /home ENCRYPTED ────────────────────────────────────────
#   EFI     clear  GRUB (Ubuntu's, unchanged)
#   /       clear  the system - read-only for root, read-write for nirvana
#   /home   LUKS2  nirvana's home
#
# At boot the initramfs asks « decrypt /home -passphrase- or Enter »
# (osmo-racine-live):
#   right passphrase : nirvana's session, /home opened, / written to the disk;
#   Enter / wrong    : root's session, no /home, / read-only (writes in RAM,
#                      gone at the next boot).
#
# TICK « Encrypt system » on the erase page: / carries noEncrypt, so only
# /home is encrypted. Without it /home is clear and crypthome-postinstall
# says so.
#
# LUKS2: GRUB never opens the volume (the initramfs does), Argon2 is fine.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

# ── LAYOUT ───────────────────────────────────────────────────────────────
# / : /opt/GSM, docker images, the bench .debs. /home : the rest -
# nirvana's profiles, keyrings, pmbootstrap disk images.
partitionLayout:
    - name: "osmo-egprs"
      filesystem: "ext4"
      mountPoint: "/"
      size: 60%
      minSize: 30GiB
      noEncrypt: true
    - name: "osmo-home"
      filesystem: "ext4"
      mountPoint: "/home"
      size: 100%
      minSize: 8GiB
