# =============================================================================
#  partition.conf - partitioning of the target disk
# =============================================================================
#  Erase-and-install (or manual partitioning), ext4, GPT when booting UEFI.
# -----------------------------------------------------------------------------
---
# Mount point of the EFI system partition. Must match what bootloader/grubcfg
# expect (GRUB EFI installs grubx64/shimx64 there). /boot/efi is the
# Debian/Ubuntu convention.
efiSystemPartition:     "/boot/efi"

# ESP size: room for shim + grub + a fallback kernel.
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI

# Default root filesystem.
defaultFileSystemType:  "ext4"

# Partition table when nothing forces otherwise: GPT on UEFI (this ISO boots
# through signed shim), msdos on legacy BIOS.
defaultPartitionTableType: gpt

# Swap: none. A swapfile would sit on nirvana's encrypted system (fine), but
# root's live system has none anyway; no choice to make.
initialSwapChoice: none
userSwapChoices:
    - none

# Full erase AND manual partitioning are allowed; no "alongside" install.
allowManualPartitioning: true

# ── TWO SYSTEMS ON ONE DISK ─────────────────────────────────────────────────
#   EFI           clear  the first GRUB menu (osmo-grub-esp)
#   osmo-racine   clear  ROOT's system: the ISO image, booted live (RAM)
#   osmo-diffs    clear  the black box (records encrypted one by one)
#   /             LUKS1  NIRVANA's system: /, /boot and /home, read-write
#
# At boot GRUB asks nirvana's passphrase BEFORE anything: right, it opens the
# encrypted system and boots the kernel inside it (/crypto_keyfile.bin in its
# initramfs: luksbootkeyfile, no second passphrase); Enter or wrong: root's
# live system. Root changes only its own system: nirvana's kernel, initramfs
# and boot line are inside the volume, out of its reach.
#
# TICK « Encrypt system » on the erase page: without it there is a single
# clear system and no separation (osmo-grub-esp then leaves Ubuntu's menu).
#
# LUKS1, not LUKS2: GRUB opens the volume itself and has no Argon2 (LUKS2's
# key derivation). LUKS1 uses PBKDF2 - strong with a strong passphrase; GRUB
# takes 10-20 s to open it.
enableLuksAutomatedPartitioning: true
luksGeneration: luks1

# ── LAYOUT ───────────────────────────────────────────────────────────────
# osmo-racine: the squashfs (~7 GB) + kernel + live initrd, with room for a
# bigger image later. osmo-diffs: 5 GiB. / : the rest - /opt/GSM, docker
# images, the bench .debs, /home and pmbootstrap disk images.
partitionLayout:
    - name: "osmo-racine"
      filesystem: "ext4"
      mountPoint: "/var/lib/osmo-racine"
      size: 16GiB
      noEncrypt: true
    # osmo-diffs (configs/crypthome/osmo-diffs): the BLACK BOX - the text
    # diffs of the system, one record per boot, written at shutdown. Not LUKS:
    # every record is encrypted with age for a public key, so the box fills
    # itself without being opened; only its own passphrase reads it.
    - name: "osmo-diffs"
      filesystem: "ext4"
      mountPoint: "/var/lib/osmo-diffs"
      size: 5GiB
      noEncrypt: true
    - name: "osmo-egprs"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
      minSize: 30GiB
