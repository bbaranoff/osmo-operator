# =============================================================================
#  packagechooser@mirror - le miroir Ubuntu du systeme installe
# =============================================================================
#  [2026-09-04] archive.ubuntu.com repondait a 3 Ko/s depuis le banc quand les
#  miroirs francais servaient en 0,1 s. Le systeme installe garde le miroir de
#  la cle live (celui que build-iso.sh avait mesure a la fabrication) - sauf
#  si l operateur en choisit un autre ici. Calamares ne mesure rien : c est
#  osmo-install (le lanceur du live, build-iso.sh) qui REECRIT cette page a
#  chaque lancement avec packaging/apt-mirror.sh --list : une entree par miroir
#  qui repond, son temps de reponse, le plus rapide PRE-SELECTIONNE, et une
#  entree "celui de la cle" pour ne rien changer. Le remplacement lui-meme est
#  dans contextualprocess-mirror.conf, apres unpackfs, dans la cible.
---
mode: required
method: legacy
labels:
    step: "Miroir Ubuntu"
    step[fr]: "Miroir Ubuntu"
default: keep
items:
    - id: keep
      name: "Celui de la cle live"
      description: "Aucune mesure disponible : le systeme installe garde le miroir de la cle. @@MIRROR_STATE@@"
