# =============================================================================
#  packagechooser@mirror - Ubuntu mirror used by the installed system
# =============================================================================
#  The installed system keeps the live key's mirror (chosen by build-iso.sh at
#  build time) unless the operator picks another one on this page.
#  Calamares measures nothing: osmo-install (the live launcher, build-iso.sh)
#  REWRITES this page on each launch from packaging/apt-mirror.sh --list: one
#  entry per responding mirror with its response time, the fastest one
#  pre-selected, plus a "keep" entry that changes nothing. The actual
#  replacement is done in contextualprocess-mirror.conf, after unpackfs, in the
#  target.
---
mode: required
method: legacy
labels:
    step: "Miroir Ubuntu"
    step[fr]: "Miroir Ubuntu"
default: keep
items:
    - id: keep
      name: "Celui de la cle live"
      description: "Aucune mesure disponible : le systeme installe garde le miroir de la cle. @@MIRROR_STATE@@"
