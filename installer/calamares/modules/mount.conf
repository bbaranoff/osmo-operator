---
# [2026-09-04] "options" est une LISTE pour Calamares 3.3 (noble : 3.3.5) :
# main.py fait ",".join(options). Ecrit "options: bind" (la forme 3.2), il
# montait avec -o b,i,n,d, journalisait "Cannot mount /dev" et "Cannot mount
# /run/udev", et grub-install echouait dans la cible sur
#     failed to get canonical path of `/dev/sda1'
# - l installation se terminait sans chargeur de demarrage.
extraMounts:
    - device: proc
      fs:     proc
      mountPoint: /proc
    - device: sys
      fs:     sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs:     tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # [2026-09-02] Le bind /var/cache/osmo-debs -> /run/osmo-debs a ete retire :
    # rien, dans build-iso.sh, n'a jamais peuple ce repertoire. Le montage
    # echouait a chaque installation (Calamares l'avale) et shellprocess@grub
    # ne trouvait rien a faire. grub2-common et les binaires signes sont poses
    # DANS le rootfs par build-iso.sh, qui refuse de produire une ISO sans eux.
extraMountsEfi:
    - device: efivarfs
      fs:     efivarfs
      mountPoint: /sys/firmware/efi/efivars
