---
extraMounts:
    - device: proc
      fs:     proc
      mountPoint: /proc
    - device: sys
      fs:     sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: bind
    - device: tmpfs
      fs:     tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: bind
    # ── LES .deb DE GRUB, VISIBLES DEPUIS L'INTERIEUR DE LA CIBLE ───────────
    # Le module bootloader lance grub-install DANS le systeme installe. Si le
    # squashfs de l'ISO n'a pas grub2-common, il n'y a pas de grub-install et
    # l'installation meurt sur « code d'erreur 127 », disque deja rempli.
    # shellprocess@grub repare ca en installant les .deb -- encore faut-il
    # qu'il les VOIE, et il tourne chroote.
    #
    # PREMIERE TENTATIVE, ECARTEE : une instance shellprocess dontChroot: true
    # qui copiait les fichiers depuis l'hote. Le journal de l'installateur
    # montre qu'elle a tourne DANS la cible malgre le reglage -- garde `ls`
    # negatif, sortie vide, et l'erreur 127 juste apres. On ne se fie donc plus
    # a dontChroot : un bind, lui, est monte par le module `mount` avant
    # unpackfs et se voit des deux cotes, exactement comme /run/udev au-dessus.
    #
    # Repertoire absent (ISO reconstruite, qui a les paquets dans son rootfs) :
    # le montage echoue, Calamares continue, et shellprocess@grub ne trouve
    # rien a faire. C'est le comportement voulu.
    - device: /var/cache/osmo-debs
      mountPoint: /run/osmo-debs
      options: bind
extraMountsEfi:
    - device: efivarfs
      fs:     efivarfs
      mountPoint: /sys/firmware/efi/efivars
