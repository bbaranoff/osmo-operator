---
# mount.conf - extra mounts set up inside the target before the chroot steps.
# "options" is a LIST for Calamares 3.3 (noble: 3.3.5): main.py does
# ",".join(options). The 3.2 form "options: bind" mounts with -o b,i,n,d and
# grub-install then fails in the target.
extraMounts:
    - device: proc
      fs:     proc
      mountPoint: /proc
    - device: sys
      fs:     sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs:     tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
extraMountsEfi:
    - device: efivarfs
      fs:     efivarfs
      mountPoint: /sys/firmware/efi/efivars
