---
# packagechooser@supplements - addition.sh supplements in the installer: the same
# five choices as its zenity dialog (same keys), as checkboxes. They are installed
# at FIRST BOOT once the network is up (osmo-supplements.service), not during
# Calamares (the operator image is ~11 GB and the firmwares take long to build).
# The osmosupplements job (installer/calamares/jobs) writes the choices to
# /etc/osmo-supplements in the target.
mode: optionalmultiple
method: legacy
labels:
    step: "Supplements"
    step[fr]: "Supplements"
items:
    - id: multi
      name: "Docker et multi-operateur SS7"
      description: "docker.io, l image operateur (~11 Go, origine choisie a la page suivante) et la topologie op1 natif + op2/op3 docker + inter-STP."
    - id: opencl
      name: "OpenCL (calcul GPU)"
      description: "Runtime ICD, clinfo, le pilote de la carte detectee (Intel / Mesa-AMD, pocl en repli) et les outils de calcul GPU du banc."
    - id: claude
      name: "Claude Code"
      description: "La CLI de l assistant IA (installeur natif claude.ai/install.sh), lancee ensuite avec la commande claude."
    - id: firmwares
      name: "Firmwares telephone"
      description: "gnuarm (arm-elf-gcc 4.5.2), FreeCalypso Magnetite, osmocom-bb-trx, Fernvale MT6260, documentation SIMCom. Long : plusieurs Go et des compilations."
    - id: extras
      name: "Jeux et media"
      description: "Doom, Quake III (OpenArena), Kodi, YouTube (Firefox + uBlock Origin), Wireshark root, Linphone."
