# contextualprocess@tpm - writes the « Demarrage » choice into the target:
# /etc/osmo-porte/mode = porte | grub, read by osmo-grub-esp
# (shellprocess-osmo.conf, after this).
---
dontChroot: false
timeout: 60
packagechooser_tpm:
    "porte":
        - "-/bin/bash -c \"mkdir -p /etc/osmo-porte && echo porte > /etc/osmo-porte/mode\""
    "grub":
        - "-/bin/bash -c \"mkdir -p /etc/osmo-porte && echo grub > /etc/osmo-porte/mode\""
