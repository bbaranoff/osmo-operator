# tools/features.conf - optional groups and their dependency tree
# =============================================================================
# kind|id|depends|description         (read by tools/features.sh)
#
#   docker  a component of the Dockerfile: OSMO_WITH_<ID>=0|1
#   lib     a component built only when a selected id depends on it
#   alias   old group names standing for several components
#   iso     an optional iso_modules/NN-<id>.sh (build-iso.sh --modules/--skip)
#   core    a mandatory iso module: shown in the tree, never deselected
#
# depends = what the id NEEDS (space separated). Deselecting an id deselects
# everything that depends on it, transitively; selecting one selects its
# dependencies. Traced from the modules themselves (functions, variables
# under set -u, files written into $ROOTFS, systemd units):
#   - 91-secure-boot WRITES the ISO (90-iso only prepares $ISOROOT);
#   - 86-finitions is the only one that unmounts what 80-chroot mounted;
#   - 52-qemu deletes the image's osmocom user, 84-comptes recreates it;
#   - 52-qemu calls apply_native_post_patches, loaded by 30-image-configs;
#   - 88-lte-pmos checks osmo-banc.service/osmo-lte.service (82-services),
#     launch.sh (51-depot) and /home/osmocom (84-comptes).
# =============================================================================

# ── Components of the docker image (Dockerfile, build.sh --without=...) ─────
# docker = chosen in the menu ; lib = built only if a chosen one needs it.
docker|gapk||osmo-gapk +hr : vocodeur sur l'hote (start.sh --gapk, transcodeur --hr)
docker|smsc||gsup-smsc-proto : proto-SMSC relie a OsmoHLR en GSUP
docker|sms_coding_utils||sms-coding-utils : outils PDU SMS (FreeCalypso)
docker|transceiver|libosmo_dsp|osmocom-bb transceiver : le Calypso TRX de start.sh --bts
docker|burst_ind|libosmo_dsp|osmocom-bb burst_ind : ccch_scan, bcch_scan, cell_log
lib|libosmo_dsp||libosmo-dsp
docker|grgsm_exe|gnuradio|couche 1 gr-gsm hors QEMU (start.sh --grgsm)
lib|gnuradio||GNU Radio 3.10 + gr-osmosdr + gr-gsm dans /root/.env
docker|lte||4G : srsRAN ZeroMQ + Open5GS (osmo-lte, osmo-epc)
docker|pmbootstrap||telephone postmarketOS : pmbootstrap patche (VM du banc)
docker|egprs_web|node|tableau de bord web osmo-egprs-web (:8080)
lib|node||Node 22 (/opt/node)
docker|tncattach||le RNode Heltec V3 en interface tnc0 (--lora, LORA_MODE=ip)
docker|rns||Reticulum (rns, rnodeconf, pyserial) dans /root/.env (--lora)

# ── Old group names (build.sh / build-iso.sh --without=grgsm,...) ──────────
alias|grgsm|grgsm_exe|GNU Radio + gr-gsm + grgsm_exe
alias|web|egprs_web|Node + tableau de bord
alias|reticulum|tncattach rns|lien LoRa
alias|4g|lte pmbootstrap|4G et telephone postmarketOS

# ── Mandatory iso modules (a bootable ISO needs every one of them) ─────────
core|options||00 options, suite Ubuntu, droits root
core|hote|options|20 paquets de l'hote (squashfs, xorriso, grub, shim)
core|docker-build|hote|21 image docker source (pull ou build.sh), nom de sortie
core|wan-table|hote|22 repertoires de travail, piege de nettoyage, table WAN
core|image-configs|docker-build wan-table|30 configs generees (start-docker.sh)
core|image-source|image-configs|31 image source de l'ISO, controle de la suite
core|rootfs|wan-table|40 debootstrap (ou rootfs herite)
core|chroot|rootfs|80 rootfs : apt, noyau, live-boot (bureau si --desktop)
core|arm-natif|chroot|82 arm64 : compilation native dans le chroot arm64 (--arm)
core|finitions|chroot|86 live-boot toram, plymouth, grub, DEMONTAGE du chroot
core|iso|finitions|90 squashfs, noyau, menu GRUB
core|secure-boot|iso|91 ecrit l'ISO (shim + grub signes, ou grub-mkrescue)
core|rpi-image|finitions|92 arm64 : image SD Raspberry Pi 4 (.img, --arm)
core|fin|secure-boot|99 bilan, passage du rootfs aux passes suivantes (--all)

# ── Optional iso modules ────────────────────────────────────────────────────
iso|clavier||10 disposition clavier (question interactive ; sinon --kb, defaut fr)
iso|stockage-docker||20 stockage docker de l'hote hors overlayfs
iso|injection-image||50 binaires, libs, /opt/GSM, venv et configs de l'image docker
iso|depot||51 arbre /opt/GSM/osmo-operator a jour, coeur.env
iso|softsim||51 softSIM (SIM par SAP), pySim, lecteur de carte
iso|comptes||84 comptes, autologin console/bureau, linphone
iso|qemu|injection-image depot comptes|52 QEMU Calypso, firmware, toast, lanceurs, configs
iso|dashboard|egprs_web|60 tableau de bord web (osmo-egprs-web)
iso|scripts|depot|70 scripts du projet, WAN, NetworkManager
iso|debs-banc|injection-image qemu|71 .deb du banc embarques (/var/cache/osmo-debs)
iso|ttcn||80 suites TTCN-3 Osmocom + Eclipse TITAN
iso|cloture-systeme||81 fermeture ldd, reseau, DNS, osmo-update, osmo-ip-plan
iso|services|depot|82 services osmo-* (banc, multi, lte, pulse, asterisk, dashboard)
iso|espace-ram||83 fstab, /tmp, journal, logrotate, purge, ssh
iso|extensions-gnome||85 extensions GNOME Shell (--desktop)
iso|installeur-bureau|depot comptes|85 installateur Calamares, osmo-install, icones du bureau
iso|lite|injection-image|87 elagage de l'ISO lite (--lite)
iso|lte-pmos|lte pmbootstrap depot services comptes|88 4G (srsRAN + Open5GS) et telephone postmarketOS
iso|apt-release||89 la release GitHub comme source apt : ce qui n'est pas dans l'image s'installe par apt
iso|home-chiffre|comptes installeur-bureau|89 second disque chiffre sur /home
