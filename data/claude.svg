    <use href="#rs" transform="rotate(90)"/>
    <use href="#rl" transform="rotate(120)"/>
    <use href="#rs" transform="rotate(150)"/>
    <use href="#rl" transform="rotate(180)"/>
    <use href="#rs" transform="rotate(210)"/>
    <use href="#rl" transform="rotate(240)"/>
    <use href="#rs" transform="rotate(270)"/>
    <use href="#rl" transform="rotate(300)"/>
    <use href="#rs" transform="rotate(330)"/>
    <circle r="17"/>
