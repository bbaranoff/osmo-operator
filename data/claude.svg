<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Icone Claude : tuile clay (#D97757) + sunburst Anthropic creme -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#D97757"/>
  <g transform="translate(128,128)" fill="#F5EFE6">
    <!-- rayon long et rayon court, alternes, pointe vers l exterieur -->
    <path id="rl" d="M0,-96 L7,-16 L-7,-16 Z"/>
    <path id="rs" d="M0,-74 L6,-14 L-6,-14 Z"/>
    <use href="#rl" transform="rotate(0)"/>
