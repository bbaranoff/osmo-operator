<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- ⚠️ CE COMMENTAIRE EST *DANS* <svg>, ET IL DOIT Y RESTER.
     gdk-pixbuf ne RENIFLE le type d un fichier que sur ses ~256 premiers
     octets : il y cherche la balise <svg. Un commentaire d en-tete un peu
     long la repousse au-dela, et le chargeur repond alors
         Couldn't recognize the image file format
     sur un SVG parfaitement valide - `file` le reconnait, un parseur XML
     l accepte, et l icone se remplace quand meme par la page blanche
     generique sur le bureau. Constate le 31/08 sur les trois icones.
     Tout texte d explication va donc APRES la balise ouvrante. -->
<!-- osmo-multi.svg - icone du lancement multi-operateur (start-multi.sh).
     Meme facture que osmo-launch.svg / osmo-tutorial.svg : pastille + glyphe
     blanc, pour que les trois se lisent comme une famille sur le bureau.
     Antenne bleue : c est le SS7 entre noeuds, pas un appel. -->
  <defs>
    <linearGradient id="corpsM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2f9fd6"/>
      <stop offset="100%" stop-color="#0d5f8f"/>
    </linearGradient>
    <linearGradient id="brillanceM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="14" ry="14" fill="url(#corpsM)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" ry="14" fill="url(#brillanceM)"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="13.5" ry="13.5"
        fill="none" stroke="#08405f" stroke-width="1.5" opacity="0.55"/>

  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- Ondes, deux paires : l antenne rayonne des DEUX cotes, c est ce qui
         la distingue d un simple pylone et dit le lien entre noeuds. -->
    <path d="M 22.5 20.5 a 13 13 0 0 0 0 17"  stroke-width="3"/>
    <path d="M 41.5 20.5 a 13 13 0 0 1 0 17"  stroke-width="3"/>
    <path d="M 16.5 15.5 a 21 21 0 0 0 0 27"  stroke-width="3" opacity="0.55"/>
    <path d="M 47.5 15.5 a 21 21 0 0 1 0 27"  stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Mat + embase -->
  <circle cx="32" cy="26" r="4.2" fill="#ffffff"/>
  <path fill="#ffffff" d="M 30.4 30.2 h 3.2 l 3.0 20.4 h -4.0 l -0.6 -5.6 h -0.0
                          l -0.6 5.6 h -4.0 z"/>
</svg>
