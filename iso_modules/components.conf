# iso_modules/components.conf - components of the chroot step (80-chroot.d/).
# nom|CLASSE|description
#
# CLASSE:
#   CRITIQUE   its failure stops the build (the job fails)
#   OPTIONNEL  its failure is recorded in /var/log/osmo-build/status.json (in
#              the ISO), in the workflow logs and in the release notes; the
#              build goes on without it
# A component missing from this list is OPTIONNEL. Every fragment of
# 80-chroot.d/ (fragment:NN-xxx) is CRITIQUE: it runs under set -e.
# To make an optional component mandatory, change its class here.
depot-nodesource|OPTIONNEL|cle du depot NodeSource (repli : setup_22.x apres l install)
depot-mongodb|OPTIONNEL|depot MongoDB 8.0 (base d abonnes Open5GS)
sim|OPTIONNEL|lecteur PC/SC, pySim, softSIM en lecteur (tools/osmo-sim-install.sh)
gnuradio-builddep|OPTIONNEL|dependances de compilation de GNU Radio (apt build-dep)
venv-tomli|OPTIONNEL|tomli dans /root/.env
venv-numpy|OPTIONNEL|numpy 1.x dans /root/.env (GNU Radio, gr-gsm)
web-npm|OPTIONNEL|npm install de osmo-egprs-web
dashboard|OPTIONNEL|tableau de bord web (install-web-service.sh)
firefox|OPTIONNEL|Firefox, deb Mozilla (desktop)
firefox-l10n|OPTIONNEL|langue de Firefox suivant --kb (desktop)
pulseaudio|OPTIONNEL|pulseaudio systeme remis apres le bureau (desktop)
extras|OPTIONNEL|extras media (tools/osmo-extras-install.sh, desktop)
schemas-gnome|OPTIONNEL|compilation des gschema (reglages GNOME du banc, desktop)
dumpcap-caps|OPTIONNEL|capacites reseau de dumpcap (capture sans root)
