name: Docker (GHCR)

# Trois images publiees :
#
#   interstp            le hub SS7 seul (Dockerfile.stp) - osmo-stp et sa table
#                       de routage, rien d'autre. Independante : elle ne part
#                       pas de osmocom-nitb, donc elle sort en minutes.
#   osmo-operator       un noeud complet (Dockerfile.run, qui part de
#                       osmocom-nitb) : HLR, MSC, BSC, PCU, BTS, Asterisk, QEMU.
#   osmo-operator-lite  la meme pile, sans les arbres de sources de /opt/GSM
#                       (Dockerfile.lite) - ~4 Go de moins sur 11.
#
# Pourquoi `docker build` en clair plutot que build-push-action : Dockerfile.run
# et Dockerfile.lite font `FROM osmocom-nitb`, une image LOCALE. Le driver
# docker-container de buildx ne la voit pas, et le build echoue sur un FROM
# introuvable. En sequentiel avec le docker du runner, chaque etage trouve celui
# d'en dessous.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── Le hub : rapide, independant, donc en premier et en parallele ──────────
  interstp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules ; github.repository
      # garde la casse du proprietaire.
      - name: Image name
        id: img
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build interstp
        run: |
          docker build -f Dockerfile.stp -t interstp:ci .
          docker images interstp:ci --format '  {{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Push interstp
        if: github.event_name != 'pull_request'
        env:
          IMG: ${{ env.REGISTRY }}/${{ steps.img.outputs.repo }}/interstp
        run: |
          TAGS="sha-${GITHUB_SHA::7}"
          [ "${GITHUB_REF_TYPE}" = "tag" ]    && TAGS="$TAGS ${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_NAME}" = "main" ]   && TAGS="$TAGS latest"
          for t in $TAGS; do
            docker tag interstp:ci "$IMG:$t"
            docker push "$IMG:$t"
          done

  # ── Le noeud, et sa version allegee ───────────────────────────────────────
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # osmocom-nitb pese ~11 Go : sans ce menage, le runner sature en plein
      # build et l'erreur ne parle que d'une couche qu'il n'a pas pu ecrire.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo apt-get remove -y '^dotnet-.*' 'php.*' 'mongodb.*' \
            'mysql.*' azure-cli google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y && sudo apt-get clean
          # le runner arrive avec plusieurs images deja tirees : autant de Go
          # occupes dans /var/lib/docker dont ce build n'a aucun usage.
          docker system prune -af --volumes
          df -h / /mnt

      # LA correction du exit 143. /var/lib/docker vit sur / , qui n'offre
      # qu'une trentaine de Go libres. A "exporting layers" buildkit detient en
      # meme temps ses 75 snapshots ET ecrit l'image finale : deux fois 11 Go.
      # Le disque sature, le runner part avant dockerd, et l'etape recoit un
      # SIGTERM au lieu d'un "no space left on device". /mnt est un second
      # disque d'environ 70 Go quasiment vide - c'est la que docker doit vivre.
      - name: Move docker data-root to /mnt
        run: |
          # si le runner n'expose pas de disque ephemere, on ne deplace rien :
          # mieux vaut le build d'avant que docker sur un /mnt qui est en fait /.
          AVAIL=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          if [ "${AVAIL:-0}" -lt 40 ]; then
            echo "/mnt indisponible ou trop petit (${AVAIL:-0} Go) - on reste sur /"
            df -h /; exit 0
          fi
          sudo systemctl stop docker.service docker.socket
          sudo mkdir -p /mnt/docker
          sudo mv /var/lib/docker/* /mnt/docker/ 2>/dev/null || true
          # daemon.json existe deja sur le runner : on ajoute la cle, on ne
          # remplace pas le fichier.
          sudo jq '. + {"data-root":"/mnt/docker"}' /etc/docker/daemon.json \
            > /tmp/daemon.json 2>/dev/null \
            || echo '{"data-root":"/mnt/docker"}' > /tmp/daemon.json
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl start docker.service
          docker info -f 'data-root = {{.DockerRootDir}}'
          df -h / /mnt

      # Trace de l'occupation disque pendant toute la duree du job : si un jour
      # ca retombe, la ligne d'avant le SIGTERM dira si c'etait encore le disque.
      - name: Disk watchdog
        run: |
          nohup bash -c 'while true; do
            echo "$(date +%T)  / $(df -h --output=avail / | tail -1)  /mnt $(df -h --output=avail /mnt | tail -1)  mem $(free -m | awk "/Mem:/{print \$7}")M"
            sleep 30
          done' > /tmp/disk.log 2>&1 &

      - name: Image name
        id: img
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'etage du bas : toute la compilation. C'est lui qui prend les heures.
      - name: Build osmocom-nitb (base)
        run: |
          docker build -t osmocom-nitb .
          # les snapshots buildkit font double emploi avec l'image maintenant
          # exportee ; les etages suivants partent de l'image, pas du cache.
          docker builder prune -af
          df -h / /mnt

      - name: Build osmo-operator
        run: |
          docker build -f Dockerfile.run -t osmo-operator:ci .
          docker builder prune -af
          docker images --format '  {{.Repository}}:{{.Tag}} {{.Size}}' | head -5
          df -h / /mnt

      # osmo-operator part vers GHCR tout de suite : garder trois images
      # completes en meme temps sur le disque n'a aucun interet, et l'image
      # lite qui suit a besoin de la place (FROM scratch + COPY / = une copie
      # entiere de plus).
      - name: Push osmo-operator
        if: github.event_name != 'pull_request'
        env:
          BASE: ${{ env.REGISTRY }}/${{ steps.img.outputs.repo }}
        run: |
          TAGS="sha-${GITHUB_SHA::7}"
          [ "${GITHUB_REF_TYPE}" = "tag" ]  && TAGS="$TAGS ${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_NAME}" = "main" ] && TAGS="$TAGS latest"
          for t in $TAGS; do
            docker tag osmo-operator:ci "$BASE/osmo-operator:$t"
            docker push "$BASE/osmo-operator:$t"
            docker image rm "$BASE/osmo-operator:$t"
          done
          docker image rm osmo-operator:ci || true
          df -h / /mnt

      # L'image lite se deduit de la base : Dockerfile.lite elague /opt/GSM puis
      # aplatit le resultat (effacer dans une couche de plus ne rend rien).
      - name: Build osmo-operator-lite
        run: |
          docker build -f Dockerfile.lite --build-arg BASE=osmocom-nitb \
                       -t osmo-operator-lite:ci .
          echo "--- tailles comparees ---"
          docker images --format '  {{.Repository}}:{{.Tag}}\t{{.Size}}' \
            | grep -E 'osmocom-nitb|osmo-operator' || true
          df -h / /mnt

      - name: Push osmo-operator-lite
        if: github.event_name != 'pull_request'
        env:
          BASE: ${{ env.REGISTRY }}/${{ steps.img.outputs.repo }}
        run: |
          TAGS="sha-${GITHUB_SHA::7}"
          [ "${GITHUB_REF_TYPE}" = "tag" ]  && TAGS="$TAGS ${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_NAME}" = "main" ] && TAGS="$TAGS latest"
          for t in $TAGS; do
            docker tag osmo-operator-lite:ci "$BASE/osmo-operator-lite:$t"
            docker push "$BASE/osmo-operator-lite:$t"
          done

      # Meme quand le job tombe - surtout quand il tombe.
      - name: Disk report
        if: always()
        run: |
          tail -40 /tmp/disk.log || true
          df -h / /mnt || true
