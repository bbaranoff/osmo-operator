name: Docker (GHCR)

# Quatre images publiees :
#
#   osmocom-nitb        l'image de BASE (Dockerfile) : toute la compilation,
#                       ~11 Go. Elle n'est PLUS rebatie a chaque push - voir le
#                       job `base` plus bas.
#   interstp            le hub SS7 seul (Dockerfile.stp) - osmo-stp et sa table
#                       de routage, rien d'autre. Independante : elle ne part
#                       pas de osmocom-nitb, donc elle sort en minutes.
#   osmo-operator       un noeud complet (Dockerfile.run, qui part de
#                       osmocom-nitb) : HLR, MSC, BSC, PCU, BTS, Asterisk, QEMU.
#   osmo-operator-lite  la meme pile, sans les arbres de sources de /opt/GSM
#                       (Dockerfile.lite) - ~4 Go de moins sur 11.
#
# ── Pourquoi cette structure ────────────────────────────────────────────────
# [2026-09-13] Avant, un seul job enchainait les trois builds sur un runner, et
# recompilait donc l'image de base a chaque push : 1h23, plus un disque sature
# en « exporting layers » (exit 143, un SIGTERM du runner a bout d'espace).
# Maintenant :
#   1. `base` calcule une EMPREINTE de tout ce que le Dockerfile prend dans le
#      contexte. Si ghcr.io/<depot>/osmocom-nitb:base-<empreinte> existe deja,
#      il ne construit RIEN et se contente de la publier comme reference.
#   2. Sinon il construit, avec deux caches : les couches de la derniere base
#      publiee (--cache-from registry + --cache-to inline) et les .deb deja
#      compiles (actions/cache sur /var/cache/osmo-debs, le mecanisme de
#      packaging/osmo-deb.sh). Un changement en fin de Dockerfile ne recompile
#      plus que sa queue.
#   3. `operator` et `lite` partent de cette image, en parallele, chacun sur
#      son runner - donc chacun avec un disque propre.
#
# ── Et pourquoi buildx --push partout ──────────────────────────────────────
# [2026-09-13] Les trois jobs poussent leur image SANS jamais la charger dans
# le docker du runner. `docker build -t X . && docker push X` demande a
# buildkit d'exporter l'image dans le store local : il detient alors ses
# snapshots ET ecrit par-dessus les archives de couches, soit deux fois 11 Go.
# C'est la, en « exporting layers » - build reussi, 75 etapes sur 75 - que le
# runner saturait et se faisait tuer (exit 143). Avec
# `docker buildx build --push`, les couches sont compressees et poussees au
# fil de l'eau ; il ne reste sur le disque que le cache du builder.
#
# Consequence a ne pas perdre de vue : plus aucune image locale apres le
# build, donc plus de `docker create` + `docker cp` pour recuperer les .deb
# compiles. C'est le role de l'etape `debs` du Dockerfile (une seconde passe
# `--target debs --output type=local`, tout en cache). Et parce que `debs` est
# desormais la DERNIERE etape du Dockerfile, tout build de la base doit dire
# `--target osmocom-nitb` : ici, dans build.sh, dans compose.yaml et dans
# iso_modules/21-docker-build.sh.
#
# Dockerfile.run et Dockerfile.lite ont un `ARG BASE` : en local ils valent
# toujours `osmocom-nitb` (l'image du docker de l'hote), en CI ils recoivent la
# reference GHCR. build.sh n'est pas concerne.
#
# Sur une pull_request, rien n'est publie (le GITHUB_TOKEN d'un fork n'a pas
# packages:write) : `base` construit pour valider le Dockerfile, et les deux
# jobs derives ne tournent pas.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "Reconstruire l'image de base meme si l'empreinte existe deja"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── L'image de base : construite seulement si son contexte a bouge ─────────
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      repo:  ${{ steps.img.outputs.repo }}
      image: ${{ steps.key.outputs.image }}
      hit:   ${{ steps.probe.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules ; github.repository
      # garde la casse du proprietaire.
      - name: Image name
        id: img
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # L'EMPREINTE. Tout ce que Dockerfile prend dans le contexte de build -
      # lui-meme, packaging/, patches/, et les dossiers qu'il COPY (configs,
      # scripts, services, helpers, opt-gsm, tools). Pas .deb-cache/ : c'est un
      # cache, son contenu ne definit pas l'image.
      # `git ls-files` et non `find` : ce qui n'est pas versionne n'entre pas
      # dans l'image de toute facon, et l'ordre est stable.
      - name: Empreinte du contexte de base
        id: key
        run: |
          KEY=$(git ls-files -- Dockerfile packaging configs scripts services \
                                helpers opt-gsm tools patches \
                | sort | xargs sha256sum | sha256sum | cut -c1-16)
          REPO='${{ steps.img.outputs.repo }}'
          echo "key=$KEY"                                              >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${REPO}/osmocom-nitb:base-${KEY}"    >> "$GITHUB_OUTPUT"
          echo "cache=${REGISTRY}/${REPO}/osmocom-nitb:cache"          >> "$GITHUB_OUTPUT"
          echo "Empreinte du contexte : $KEY"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le manifeste suffit : pas besoin de tirer 11 Go pour savoir si l'image
      # est la. Un `rebuild_base` coche force la reconstruction.
      - name: L'image de base existe-t-elle deja ?
        id: probe
        run: |
          HIT=false
          if [ "${{ github.event.inputs.rebuild_base }}" != "true" ] \
             && [ "${{ github.event_name }}" != "pull_request" ] \
             && docker manifest inspect '${{ steps.key.outputs.image }}' >/dev/null 2>&1; then
            HIT=true
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"
          if [ "$HIT" = true ]; then
            echo "::notice::Base inchangee, deja publiee : ${{ steps.key.outputs.image }} - rien a construire."
          else
            echo "::notice::Base absente ou forcee : construction."
          fi

      # ── A partir d'ici, uniquement quand il faut vraiment construire ───────

      # Menage du runner + /var/lib/docker sur /mnt, avec verification et
      # echec immediat s'il n'y a la place nulle part. Trois jobs en ont
      # besoin, d'ou l'action locale plutot qu'un bloc recopie trois fois.
      - name: Disque pour docker
        if: steps.probe.outputs.hit != 'true'
        uses: ./.github/actions/docker-disk

      # buildx/docker-container : le driver qui sait ecrire AILLEURS que dans
      # le store d'images local - voir le step de build. Apres le deplacement
      # du data-root, jamais avant : le redemarrage du demon laisserait le
      # conteneur du builder orphelin.
      - name: Buildx
        if: steps.probe.outputs.hit != 'true'
        uses: docker/setup-buildx-action@v3

      # ── Le cache .deb entre deux runs ─────────────────────────────────────
      # Ce que le Dockerfile compile sort en paquet .deb dans
      # /var/cache/osmo-debs (packaging/osmo-deb.sh), et il le relit par
      # `COPY .deb-cache/ /var/cache/osmo-debs/`. Sur l'hote, build.sh fait la
      # navette entre les deux ; ici on n'appelle pas build.sh, donc on la fait
      # a la main dans le step de build. Les .deb sont indexes par nom et
      # version : contrairement au cache de couches, ce cache-la survit a une
      # modification du Dockerfile.
      # OSMO_DEB_REFRESH n'est pas passe : son defaut (Dockerfile:166) est 0,
      # donc le cache est utilise. Ne pas y toucher ici.
      - name: Preparer le cache .deb
        if: steps.probe.outputs.hit != 'true'
        run: |
          sudo mkdir -p /var/cache/osmo-debs
          sudo chown -R "$(id -u):$(id -g)" /var/cache/osmo-debs

      - name: Cache .deb (osmo-deb)
        if: steps.probe.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: /var/cache/osmo-debs
          # CLE = L'EMPREINTE DU CONTEXTE, pas le numero du run.
          # [2026-09-13] C'etait `${{ github.run_id }}`, donc une entree NEUVE a
          # chaque passage. A 2-4 Go l'entree et 10 Go de quota par depot,
          # l'eviction LRU detruisait le cache au bout de trois runs - et tous
          # les autres caches du depot avec. Avec l'empreinte : contexte
          # inchange, la cle est deja la, rien n'est reecrit ; contexte change,
          # une seule entree s'ajoute. Le prefixe reprend la plus recente.
          key: osmo-debs-noble-${{ steps.key.outputs.key }}
          restore-keys: |
            osmo-debs-noble-

      - name: Temoin disque
        if: steps.probe.outputs.hit != 'true'
        run: |
          nohup bash -c 'while true; do
            echo "$(date -u +%H:%M:%S)  / $(df -h --output=avail / | tail -1 | tr -d " ")  /mnt $(df -h --output=avail /mnt | tail -1 | tr -d " ")  mem $(free -m | awk "/^Mem:/{print \$7}")Mo"
            sleep 30
          done' > "$RUNNER_TEMP/watchdog.log" 2>&1 &
          echo "temoin -> $RUNNER_TEMP/watchdog.log"

      # ── LE BUILD. Vers GHCR directement, jamais dans le docker local ──────
      # [2026-09-13] C'etait `docker build -t ... .` puis `docker push`. Le
      # `-t` impose a buildkit d'EXPORTER l'image dans le store local : a ce
      # moment il detient ses snapshots (11 Go) et ecrit par-dessus les
      # archives de couches (11 Go de plus). C'est exactement la, en
      # « exporting layers », que le runner saturait et se faisait tuer -
      # exit 143, apres 1h20 de compilation reussie.
      #
      # `--push` (soit --output type=image,push=true) supprime cette moitie-la
      # du probleme : les couches sont compressees et poussees au fil de l'eau,
      # rien n'atterrit dans le store local. Il ne reste que le cache du
      # builder. Corollaire : plus aucune image `osmocom-nitb` sur le runner
      # apres le build - d'ou l'etape `debs` du Dockerfile pour la recolte.
      - name: Build et push osmocom-nitb (base)
        if: steps.probe.outputs.hit != 'true'
        env:
          IMAGE: ${{ steps.key.outputs.image }}
          CACHE: ${{ steps.key.outputs.cache }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          # Semer le contexte avec les .deb du cache : chaque etape qui les
          # trouve pose le paquet au lieu de cloner et compiler.
          mkdir -p .deb-cache
          cp -f /var/cache/osmo-debs/osmo-build-*.deb .deb-cache/ 2>/dev/null || true
          echo "cache .deb en entree : $(find .deb-cache -name 'osmo-build-*.deb' | wc -l) paquets"

          # base-<empreinte> est ce que les jobs derives tirent ; :cache et
          # :latest sont les deux commodites - l'un pour le --cache-from du
          # prochain build, l'autre pour qui veut « la derniere ». Les trois
          # noms sortent d'UN push : memes digests, les couches ne montent
          # qu'une fois.
          # Sur une pull_request rien n'est publie (le GITHUB_TOKEN d'un fork
          # n'a pas packages:write) : on batit pour valider le Dockerfile et on
          # garde le resultat dans le cache du builder, sans export ni nom.
          if [ "$PR" = true ]; then
            TAGS=(); OUT=(--output type=cacheonly)
          else
            BASE_REPO="${CACHE%:cache}"
            TAGS=(-t "$IMAGE" -t "$CACHE")
            [ "$GITHUB_REF_NAME" = "main" ] && TAGS+=(-t "$BASE_REPO:latest")
            OUT=(--push)
          fi

          # --target : Dockerfile finit par l'etape `debs`, pas par osmocom-nitb.
          # --cache-to inline : les metadonnees de cache voyagent DANS le
          # manifeste pousse, ce qui rend le --cache-from du prochain run
          # possible sans second depot de cache a gerer.
          docker buildx build \
            --target osmocom-nitb \
            --cache-from "type=registry,ref=$CACHE" \
            --cache-to   type=inline \
            "${TAGS[@]+"${TAGS[@]}"}" "${OUT[@]}" \
            -f Dockerfile .

          # Recolte des .deb : seconde passe sur l'etape `debs`. Le CONTEXTE
          # N'A PAS BOUGE (on ne vide .deb-cache/ qu'apres) donc les 75 etapes
          # sont toutes en cache dans le builder ; seul le COPY final tourne,
          # et n'ecrit sur le disque que les paquets. Equivalent sans image
          # locale de debs_from_image() (build.sh:306).
          rm -rf /tmp/debs-out && mkdir -p /tmp/debs-out
          docker buildx build \
            --target debs \
            --cache-from "type=registry,ref=$CACHE" \
            --output "type=local,dest=/tmp/debs-out" \
            -f Dockerfile .
          cp -f /tmp/debs-out/osmo-build-*.deb /var/cache/osmo-debs/ 2>/dev/null || true
          rm -rf /tmp/debs-out .deb-cache/*.deb
          echo "cache .deb en sortie : $(find /var/cache/osmo-debs -name 'osmo-build-*.deb' | wc -l) paquets, $(du -sh /var/cache/osmo-debs | cut -f1)"
          df -h / /mnt

      - name: Temoin - dernieres mesures
        if: always()
        run: tail -40 "$RUNNER_TEMP/watchdog.log" 2>/dev/null || echo "(pas de temoin)"

  # ── Le hub : rapide, independant, donc en parallele du reste ───────────────
  interstp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: img
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build interstp
        run: |
          docker build -f Dockerfile.stp -t interstp:ci .
          docker images interstp:ci --format '  {{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Push interstp
        if: github.event_name != 'pull_request'
        env:
          IMG: ${{ env.REGISTRY }}/${{ steps.img.outputs.repo }}/interstp
        run: |
          TAGS="sha-${GITHUB_SHA::7}"
          [ "${GITHUB_REF_TYPE}" = "tag" ]    && TAGS="$TAGS ${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_NAME}" = "main" ]   && TAGS="$TAGS latest"
          for t in $TAGS; do
            docker tag interstp:ci "$IMG:$t"
            docker push "$IMG:$t"
          done

  # ── Les deux derivees : en parallele, chacune sur un runner neuf ───────────
  # Quelques minutes chacune - elles ne compilent rien, elles rafraichissent des
  # COPY par-dessus une base deja construite.
  operator:
    needs: base
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disque pour docker
        uses: ./.github/actions/docker-disk

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Meme principe que la base : buildx pousse les couches vers GHCR sans
      # jamais materialiser l'image dans le store local. Le `docker pull` du
      # BASE disparait avec, buildkit ne tire que ce dont le build a besoin ;
      # et les couches heritees de la base sont MONTEES d'un depot a l'autre
      # (cross-repo blob mount, meme registre), donc la poussee ne renvoie que
      # les couches propres a Dockerfile.run.
      - name: Build et push osmo-operator
        env:
          BASE_IMAGE: ${{ needs.base.outputs.image }}
          IMG: ${{ env.REGISTRY }}/${{ needs.base.outputs.repo }}/osmo-operator
        run: |
          TAGS=(-t "$IMG:sha-${GITHUB_SHA::7}")
          [ "${GITHUB_REF_TYPE}" = "tag" ]  && TAGS+=(-t "$IMG:${GITHUB_REF_NAME}")
          [ "${GITHUB_REF_NAME}" = "main" ] && TAGS+=(-t "$IMG:latest")
          docker buildx build -f Dockerfile.run \
            --build-arg BASE="$BASE_IMAGE" \
            "${TAGS[@]}" --push .
          docker buildx imagetools inspect "$IMG:sha-${GITHUB_SHA::7}" \
            --format '{{.Manifest.Config.Digest}}  {{len .Manifest.Layers}} couches' || true
          df -h / /mnt

  # L'image lite se deduit de la BASE, pas de osmo-operator : Dockerfile.lite
  # elague /opt/GSM puis aplatit le resultat (FROM scratch + COPY / - effacer
  # dans une couche de plus ne rend rien). C'est ce que fait build.sh:339.
  lite:
    needs: base
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disque pour docker
        uses: ./.github/actions/docker-disk

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'aplatissement (FROM scratch + COPY /) recopie la racine entiere :
      # c'est le job qui a le plus a ecrire, pour un job qui ne compile rien.
      # Raison de plus pour que la sortie parte au registre et non dans le
      # store local.
      - name: Build et push osmo-operator-lite
        env:
          BASE_IMAGE: ${{ needs.base.outputs.image }}
          IMG: ${{ env.REGISTRY }}/${{ needs.base.outputs.repo }}/osmo-operator-lite
        run: |
          TAGS=(-t "$IMG:sha-${GITHUB_SHA::7}")
          [ "${GITHUB_REF_TYPE}" = "tag" ]  && TAGS+=(-t "$IMG:${GITHUB_REF_NAME}")
          [ "${GITHUB_REF_NAME}" = "main" ] && TAGS+=(-t "$IMG:latest")
          docker buildx build -f Dockerfile.lite \
            --build-arg BASE="$BASE_IMAGE" \
            "${TAGS[@]}" --push .
          echo "--- taille publiee ---"
          docker buildx imagetools inspect "$IMG:sha-${GITHUB_SHA::7}" || true
          df -h / /mnt
