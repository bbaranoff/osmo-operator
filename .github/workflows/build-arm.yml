name: Build images SD (arm64 / Armbian - Raspberry Pi 4, Orange Pi 5)

# La MEME pile que les ISO x86, construite pour arm64 et livree en IMAGES SD
# par le framework officiel github.com/armbian/build : c'est le chemin --arm de
# build-iso.sh, qui passe la main a armbian/build-armbian.sh. Armbian fabrique
# noyau, BSP, u-boot/firmware, rootfs et image pour chaque carte ; la pile y
# est posee par armbian/userpatches/customize-image.sh, depuis l'image Docker
# arm64 publiee par docker-arm.yml (job amont).
#
# [2026-10-24] Une image PAR CARTE, un job par carte (matrice) : Armbian ne
# construit qu'une carte par compile.sh, et sept cartes a la suite ne tiendraient
# pas dans les 6 h d'un job heberge. Les cartes :
#   rpi4b                      Raspberry Pi 4
#   orangepi5, orangepi5b, orangepi5-plus, orangepi5pro,
#   orangepi5-max, orangepi5-ultra      toutes les Orange Pi 5 (la Max et
#                              l'Ultra ont leur propre fichier de carte)
# La branche noyau est choisie par carte (build-armbian.sh : current, sinon la
# premiere proposee - edge pour la 5B).
#
# ── POURQUOI UN RUNNER arm64 ET PAS L'EMULATION ────────────────────────────
# Sur un hote x86, le chroot de customize-image.sh tourne sous qemu-user :
# c'est lent, et un job heberge est TUE a 6 heures. Les runners arm64 heberges
# (ubuntu-24.04-arm) font tout NATIVEMENT. C'est le defaut ; l'entree `runner`
# permet de demander un hote x86 pour verifier le chemin emule.
#
# ── LE BUREAU ───────────────────────────────────────────────────────────────
# desktop=true : GNOME (DESKTOP_ENVIRONMENT=gnome, DESKTOP_TIER=minimal, via
# armbian/configng) + le bureau du banc (fond, Conky, encart, icones, c123).
# GLava n'y est pas : le cercle NCS veut OpenGL >= 4.2, absent des GPU de ces
# cartes sous Mesa. Pas de 4G non plus (srsRAN/Open5GS non compiles en aarch64).

on:
  push:
    tags: ["rpi-*", "arm-*", "opi-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (v0.1-8 kept in reserve)"
        type: string
        default: "v0.1-9"
      boards:
        description: "Cartes : all, rpi4, opi5, ou des noms Armbian separes par des virgules (orangepi5-max,rpi4b)"
        type: string
        default: "all"
      desktop:
        description: "Bureau GNOME + bureau du banc (--desktop)"
        type: boolean
        default: true
      runner:
        description: "Hote de construction"
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm   # natif aarch64 : le seul qui tienne dans les 6 h
          - ubuntu-24.04       # x86 + qemu-user : lent, sera coupe a 6 h
      release:
        description: "Create GitHub Release"
        type: boolean
        default: true
      no_cache:
        description: "Rebuild Docker images without cache (--no-cache)"
        type: boolean
        default: false

concurrency:
  group: build-arm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── EN AMONT : l'image Docker arm64 de la pile (docker-arm.yml) ─────────────
  docker-arm:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-arm.yml
    with:
      rebuild: false
      no_cache: ${{ github.event.inputs.no_cache == 'true' }}

  # ── La liste des cartes -> la matrice ───────────────────────────────────────
  # Memes groupes que build-armbian.sh (--board=rpi4|opi5|all). Sur un push de
  # tag les entrees sont VIDES : toutes les cartes, avec bureau.
  boards:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      desktop: ${{ steps.m.outputs.desktop }}
      kernels: ${{ steps.m.outputs.kernels }}
      reps: ${{ steps.m.outputs.reps }}
      armbian_ref: ${{ steps.m.outputs.armbian_ref }}
    steps:
      - id: m
        run: |
          IN='${{ github.event.inputs.boards }}'; IN=${IN:-all}
          OPI5="orangepi5 orangepi5b orangepi5-plus orangepi5pro orangepi5-max orangepi5-ultra"
          L=""
          for b in ${IN//,/ }; do
            case "$b" in
              rpi4|rpi4b) L="$L rpi4b" ;;
              opi5)       L="$L $OPI5" ;;
              all)        L="$L rpi4b $OPI5" ;;
              *)          L="$L $b" ;;
            esac
          done
          M=$(echo $L | tr ' ' '\n' | awk 'NF && !vu[$0]++' | jq -R . | jq -cs .)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          # ── UN NOYAU PAR CLE famille/branche, pas par carte ──────────────
          # Cinq Orange Pi 5 partagent rockchip-rk3588/current, orangepi5b n a
          # pas de branche current (rockchip-rk3588/edge), la Pi 4 a bcm2711 :
          # la cle vient des fichiers de cartes d Armbian (build-armbian.sh
          # --kernel-keys, clone sparse de config/boards), jamais du nom. Le
          # job `kernel` construit une fois par cle (carte representante =
          # premiere carte de la cle) et la matrice recupere ses .deb.
          # Le commit armbian/build du clone est celui de TOUT le run (kernel
          # et matrice) : le hash de l artefact noyau en depend.
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/armbian/build "$RUNNER_TEMP/armbian"
          git -C "$RUNNER_TEMP/armbian" sparse-checkout set --no-cone /config/boards /compile.sh >/dev/null
          REF=$(git -C "$RUNNER_TEMP/armbian" rev-parse HEAD)
          chmod +x armbian/build-armbian.sh
          ./armbian/build-armbian.sh --kernel-keys --board=$(echo $L | tr ' ' ',') --armbian-dir="$RUNNER_TEMP/armbian" > keys.tsv
          cat keys.tsv
          KJ=$(awk -F'\t' '!vu[$2]++ {print $1}' keys.tsv | jq -R . | jq -cs .)
          RJ=$(awk -F'\t' '{ if (!($2 in rep)) rep[$2]=$1; printf "%s\t%s\n", $1, rep[$2] }' keys.tsv \
               | jq -R 'split("\t") | {(.[0]): .[1]}' | jq -cs add)
          echo "kernels=$KJ" >> "$GITHUB_OUTPUT"
          echo "reps=$RJ" >> "$GITHUB_OUTPUT"
          echo "armbian_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "cartes : $M ; noyaux (representantes) : $KJ ; representante par carte : $RJ ; armbian/build $REF ; bureau : ${D:-true}"
          D='${{ github.event.inputs.desktop }}'
          echo "desktop=${D:-true}" >> "$GITHUB_OUTPUT"
          echo "cartes : $M ; bureau : ${D:-true}"

  # ── Le noyau, une fois par famille (~45 min) : .deb en artefact ───────────
  # Avant ce job, chaque carte de la matrice recompilait le meme noyau
  # rockchip-rk3588 (cinq fois 45 min pour les Orange Pi 5). compile.sh kernel
  # ne fait que l artefact noyau ; la matrice le retrouve dans output/debs/ et
  # Armbian, qui y voit l artefact deja construit, passe directement au rootfs.
  kernel:
    needs: boards
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(needs.boards.outputs.kernels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/docker-disk
        with:
          need: "20"

      - name: Repertoire Armbian
        run: |
          pick() { df -P "$1" 2>/dev/null | awk 'NR==2{print $4}'; }
          BASE=/; [ "$(pick /mnt || echo 0)" -gt "$(pick /)" ] 2>/dev/null && BASE=/mnt
          sudo mkdir -p "$BASE/armbian-build"
          echo "ARMBIAN_DIR=$BASE/armbian-build" >> "$GITHUB_ENV"

      - name: Noyau ${{ matrix.rep }}
        run: |
          ( while true; do
              echo "[temoin] $(date -u +%H:%M:%S)  / $(df -h --output=avail / | tail -1 | tr -d ' ')  mem dispo $(free -m | awk '/^Mem:/{print $7}') Mo"
              sleep 120
            done ) &
          TEMOIN=$!; trap 'kill $TEMOIN 2>/dev/null || true' EXIT
          chmod +x armbian/build-armbian.sh
          sudo env ARMBIAN_DIR="$ARMBIAN_DIR" ARMBIAN_REF='${{ needs.boards.outputs.armbian_ref }}' \
               ./armbian/build-armbian.sh --kernel-only --board=${{ matrix.rep }}
          sudo tar -C "$ARMBIAN_DIR/output/debs" -cf "kernel-debs-${{ matrix.rep }}.tar" .
          sudo chown "$(id -u)" "kernel-debs-${{ matrix.rep }}.tar"
          tar -tf "kernel-debs-${{ matrix.rep }}.tar" | grep 'linux-' ; ls -lh "kernel-debs-${{ matrix.rep }}.tar"

      - name: Upload kernel .deb
        uses: actions/upload-artifact@v6
        with:
          name: kernel-debs-${{ matrix.rep }}
          path: kernel-debs-${{ matrix.rep }}.tar
          retention-days: 7
          compression-level: 0

  build:
    needs: [docker-arm, boards, kernel]
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false            # une carte qui casse n'emporte pas les autres
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.matrix) }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Architecture de l'hote
        run: |
          HOST=$(dpkg --print-architecture)
          echo "hote : $HOST  ($(uname -m), $(nproc) coeurs, $(free -g | awk '/^Mem:/{print $2}') Go) ; carte ${{ matrix.board }}"
          if [ "$HOST" = "arm64" ]; then
            echo "::notice::Hote aarch64 : construction Armbian NATIVE."
          else
            echo "::warning::Hote $HOST : le chroot arm64 sera EMULE (qemu-user-static). Ce job est coupe a 6 h."
          fi

      # Menage + /var/lib/docker sur le plus grand disque.
      - uses: ./.github/actions/docker-disk
        with:
          need: "40"

      # Le clone armbian/build (cache noyau, rootfs, image) sur le disque qui a
      # le plus de place : une image Armbian avec bureau en demande ~30 Go.
      - name: Repertoire Armbian
        run: |
          pick() { df -P "$1" 2>/dev/null | awk 'NR==2{print $4}'; }
          BASE=/; [ "$(pick /mnt || echo 0)" -gt "$(pick /)" ] 2>/dev/null && BASE=/mnt
          D="$BASE/armbian-build"
          sudo mkdir -p "$D"
          echo "ARMBIAN_DIR=$D" >> "$GITHUB_ENV"
          echo "armbian/build -> $D ($(df -h --output=avail "$BASE" | tail -1 | tr -d ' ') libres)"

      - name: Swap anti-OOM
        run: |
          pick() { df -P "$1" 2>/dev/null | awk 'NR==2{print $4}'; }
          AV_ROOT=$(pick /); AV_MNT=$(pick /mnt)
          BASE=/; [ -n "$AV_MNT" ] && [ "${AV_MNT:-0}" -gt "${AV_ROOT:-0}" ] && BASE=/mnt
          FREE_GB=$(( $(pick "$BASE") / 1024 / 1024 ))
          SWAP_GB=8; THIRD=$(( FREE_GB / 4 ))
          [ "$SWAP_GB" -gt "$THIRD" ] && SWAP_GB=$THIRD
          [ "$SWAP_GB" -lt 2 ] && SWAP_GB=2
          SF="$BASE/osmo-swapfile"
          sudo swapoff "$SF" 2>/dev/null || true; sudo rm -f "$SF"
          sudo fallocate -l ${SWAP_GB}G "$SF" 2>/dev/null \
            || sudo dd if=/dev/zero of="$SF" bs=1M count=$((SWAP_GB*1024)) status=none
          sudo chmod 600 "$SF"; sudo mkswap "$SF" >/dev/null; sudo swapon "$SF"
          echo "swap +${SWAP_GB} Go sur $BASE"

      # La base arm64 vient de GHCR (job docker-arm) : tiree ICI, sous le compte
      # runner qui porte les identifiants GHCR (build-iso.sh tourne sous sudo).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image de base arm64 depuis GHCR
        run: |
          REF='${{ needs.docker-arm.outputs.image }}'
          docker pull --platform linux/arm64 "$REF"
          echo "BASE_REF=$REF" >> "$GITHUB_ENV"
          echo "::notice::Base arm64 : $REF"

      # Les .deb du noyau de la famille de cette carte (job kernel), extraits
      # dans un dossier que build-armbian.sh copie dans output/debs/.
      - name: Noyau prebuild (job kernel)
        uses: actions/download-artifact@v6
        with:
          name: kernel-debs-${{ fromJSON(needs.boards.outputs.reps)[matrix.board] }}
          path: ${{ runner.temp }}/kernel-tar
      - name: Extraire les .deb du noyau
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-debs"
          tar -C "$RUNNER_TEMP/kernel-debs" -xf "$RUNNER_TEMP"/kernel-tar/kernel-debs-*.tar
          echo "ARMBIAN_KERNEL_DEBS=$RUNNER_TEMP/kernel-debs" >> "$GITHUB_ENV"
          find "$RUNNER_TEMP/kernel-debs" -name 'linux-*.deb' -printf '%f\n'

      # build-iso.sh --arm -> armbian/build-armbian.sh (iso_modules/00-options.sh).
      # --skip-build=REF : la pile vient de l'image tiree, rien n'est compile ici.
      # ARMBIAN_REF / ARMBIAN_KERNEL_DEBS : meme framework que le job kernel, et
      # ses .deb : Armbian ne recompile pas le noyau, seulement rootfs + image.
      # Temoin disque/memoire EN DIRECT dans le journal du build : compile.sh
      # (rootfs + bureau, ~30 Go) n'a encore jamais tourne en CI ; si le runner
      # tombe, ses dernieres mesures restent dans le journal envoye au fil de l'eau.
      - name: Build image Armbian (${{ matrix.board }})
        run: |
          ( while true; do
              echo "[temoin] $(date -u +%H:%M:%S)  / $(df -h --output=avail / | tail -1 | tr -d ' ')  mem dispo $(free -m | awk '/^Mem:/{print $7}') Mo  swap libre $(free -m | awk '/^Swap:/{print $4}') Mo"
              sleep 60
            done ) &
          TEMOIN=$!; trap 'kill $TEMOIN 2>/dev/null || true' EXIT
          chmod +x build-iso.sh armbian/build-armbian.sh
          ARGS="--arm --board=${{ matrix.board }} --skip-build=$BASE_REF"
          [ "${{ needs.boards.outputs.desktop }}" = "true" ] && ARGS="$ARGS --desktop"
          echo "::notice::build-iso.sh $ARGS"
          # sudo env ... : sudoers est en env_reset sans SETENV sur un runner.
          sudo env ARMBIAN_DIR="$ARMBIAN_DIR" ARMBIAN_REF='${{ needs.boards.outputs.armbian_ref }}' \
                   ARMBIAN_KERNEL_DEBS="$ARMBIAN_KERNEL_DEBS" ./build-iso.sh $ARGS
          df -h / /mnt || true

      # Le nom d'Armbian (Armbian-unofficial_<version>_<Carte>_noble_<branche>_<noyau>[_gnome_desktop].img)
      # devient un nom stable par carte, pour les sommes et la Release.
      - name: Renommer, sommes, compresser
        run: |
          IMG=$(ls -t "$ARMBIAN_DIR"/output/images/*.img 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "::error::pas d image dans $ARMBIAN_DIR/output/images/"; exit 1; }
          SUF=""; [ "${{ needs.boards.outputs.desktop }}" = "true" ] && SUF="-desktop"
          OUT="osmo-operator-${{ matrix.board }}${SUF}.img"
          sudo mv "$IMG" "$OUT"; sudo chown "$(id -u):$(id -g)" "$OUT"
          echo "$(basename "$IMG") -> $OUT ($(du -h "$OUT" | cut -f1))"
          sha256sum "$OUT" > "SHA256SUMS-${{ matrix.board }}"
          md5sum    "$OUT" > "MD5SUMS-${{ matrix.board }}"
          zstd -T0 -9 --sparse --rm -q -o "$OUT.zst" "$OUT"
          ls -lh "$OUT.zst"

      # Une Release GitHub refuse tout fichier de plus de 2 Gio : on ne decoupe
      # QUE ce qui depasse. SHA256SUMS porte sur l'image brute.
      - name: Split over 2 GiB
        run: |
          LIMIT=$((2 * 1024 * 1024 * 1024))
          : > "PARTS-${{ matrix.board }}.sha256"
          for z in ./osmo-operator-*.img.zst; do
            [ -f "$z" ] || continue
            if [ "$(stat -c%s "$z")" -gt "$LIMIT" ]; then
              split -b 1900M -d -a 2 "$z" "${z}.part-"
              sha256sum "${z}".part-* >> "PARTS-${{ matrix.board }}.sha256"
              rm -f "$z"
            fi
          done
          ls -lh ./osmo-operator-*.img.zst* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: osmo_egprs-${{ matrix.board }}
          path: |
            osmo-operator-*.img.zst*
            SHA256SUMS-*
            MD5SUMS-*
            PARTS-*.sha256
          retention-days: 14
          compression-level: 0

  # ── La Release : toutes les cartes reussies, sommes fusionnees ──────────────
  release:
    needs: [boards, build]
    if: always() && needs.build.result != 'cancelled' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: osmo_egprs-*
          merge-multiple: true
      - name: Fusionner les sommes
        run: |
          ls osmo-operator-*.img.zst* >/dev/null 2>&1 || { echo "::error::aucune image produite"; exit 1; }
          cat SHA256SUMS-* > SHA256SUMS; cat MD5SUMS-* > MD5SUMS; cat PARTS-*.sha256 > PARTS.sha256 2>/dev/null || : > PARTS.sha256
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Pas github.ref_name tout seul : sur un workflow_dispatch il vaut « main »
          # et l'action creerait un TAG main, ambigu avec la branche.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version || 'v0.1-9' }}
          name: "osmo_egprs — images SD arm64 (Armbian : Raspberry Pi 4, Orange Pi 5) — ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version || 'v0.1-9' }}"
          draft: false
          prerelease: ${{ !(startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')) }}
          body: |
            ## osmo_egprs — images SD arm64 (Armbian)

            La meme pile que les ISO x86, construite pour aarch64 par le framework
            [armbian/build](https://github.com/armbian/build) (Ubuntu 24.04 noble).
            Une image **persistante** par carte, ${{ needs.boards.outputs.desktop == 'true' && 'avec le bureau GNOME du banc (fond GSM LAB, Conky, icones, `c123`)' || 'sans bureau (console et ssh)' }}.

            | Image | Carte |
            |---|---|
            | `osmo-operator-rpi4b*.img.zst` | Raspberry Pi 4 |
            | `osmo-operator-orangepi5*.img.zst` | Orange Pi 5 |
            | `osmo-operator-orangepi5b*.img.zst` | Orange Pi 5B (noyau edge) |
            | `osmo-operator-orangepi5-plus*.img.zst` | Orange Pi 5 Plus |
            | `osmo-operator-orangepi5pro*.img.zst` | Orange Pi 5 Pro |
            | `osmo-operator-orangepi5-max*.img.zst` | Orange Pi 5 Max |
            | `osmo-operator-orangepi5-ultra*.img.zst` | Orange Pi 5 Ultra |

            ### Graver

            ```bash
            zstd -dc osmo-operator-<carte>.img.zst \
              | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
            ```

            Au premier demarrage Armbian etend la racine a la taille de la carte.
            Comptes : `root:osmo`, `osmocom:osmo`.

            ### Verifier

            `SHA256SUMS` porte sur l'image **brute** : `zstd -d <image>.zst && sha256sum -c SHA256SUMS --ignore-missing`.
            Ce qui depasse 2 Gio est decoupe (`PARTS.sha256`) : `cat <image>.zst.part-* > <image>.zst`.

            ### Ce que ces images n'ont pas

            Pas de 4G (srsRAN et Open5GS ne sont pas compiles pour aarch64) ni de
            GLava (OpenGL >= 4.2 requis). La 2G/EDGE est entiere.
          files: |
            osmo-operator-*.img.zst*
            SHA256SUMS
            MD5SUMS
            PARTS.sha256
