name: Build ISO

# Trois images, une seule chaine :
#   interstp.iso            le hub SS7 (PC 0.0.0), aucun operateur
#   osmo-operator.iso       un noeud - UNE image pour les 9 : le numero se
#                           choisit au demarrage (start-direct.sh --node N)
#   osmo-operator-lite.iso  le meme noeud, construit depuis l'image d'execution
#                           elaguee (Dockerfile.lite) : les ateliers de
#                           compilation de /opt/GSM ne partent pas dans le
#                           squashfs. Ce qui tourne est identique.
#
# Les trois dans UN SEUL job, et dans cet ordre : la lite se greffe sur l'image
# osmocom-run que la passe operateur vient de construire. Dans un job separe, le
# runner repartirait de zero - deux heures de compilation pour le meme resultat.
#
# --kb=us : build-iso.sh pose sa question du clavier AU DEBUT. Sans terminal il
# prend deja son defaut sans attendre - le job ne peut pas se bloquer dessus -
# mais on l'ecrit pour que l'image de CI ne dependent pas de ce defaut.

on:
  push:
    tags: ["v*.*.*", "iso-*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release"
        type: boolean
        default: true
      no_cache:
        description: "Rebuild Docker images without cache (--no-cache)"
        type: boolean
        default: true
      build_docker:
        description: "Construire l'image de base ici, au lieu de la tirer de GHCR (--build-docker)"
        type: boolean
        default: false
      mode:
        description: "Quelles images construire"
        type: choice
        default: all
        options:
          - all       # les quatre en une passe
          - stp       # le hub SS7 seul (interstp.iso)
          - base      # le noeud complet (osmo-operator.iso)
          - lite      # le noeud sans les ateliers (osmo-operator-lite.iso)
          - desktop   # le noeud avec GNOME (osmo-operator-desktop.iso)
      pmos_image:
        description: "Embed the postmarketOS VM image (~1.7 GB per ISO, from the pmos-image release)"
        type: boolean
        default: false

jobs:
  build-iso:
    # [2026-09-13] noble, PAS jammy. L'ISO et le Dockerfile sont en 24.04
    # (ISO_UBUNTU par defaut dans iso_modules/00-options.sh, FROM ubuntu:24.04),
    # mais le runner etait en 22.04 : l'hote du build etait donc d'une suite
    # differente de ce qu'il construit. Deux consequences concretes -
    #   - le debootstrap de jammy ne connait pas « noble » : 40-rootfs.sh s'en
    #     tire en liant le script gutsy, mais c'est un contournement ;
    #   - packaging/osmo-deb.sh lit VERSION_CODENAME de l'HOTE pour nommer les
    #     .deb : tout ce qui se compile cote hote sortait en « ~jammy », et un
    #     .deb jammy n'est jamais pose sur un rootfs noble (osmo-deb.sh:43).
    # Un runner noble aligne les trois.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # L'EMPREINTE DU CONTEXTE. La meme commande que docker.yml (job `base`) :
      # elle nomme l'image de base publiee sur GHCR, et elle sert de cle au
      # cache .deb. Calculee ici, une seule fois, parce que les deux en ont
      # besoin et qu'elles doivent parler de la meme chose.
      - name: Empreinte du contexte
        id: key
        run: |
          KEY=$(git ls-files -- Dockerfile packaging configs scripts services \
                                helpers opt-gsm tools patches \
                | sort | xargs sha256sum | sha256sum | cut -c1-16)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Empreinte du contexte : $KEY"

      # Les trois ISO plus les images Docker intermediaires tiennent tout juste
      # dans un runner : on fait la place avant, pas apres l'echec.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo apt-get remove -y '^dotnet-.*' 'php.*' 'mongodb.*' \
            'mysql.*' azure-cli google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune -af || true
          df -h / /mnt

      # [2026-09-13] Le job mourait en « exporting layers » sur exit 143 : pas
      # une erreur de docker (il n'ecrit rien), un SIGTERM recu de l'exterieur -
      # la partition / du runner arrivait a saturation et le runner lui-meme
      # tombait. Trois gros consommateurs partageaient / :
      #   /var/lib/docker    base ~11 Go, et on en construit QUATRE variantes
      #   /var/tmp/iso-build-$$   le rootfs decompresse (build-iso.sh:33)
      #   le workspace       les quatre .iso
      # Le runner a un SECOND disque, /mnt, ~70 Go, inutilise. On y met le store
      # docker : le rootfs et les ISO gardent / pour eux seuls.
      - name: Docker data-root sur /mnt
        run: |
          sudo systemctl stop docker docker.socket containerd || true
          # Deplacer, pas recopier : le store contient deja les images de base
          # tirees par le runner. Si /mnt/docker existe (re-run sur le meme
          # runner), on le garde plutot que d'ecraser un store valide.
          [ -d /mnt/docker ] || sudo mv /var/lib/docker /mnt/docker
          echo '{ "data-root": "/mnt/docker" }' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info 2>/dev/null | grep -i 'docker root dir'
          df -h / /mnt

      # Un exit 143 ne dit rien de ce qui manquait. Ce temoin ecrit disque et
      # memoire toutes les 30 s dans un fichier relu en fin de job (if: always),
      # y compris quand l'etape de build est tuee sans un mot.
      - name: Temoin disque/memoire
        run: |
          nohup bash -c 'while true; do
            printf "[%s] / %s  /mnt %s  mem %s\n" \
              "$(date -u +%H:%M:%S)" \
              "$(df -h --output=avail / | tail -1 | tr -d " ")" \
              "$(df -h --output=avail /mnt | tail -1 | tr -d " ")" \
              "$(free -m | awk "/^Mem:/{print \$3\"/\"\$2\" Mo\"}")"
            sleep 30
          done' > "$RUNNER_TEMP/watchdog.log" 2>&1 &
          echo "temoin demarre -> $RUNNER_TEMP/watchdog.log"

      # ── Le cache .deb entre deux runs ───────────────────────────────────
      # Ce que le Dockerfile compile (libosmocore, osmo-*, gnuradio, gr-gsm,
      # QEMU, osmocom-bb, pmbootstrap...) sort en paquet .deb dans
      # /var/cache/osmo-debs (packaging/osmo-deb.sh). build.sh recopie ce
      # dossier dans .deb-cache/ AVANT le build - le Dockerfile le prend par
      # `COPY .deb-cache/ /var/cache/osmo-debs/` - et y remet APRES les paquets
      # que l'image vient de produire (debs_from_image). Sur l'hote c'est ce
      # qui fait passer un rebuild de 1h23 a quelques minutes ; un runner,
      # lui, repart vierge a chaque fois. On lui rend la memoire.
      #
      # Le dossier appartient a root (build.sh tourne sous sudo) : il faut le
      # creer AVANT que actions/cache y ecrive, et le rendre au runner APRES
      # le build pour que le post-step puisse le relire.
      # SUR /mnt, PAS SUR /. Ce job est le seul des deux ou / est la partition
      # serree : le rootfs decompresse, le squashfs et les quatre ISO y tiennent
      # tout juste. Les 2-4 Go du cache .deb iraient s'ajouter a ca, alors que
      # /mnt en a 68 de libres. build.sh, build-iso.sh et 50-injection-image.sh
      # lisent tous OSMO_DEB_CACHE : il suffit de le leur dire.
      # Repli sur / si le deplacement de docker plus haut a renonce a /mnt.
      - name: Preparer le cache .deb
        run: |
          # Pas de repli conditionnel : `path:` du step suivant est statique,
          # un chemin qui divergerait ici ne serait pas celui qu'on sauvegarde.
          # /mnt existe sur tout runner heberge ; ailleurs, mkdir -p le cree sur
          # / et on retombe simplement sur l'ancien comportement.
          CACHE=/mnt/osmo-debs
          sudo mkdir -p "$CACHE"
          sudo chown -R "$(id -u):$(id -g)" "$CACHE"
          echo "OSMO_DEB_CACHE=$CACHE" >> "$GITHUB_ENV"
          echo "cache .deb : $CACHE"

      - name: Cache .deb (osmo-deb)
        uses: actions/cache@v4
        with:
          path: /mnt/osmo-debs
          # CLE = L'EMPREINTE DU CONTEXTE, pas le numero du run.
          # [2026-09-13] C'etait `${{ github.run_id }}`, donc une entree NEUVE a
          # chaque passage. A 2-4 Go l'entree et 10 Go de quota par depot,
          # l'eviction LRU detruisait le cache au bout de trois runs. Les .deb
          # portent leur nom et leur version, osmo-deb.sh trie : le prefixe
          # reprend la plus recente, et ce qui n'a pas bouge reste valable.
          key: osmo-debs-noble-${{ steps.key.outputs.key }}
          restore-keys: |
            osmo-debs-noble-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── L'image de base vient de GHCR quand elle y est deja ───────────────
      # Le workflow Docker (docker.yml) publie osmocom-nitb:base-<empreinte>,
      # l'empreinte etant le SHA de tout ce que le Dockerfile prend dans le
      # contexte. MEME COMMANDE ici, au caractere pres : si elle donne la meme
      # valeur, l'image publiee correspond exactement a ce commit, et il n'y a
      # aucune raison de recompiler 1h23 pour la refabriquer a l'identique.
      # build-iso.sh la tague osmocom-nitb et la chaine continue sans rien
      # savoir de sa provenance (--skip-build, iso_modules/21-docker-build.sh).
      #
      # Le pull se fait ICI, sous le compte runner qui porte les identifiants
      # GHCR - build-iso.sh tourne sous sudo, et le ~/.docker de root n'en a
      # pas. L'image etant alors locale, le module ne retire rien.
      - name: Image de base depuis GHCR
        run: |
          if [ "${{ github.event.inputs.build_docker }}" = "true" ]; then
            echo "ISO_DOCKER_SRC=--build-docker" >> "$GITHUB_ENV"
            echo "::notice::--build-docker demande : l'image de base sera construite ici."
            exit 0
          fi
          KEY='${{ steps.key.outputs.key }}'
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          REF="ghcr.io/${REPO}/osmocom-nitb:base-${KEY}"
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            docker pull "$REF"
            echo "ISO_DOCKER_SRC=--skip-build=$REF" >> "$GITHUB_ENV"
            echo "::notice::Base tiree de GHCR : $REF - pas de compilation."
            # Les .deb de l'image rejoignent le cache de l'hote : c'est la que
            # 50-injection-image.sh va les chercher pour poser la pile dans le
            # rootfs (il sait retomber sur l'image, mais un dpkg vaut mieux
            # qu'un docker cp integral).
            mkdir -p /tmp/debs-out
            cid=$(docker create "$REF" /bin/true)
            docker cp "$cid:/var/cache/osmo-debs/." /tmp/debs-out/ 2>/dev/null || true
            docker rm "$cid" >/dev/null
            cp -f /tmp/debs-out/osmo-build-*.deb "$OSMO_DEB_CACHE/" 2>/dev/null || true
            rm -rf /tmp/debs-out
            echo "cache .deb : $(find "$OSMO_DEB_CACHE" -name 'osmo-build-*.deb' | wc -l) paquets"
          else
            echo "ISO_DOCKER_SRC=" >> "$GITHUB_ENV"
            echo "::notice::Pas de base publiee pour l'empreinte $KEY - construction locale."
          fi
          df -h / /mnt

      # Les paquets hote (squashfs-tools, xorriso, grub*, mtools, debootstrap...)
      # sont installes par build-iso.sh lui-meme.

      # Le hub d'abord : il ne depend ni de build.sh ni de l'image osmocom-run,
      # donc un echec de son cote se voit en minutes plutot qu'en heures.
      # --all : interstp + operator + operator-lite + operator-desktop en UNE
      # passe. build-iso.sh greffe lite et desktop sur l'image osmocom-run que la
      # passe operateur vient de produire, et retire --no-cache pour ces passes
      # greffees : inutile de separer en plusieurs etapes. On rend le cache buildx
      # avant - QUATRE ISO plus les images intermediaires, le disque du runner
      # decide si le job passe.
      - name: Build ISOs
        run: |
          chmod +x build-iso.sh
          df -h /
          # ── QUELLES IMAGES ────────────────────────────────────────────
          # Sur un push de tag les entrees de workflow_dispatch sont VIDES :
          # le defaut reste "all", c'est-a-dire le comportement d'avant ce
          # choix. Les autres modes servent a reprendre UNE image sans
          # repayer les trois autres - un theme plymouth a revoir, un
          # installeur a retester, le hub qui sort en minutes.
          #
          # CE QUE COUTE UN MODE SEUL : hors "all", build-iso.sh n'a pas de
          # rootfs frere a reprendre (le greffage lite/desktop sur le rootfs
          # de la normale n'existe que dans la passe --all). Chaque image
          # refait donc son rootfs de zero. Pour les quatre, "all" reste
          # nettement moins cher que quatre runs.
          case "${{ github.event.inputs.mode }}" in
            ""|all)  ISO_ARGS="--all" ;;
            stp)     ISO_ARGS="--role=interstp" ;;
            base)    ISO_ARGS="--role=operator --output=osmo-operator.iso" ;;
            lite)    ISO_ARGS="--role=operator --lite --output=osmo-operator-lite.iso" ;;
            desktop) ISO_ARGS="--role=operator --desktop --output=osmo-operator-desktop.iso" ;;
            *) echo "::error::mode inconnu : ${{ github.event.inputs.mode }}"; exit 2 ;;
          esac
          echo "::notice::mode ${{ github.event.inputs.mode || 'all' }} -> build-iso.sh $ISO_ARGS"
          # [2026-09-13] DEFAUT INVERSE. C'etait NO_CACHE="--no-cache" avec un
          # repli sur "" quand l'entree valait "false" - mais sur un push les
          # entrees de workflow_dispatch sont VIDES, jamais "false" : chaque
          # push forcait donc --no-cache, donc OSMO_DEB_REFRESH=1, donc les 51
          # RUN de compilation refaits integralement. 1h23 a chaque fois, pour
          # des sources qui n'avaient pas bouge. Le plein rebuild reste
          # accessible, mais il se demande.
          NO_CACHE=""
          [ "${{ github.event.inputs.no_cache }}" = "true" ] && NO_CACHE="--no-cache"
          # L'image de la VM postmarketOS (qemu-amd64.img.zst, 1,7 Go) n'existe
          # pas sur un runner : 88-lte-pmos.sh la telecharge depuis l'asset de
          # Release quand on lui donne l'URL. UNE fois telechargee, elle est
          # embarquee dans CHAQUE ISO (operator, lite, desktop) - +5 Go de
          # disque et d'artefacts, d'ou le defaut a false. Sans elle, le premier
          # clic sur le telephone fait un "pmbootstrap install" complet.
          # sudo env ... : sur un runner, sudoers est en env_reset sans SETENV,
          # « sudo -E » et « sudo VAR=x » peuvent etre refuses ; env(1) lance en
          # root, lui, passe toujours.
          sudo env OSMO_PMOS_IMAGE_URL="$OSMO_PMOS_IMAGE_URL" \
                   OSMO_HOST_DOCKER="$OSMO_HOST_DOCKER" \
                   OSMO_DEB_CACHE="$OSMO_DEB_CACHE" \
               ./build-iso.sh $NO_CACHE $ISO_DOCKER_SRC --kb=us $ISO_ARGS
          # `|| true` : hors mode "all" les autres .iso n'existent pas, et un
          # ls qui ne trouve pas un de ses arguments sort en statut 2 - le
          # shell des steps tourne avec -e, la derniere commande decide.
          ls -lh ./*.iso 2>/dev/null || true
          df -h /
        env:
          OSMO_PMOS_IMAGE_URL: ${{ github.event.inputs.pmos_image == 'true' && (vars.PMOS_IMAGE_URL || 'https://github.com/bbaranoff/osmo-operator/releases/download/pmos-image/qemu-amd64.img.zst') || '' }}
          # Le runner a deja docker, compose v2 et buildx (paquets moby-*), et
          # docker.io entre en conflit avec eux : apt repond « pkgProblemResolver
          # generated breaks » et build.sh s'arretait la. Rien a installer ici.
          OSMO_HOST_DOCKER: "0"

      # build.sh a tourne sous sudo : les .deb qu'il vient de deposer sont a
      # root, et le post-step d'actions/cache tourne en runner. Sans ce chown,
      # la sauvegarde du cache echoue en silence et le run suivant recompile.
      - name: Rendre le cache .deb au runner
        if: always()
        run: |
          CACHE="${OSMO_DEB_CACHE:-/var/cache/osmo-debs}"
          sudo chown -R "$(id -u):$(id -g)" "$CACHE" 2>/dev/null || true
          echo "$(find "$CACHE" -name 'osmo-build-*.deb' | wc -l) paquets, $(du -sh "$CACHE" | cut -f1)"

      # Apres le build, tue ou non : les dernieres mesures avant la fin.
      - name: Temoin - dernieres mesures
        if: always()
        run: tail -40 "$RUNNER_TEMP/watchdog.log" 2>/dev/null || echo "(pas de temoin)"

      - name: Checksums
        run: |
          # Aucune image n'est tenue pour acquise : avec --role=... une seule
          # est produite, et nommer les trois autres ferait echouer sha256sum.
          ISOS=""
          for iso in interstp.iso osmo-operator.iso \
                     osmo-operator-lite.iso osmo-operator-desktop.iso; do
              [ -f "$iso" ] && ISOS="$ISOS $iso"
          done
          [ -n "$ISOS" ] || { echo "::error::aucune ISO produite"; exit 1; }
          sha256sum $ISOS > SHA256SUMS
          md5sum    $ISOS > MD5SUMS
          cat SHA256SUMS

      # Une Release GitHub refuse tout fichier de plus de 2 Gio. On ne decoupe
      # QUE ce qui depasse : decouper une image de 1,3 Go obligerait a la
      # recombiner pour rien. Les sommes ci-dessus portent sur les ISO ENTIERES,
      # elles restent donc verifiables apres recombinaison.
      - name: Split ISOs over 2 GiB
        run: |
          LIMIT=$((2 * 1024 * 1024 * 1024))
          for iso in interstp.iso osmo-operator.iso osmo-operator-lite.iso osmo-operator-desktop.iso; do
            [ -f "$iso" ] || continue
            size=$(stat -c%s "$iso")
            if [ "$size" -gt "$LIMIT" ]; then
              echo "$iso : $size octets > 2 Gio -> decoupe"
              split -b 1900M -d -a 2 "$iso" "${iso}.part-"
              sha256sum "${iso}".part-* >> PARTS.sha256
              rm -f "$iso"          # seules les parties sont publiees
            else
              echo "$iso : $size octets -> publie tel quel"
            fi
          done
          touch PARTS.sha256
          ls -lh ./*.iso ./*.iso.part-* 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osmo_egprs-iso
          path: |
            interstp.iso*
            osmo-operator.iso*
            osmo-operator-lite.iso*
            osmo-operator-desktop.iso*
            SHA256SUMS
            MD5SUMS
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('iso-{0}', github.sha) }}
          name: "osmo_egprs ISO — ${{ github.ref_name || github.sha }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## osmo_egprs — images Live x86_64

            | Image | Role |
            |---|---|
            | `interstp.iso` | Le hub SS7 du WAN : PC `0.0.0`, aucun operateur. Il ne fait que router du M3UA entre les noeuds. |
            | `osmo-operator.iso` | Un noeud : coeur GSM complet (BSC / MSC / HLR / SGSN / GGSN). **Une seule image pour les 9 noeuds** — le numero se choisit au demarrage. |
            | `osmo-operator-lite.iso` | Le meme noeud, sans les ateliers de compilation de `/opt/GSM` (gnuradio, gr-gsm, libosmo*, objets de qemu). Ce qui tourne est identique : memes binaires, memes configs, meme emulation Calypso. Les depots gardent leur `.git`, donc `osmo-update` y fonctionne aussi. |
            | `osmo-operator-desktop.iso` | Le meme noeud avec un bureau GNOME (wireshark en fenetre, linphone-desktop) et le fond d'ecran GSM LAB. ~2,5 Go de plus : pour ce qui ne se pilote pas au VTY. |

            ### Demarrer

            ```bash
            # Le hub
            sudo ./start-interstp.sh --ip <IP du hub>

            # Un noeud : N de 1 a 9, les point codes en decoulent (1.<N>1.x)
            sudo ./start-direct.sh --node N
            ```

            L'adressage SS7 se pose avec `set_stp_ip.sh`, qui ecrit d'un coup
            osmo-stp, osmo-msc, osmo-bsc et la table WAN :

            ```bash
            sudo ./set_stp_ip.sh --inter    --ip <hub> --ips "<n1> <n2> <n3>"
            sudo ./set_stp_ip.sh --operator --node N --ip <son IP> --hub-ip <hub>
            ```

            Verifier l'interconnexion : `checks/diag-interstp.sh` cote hub,
            `checks/diag-stp-operator.sh` cote noeud.

            ### Fichiers volumineux

            Une Release GitHub plafonne a 2 Gio par fichier : les images plus
            grosses sont decoupees. Recombiner puis verifier :

            ```bash
            cat osmo-operator.iso.part-* > osmo-operator.iso
            sha256sum -c SHA256SUMS
            ```

            ### Essayer

            ```bash
            qemu-system-x86_64 -cdrom osmo-operator.iso -m 8G -enable-kvm \
              -cpu host -smp 4 -nic user,hostfwd=tcp::8080-:8080
            ```

            La racine du live est un tmpfs : prevoir la RAM (~6 Go en `toram`).
            Journaux et captures y sont bornes, et purges a chaque demarrage.
          files: |
            interstp.iso*
            osmo-operator.iso*
            osmo-operator-lite.iso*
            osmo-operator-desktop.iso*
            SHA256SUMS
            MD5SUMS
            PARTS.sha256
